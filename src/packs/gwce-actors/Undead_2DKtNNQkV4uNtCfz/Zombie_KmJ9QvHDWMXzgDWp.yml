    <p>A husk of bone and muscle, given false life by necromantic magic. It
    mindlessly serves the commands of its master, or as a corpse cursed to walk
    once again.</p><p><em><strong>When</strong> out of sight, <strong>it
    will</strong> quickly forget what it's doing.</em></p>
  notes: >-
    <p>@Embed[Compendium.grimwild.gwce-crucibles.RollTable.J58tChk9MjJcL4zB]{Zombie
    - Broken and Mangled}</p>
