name: Animated Objects
type: monster
img: icons/svg/poison.svg
system:
  biography: >-
    <p>Mundane items like chairs, swords, curtains, and suits of armor that
    spring to life with unnatural motion. They may be reasoned with or lash out,
    enacting their curses.</p><p><em><strong>When</strong> the curse is lifted,
    <strong>it will</strong> become human again.</em></p>
  notes: >-
    <p>@Embed[Compendium.grimwild.gwce-crucibles.RollTable.pj1u8waQqqUIumSa]{Animated
    Object - Personality All Its Own}</p>
