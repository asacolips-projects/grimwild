    <p>A large sentient tree-like protector of the forest. Often wise, and
    ancient, but slow to act or change their mind. They roam their home deep in
    thought.</p><p><em><strong>When</strong> it decides something,<strong> it
    will</strong> not change its mind.</em></p>
  notes: >-
    <p>@Embed[Compendium.grimwild.gwce-crucibles.RollTable.UhwxR5bbFAvnBwsG]{Treefolk
    - Forest Woes}</p>
