system:
  description: >-
    <p>Your presence instills fear in others. The GM judges an NPC’s response,
    or you can spend <em><strong>thread</strong></em> to set it:
    <em>hostile—nervous—respectful—scared</em>. You can <strong>push
    yourself</strong> to pull off a <em><strong>potent feat of
    intimidation</strong></em>, such as <em>staring down a dragon</em> or
    <em>demanding to see the king</em>.</p>
  core: false
  notes:
    description: >-
      <p><em>What exactly makes you so frightening to be around? This could
      merely be your appearance, but it could also be the way you talk, hold
      yourself, dress, reputation, or a combination thereof.</em></p>
