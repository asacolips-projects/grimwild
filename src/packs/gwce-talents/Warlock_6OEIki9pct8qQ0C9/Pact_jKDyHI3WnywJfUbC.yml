system:
  description: >-
    <p>You have magic bestowed by a patron, allowing you to make a story roll
    (usually 3d) to wield their magic as a weapon, or ask to channel a potent
    magical effect using their nature as the touchstone. They gift you an
    <strong>Eldritch Talent</strong>—a changeable path talent manifesting with
    your patron’s trappings. Given time to commune, you can change an Eldritch
    Talent.</p><p>You also have an <strong>8d Patience</strong> pool,
    representing service to your fickle patron’s desires. Roll the pool when you
    ask for a potent magical effect, change an <strong>Eldritch Talent</strong>,
    or otherwise displease them. At 0d, your patron will give you a visit to
    clear up the issue, then the pool resets.</p><hr><p><strong>GROWTH:</strong>
    At levels 3 and 6, gain +1 Eldritch Talent.</p>
