system:
  description: >-
    <p>Once per session you can challenge a foe, taking +1d on all rolls against
    them, but give them 1 <strong>suspense</strong>. If they do anything besides
    confront you, you can <em><strong>interrupt</strong></em> it. The challenge
    ends if an ally engages your foe, or your
    <em><strong>interrupt</strong></em> result is less than a perfect. You can
    <em><strong>push yourself</strong></em> to do it again.</p>
