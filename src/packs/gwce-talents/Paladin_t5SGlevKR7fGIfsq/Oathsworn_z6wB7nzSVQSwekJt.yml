system:
  description: >-
    <p>You draw power from your three tenets. When you add a thorn from
    <em><strong>bloodied</strong></em>, <em><strong>rattled</strong></em>, or
    <em><strong>desperate</strong></em> you also take +1d. Each session, you
    have <strong>3 smite</strong>. When acting with total conviction, spend it
    1-for-1 to drop dice from a task pool <em>after</em> rolling
    it.</p><p><strong>Affirmation:</strong> Before each session, state your
    tenets and discuss how they came up last session. Give
    <em><strong>spark</strong></em> to one player who joined a scene involving
    your tenets. Take 1 less <strong>smite</strong> for each tenet in
    violation.</p><hr><p><strong>GROWTH:</strong> At levels 2, 4, and 6, gain +1
    smite per session.</p>
