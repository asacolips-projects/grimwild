system:
  description: >-
    <p>You have spellcasting ability. Choose two bastions below which act as the
    touchstone for your psionic magic. You can cast spells using Wits, and can
    make them potent by adding instability, eventually adding increasing thorns
    to your future spellcasting rolls. You can’t cast potent spells once adding
    +2t from instability. Thorns from instability can't be ignored and reset at
    the beginning of each session. You gain more slots that don't add
    instability with growth.</p><hr><p><strong>GROWTH:</strong> At levels 3, and
    6, you gain +1 instability slot at 0t, and +1 bastion.</p>
