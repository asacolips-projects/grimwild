system:
  description: >-
    <p>You can catch small glimpses of the future. Once per session, you can
    describe a brief course of action while in a calm situation, and the GM will
    tell you the result. If there’s <em><strong>risk</strong></em>, make a
    montage roll to see how it would play out. Afterward, you can decide whether
    to take the action.</p>
