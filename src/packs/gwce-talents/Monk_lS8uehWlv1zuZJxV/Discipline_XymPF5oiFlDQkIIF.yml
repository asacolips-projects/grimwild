system:
  description: >-
    <p>Never face a disadvantage due to a weapon matchup. Once per session, you
    can <em><strong>interrupt</strong></em> with a: <em>philosophical
    point—quick reaction—stunning strike</em>. Each scene, you have <strong>4
    flow</strong>. Spend it to:</p><ul><li><p>Ignore thorns from: <em>being
    outnumbered—a single imposing opponent</em>.</p></li><li><p>Attempt a fluid
    maneuver. Before rolling, declare you want to also: <em>disarm them—redirect
    momentum—reposition you, them, or both. On a perfect or messy, it
    happens</em>.</p></li><li><p>Pull off a <em><strong>potent feat of mystical
    grace</strong></em>, like <em>running across water</em> or <em>falling
    harmlessly from a great height</em>. For 1 more <strong>flow</strong>,
    extend this to those you’re
    touching.</p></li></ul><hr><p><strong>GROWTH:</strong> At levels 3 and 6,
    gain =1 flow per scene and +1 interrupts per session.</p>
