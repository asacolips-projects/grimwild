system:
  description: >-
    <p>Two small magical motes float around you. Give them 2 traits such as:
    <em>annoying—melancholic—mesmerizing—petty—troublesome—whimsical</em>. You
    can <strong>sacrifice</strong> one to have it act independently, making a
    story roll if needed. They return each session.</p>
  core: false
  notes:
    description: >-
      <p><em>You could send one to assist an ally, distract a foe, light the
      way, or even pass a message to someone. The story roll here is about how
      effective they are, it doesn't prompt an impact move.</em></p>
