system:
  description: >-
    <p>You have spellcasting ability. You roll Presence to cast and your magic
    paths and techniques serve as touchstones. Your spells always carry
    <em><strong>risk</strong></em> and require a roll. You can <em><strong>push
    yourself</strong></em> to cast a potent spell. When casting, rolling two or
    more 1s (thorns included) triggers a <strong>magical twist</strong>. Choose
    any 4 of <strong>Magic Paths</strong> and <strong>Techniques</strong> (with
    at least 1 of each) and how your twists manifest below, or talk to the GM to
    make your own.</p><p>Magical twists: <em>wild surge (2d story roll for
    effect)—take vex—curse (+1 suspense)</em>.</p><p>Magic paths:
    <em>blood—decay—flame—frost—lux—shadow—stone—tempest</em>.</p><p><strong>Techniques:</strong>
    <em>attack—create—defend—enhance—hinder—influence—transform—traverse.</em></p><hr><p><strong>GROWTH:</strong>
    At levels 2, 4, and 6, gain a new magic path or technique.</p>
