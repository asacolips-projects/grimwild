system:
  description: >-
    <p>You understand the ancient magic inherent in the world. You have
    spellcasting ability, rolling Presence to cast using any 2 <strong>words of
    power</strong> as the touchstones. When you use a word, <strong>burn
    it</strong>—you can't use it again until the next session. Given time, you
    can make this spell potent. You begin with <strong>4 words of power</strong>
    from the crucible. Spells without <em><strong>risk</strong></em> are
    automatically successful and don’t burn words, unless
    potent.</p><p><strong>Ritualist:</strong> Take +1d when completing ritual
    invocations, and you can use relevant words of power as
    anchors.</p><hr><p><strong>GROWTH:</strong> At levels 3, and 6, you gain +2
    words of power.</p>
