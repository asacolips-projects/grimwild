system:
  description: >-
    <p>Once per session during an intense action sequence, you tag 3 scene
    elements right away, and 1 later in the sequence. When an ally interacts
    with a tagged element, you <em><strong>assist</strong></em> without risk on
    the roll. If no roll is needed, they <em><strong>take spark</strong></em>.
    You can <em><strong>push yourself</strong></em> to do it again.</p>
  core: false
  notes:
    description: >-
      <p><em>Scene elements may come from the GM's description, or they could be
      things that would logically be there. Establish details if needed, the GM
      will step it in if it's too far.</em></p>
