system:
  description: >-
    <p>You wield the spotlight as well as any blade, allowing great feats of
    charm and skill. Each scene, you have <strong>2 panache</strong> to fuel
    your derring-do. Before making a roll, you can spend
    <strong>panache</strong>, removing that many thorns. If you remove all
    thorns, they become <strong>panache dice</strong> instead, increasing the
    final result level on a 7 or 8. When one of your rolls is
    <em><strong>cut</strong></em> by a thorn, you gain <strong>1
    panache</strong> (ignoring your max).</p><p><strong>Quick Wit:</strong> Once
    per session, you can <em><strong>interrupt</strong></em> an impact move with
    a: <em>humorous quip—quick flourish—timely
    distraction</em>.</p><hr><p><strong>GROWTH:</strong> At levels 2, 4, and 6,
    you gain +1 panache per scene.</p>
