system:
  description: >-
    <p>You have spellcasting ability. You roll Wits to cast and the
    <strong>spell theorem</strong> you are casting serves as its touchstone. You
    know 4 spell theorems inscribed in your spellbook, created using the Spell
    Crucible (below). Each session, you can cast 4 spells and 2 potent spells.
    You choose which <strong>spell theorem</strong> to use when you cast,
    interpreting it as you see fit. Spells cast with no
    <em><strong>risk</strong></em> require no roll and don’t count against your
    limited number per session, unless potent.</p><p>You can learn new
    <strong>theorems</strong> from studying and experimenting with scrolls,
    consuming them.</p><hr><p><strong>GROWTH:</strong> At levels 2, 4, and 6,
    gain +1 spell and potent spell per session, +1 theorem</p>
