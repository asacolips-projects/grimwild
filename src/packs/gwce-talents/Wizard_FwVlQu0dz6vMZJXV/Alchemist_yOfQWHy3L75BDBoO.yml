  description: >-
    <p>Each session, you have a <strong>4d Potions</strong> resource pool. You
    can have a <strong>trivial potion</strong> (spell effect) by rolling the
    pool, or drop 1d and roll to make it a <strong>minor potion</strong> (potent
    spell effect). You know recipes for your <strong>spell theorems</strong>,
    plus two more. Learn new recipes by sacrificing potions you find.</p>
