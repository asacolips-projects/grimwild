system:
  description: >-
    <p>You gain 1 <em><strong>thread</strong></em> per session and can spend
    <em><strong>thread</strong></em> to flashback to employing subterfuge or
    clever preparation to: <em>make a contact—plant a decoy—prepare
    reinforcements—set up an <strong>interrupt</strong>—swipe or stash a useful
    item.</em> Make a 3d montage roll. The GM must take
    <em><strong>suspense</strong></em> in place of an impact move.</p>
  core: false
  notes:
    description: >-
      <p><em>This can cover many kinds of preparation. Consider your other
      talents and abilities as well, for example: if you have spellcasting,
      perhaps you prepared by using magic ahead of time.</em></p>
