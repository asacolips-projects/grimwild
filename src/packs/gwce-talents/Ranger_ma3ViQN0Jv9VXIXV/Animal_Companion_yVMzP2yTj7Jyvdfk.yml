system:
  description: >-
    <p>You’re accompanied by a fiercely loyal animal. Each PC adds a reciprocal
    bond with it. Choose <strong>3 tricks</strong> and <strong>2 flaws</strong>.
    You roll 3d for its <strong>tricks</strong> and 1d otherwise. It has only
    two damage boxes, marked (for any <em><strong>mark</strong></em>) and hurt
    (for any <em><strong>harm</strong></em>). It can always exit a scene when
    hurt. If lost, you can bond with a new animal.</p>
  core: false
  notes:
    description: >-
      <p><strong>TRICKS</strong> (choose 3)<strong>:</strong>
      <em>distract—fight—guard—perform—rescue—retrieve—scout—search—track—warn</em></p><p><strong>FLAWS</strong>
      (choose 2)<strong>:</strong>
      <em>aggressive—clumsy—grumpy—insatiable—jumpy—noisy—overprotective—scary—unruly</em></p>
