system:
  description: >-
    <p>Once per session, you can choose a foe as your
    <strong>Quarry</strong>—the focus of your hunt. You have a <strong>Quarry
    die</strong>, a special d6. When you or an ally attempts to research,
    locate, or attack your quarry, add your quarry die to the roll. If a quarry
    die rolls a '6', you can add a <em><strong>critical
    effect</strong></em>.</p><p><strong>Survivalist:</strong> You take +1d when
    scouting, wrangling animals, placing traps, and on defense rolls against
    environmental hazards.</p><hr><p><strong>GROWTH:</strong> At levels 3 and 6,
    choose +1 Quarry per session.</p>
