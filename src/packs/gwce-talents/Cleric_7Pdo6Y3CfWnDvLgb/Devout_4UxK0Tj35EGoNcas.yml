system:
  description: >-
    <p>Intelligent creatures recognize you as a person of deep honesty and only
    your most hated enemies would treat you with a lack of respect or doubt your
    word. You are never seriously injured or killed by an enemy, unless they
    have no choice. Any creature with speech will always hear you out. This aura
    is upheld by your unwavering commitment—you must <em><strong>push
    yourself</strong></em> to act in bad faith.</p>
  core: false
  notes:
    description: >-
      <p><em>You stick to your principles unwaveringly, and even those acting
      against you know. How does this impact those around you? This is sure to
      cause tangles, perhaps even quarrels.</em></p>
