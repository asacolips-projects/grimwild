system:
  description: >-
    <p>You have spellcasting ability, calling upon your deity to channel their
    magic. You roll a <strong>rite pool</strong> to cast spells, and that pool
    and your <strong>god’s title</strong> serve as touchstones. Your
    <strong>major rite</strong> is a <strong>6d power pool</strong>, and your 2
    <strong>minor rites</strong> are <strong>4d power pools</strong>. They
    replenish each session. You can drop 1d and roll to cast a potent spell.
    Spells without risk require no roll, unless
    potent.</p><hr><p><strong>GROWTH:</strong> At levels 3 and 6, gain +1d to
    each rite pool.</p>
  core: false
