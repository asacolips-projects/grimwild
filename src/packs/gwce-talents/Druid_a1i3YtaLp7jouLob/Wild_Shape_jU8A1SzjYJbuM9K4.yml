system:
  description: >-
    <p>Shift into any familiar beast form by using a <strong>2d Wild
    Shape</strong> resource pool, replenishing each scene. You take on the
    form’s physical qualities and feral instincts, moving stat points to
    represent this (min 1, max 3). You lose access to your own physical talents.
    Drop 1d before rolling for each <strong>wild talent</strong>, such as:
    <em>aquatic—smaller than a cat—bigger than a bear—flying—a thematic path
    talent</em>.</p><hr><p><strong>GROWTH:</strong> At levels 3 and 6, gain +1d
    to your Wild Shape pool.</p>
