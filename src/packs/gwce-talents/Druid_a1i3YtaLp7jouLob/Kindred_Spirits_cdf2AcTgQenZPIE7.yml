system:
  description: >-
    <p>You can speak with all manner of wild things—animals, plants, and
    spirits. When you meet, they know of you. Make a story roll for their
    attitude, or spend <em><strong>thread</strong></em> to establish a
    <em><strong>bond</strong></em>. When you call, those nearby will answer. You
    always sense the presence of hidden dangers in places teeming with
    wildlife.</p>
  core: false
  notes:
    description: >-
      <p><em>Not everything communicates as we do—plants may only impart
      feelings, spirits might need an offering to even appear. Change it up and
      make the world feel alive.</em></p>
