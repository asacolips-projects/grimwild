  - sort: 1100000
    name: Horse Negotiation
    type: text
    _id: JyQWDMy5pTfvyKjT
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>The fighter grabs the orc by the shirt and threatens him, but the
        orc's not budging. The GM makes his impact move—the price for the horses
        just doubled, and you all have nowhere near enough treasure.</p><p>You
        step up and try a softer approach, negotiating with Presence at +1t from
        the price doubling. You roll 3d1t and get [4, 6, 6 - 7] a
        <strong>critical</strong>! In spite of the price, your critical ignores
        the cut. You get the horses for the cost of the treasure and choose a
        <strong>secondary effect</strong>—you want to make sure this orc remains
        friendly permanently. The GM okays it and you're now friends with the
        best horse trader this side of the Ironback Mountains.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>For the critical, you
        could have chosen something else.</p><p>Greater effect would have gotten
        you the horses for a nominal price. Setup doesn’t make much sense in the
        situation, though if you were looking to rob the orc later, it might
        apply.</p></blockquote>
