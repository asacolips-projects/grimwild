  - sort: 200000
    name: Outnumbered by Bandits
    type: text
    _id: qNr4ek5Ru6Mzd8TL
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>The fighter stands off alone against 10 bandits. This one's
        borderline, but the bandits all have combat experience and there's an
        overwhelming number of them, so you make this
        <strong>impossible</strong>.</p><p>The fighter thinks on it, then they
        take off running. They want to split the group up for better odds. You
        know this bunch is disorganized, so you decide a trick is relatively
        easy—<strong>no thorns</strong>, and you call for a Wits roll (4, 3).
        <strong>Messy</strong>! You let them know they pulled it off, but the
        impact move means they're still facing three bandits—fightable, but
        still <strong>+1t</strong>. You also give them a mark to Agility as they
        stumble and twist their ankle. The fighter grabs the narration and works
        in that the stumble is how the bandits ended up catching up to them.
        Then they introduce a tangle—they'll start off on the ground, in a
        terrible position, if they can have spark. You give the thumbs
        up!</p><blockquote style="border-style:solid;border-radius:8px"><p>As
        GM, you have to be really on point and consistent with thorns. There are
        no hard rules, but it's easy to forget how tough enemy numbers can be.
        Even a great fighter will struggle against ten all coming at
        them.</p><p>When considering whether to add a thorn, err on the side of
        adding it! It makes rolls more interesting with higher stakes, but also
        makes players not just try the first thing that comes to
        mind.</p><p>Finally, splitting up consequences like this is a good way
        to keep scenes moving without hammering a PC as things get
        started.</p><p>Give them a fighting chance to make for a cool scene. A
        perfect probably would have had them facing 2
        bandits.</p></blockquote><p></p>
