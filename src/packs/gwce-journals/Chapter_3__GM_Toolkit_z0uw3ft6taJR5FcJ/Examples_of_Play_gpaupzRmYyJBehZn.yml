  - sort: 300000
    name: The Minotaur King
    type: text
    _id: KsTU29UAmdLf1hfB
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>The cleric charges the Minotaur King. This minotaur is a powerful foe
        and the thorns it inflicts when fighting it must reflect that, so you
        make it +2t and call for a Brawn roll (2, 3, 5, and 7, 8 on thorns). The
        initial outcome is a <strong>messy</strong>, which drops to a
        <strong>grim</strong> for the first cut, then to a
        <strong>disaster</strong> for the second. </p><p>You hadn't declared
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.V9XAOE6EuQRhd0cW.JournalEntryPage.O7u8kywnCA1IHYAp#dire-stakes]{dire
        stakes}</strong></em> on this roll, but you know that a disaster can cut
        past the need. You check in with the cleric, <strong>"You okay losing a
        limb here?"</strong> Leaning into the awfulness of the situation, they
        laugh it off and nod. You decide the Minotaur King chops off their arm!
        You toss the narration back to the player to let them describe how it
        all went down.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>Horrifying enemies need
        horrifying consequences. If you hit hard, especially when the dice tell
        you to, players will understand—the world is dangerous. That's why what
        they're doing is heroic.</p><p>Still, it's good to check in. You can't
        give a permanent condition like losing a limb to a player without their
        say so. Had they wanted to avoid that, you could have dropped them
        instead and risked death or found something equally
        fitting.</p></blockquote>
