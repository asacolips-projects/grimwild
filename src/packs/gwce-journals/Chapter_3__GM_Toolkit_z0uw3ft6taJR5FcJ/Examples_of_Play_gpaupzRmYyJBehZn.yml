  - sort: 2100000
    name: Story Arcs
    type: text
    _id: mcX1nuQqhvVqBeAx
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>You start the game with the character arcs <em><strong>Enjoy
        Life</strong></em> and <em><strong>Keep a Secret</strong></em>, which
        makes sense since you're the runaway heir to the Orchard Kingdom. Your
        job is to find ways to express these arcs through play, especially
        growth arcs like Enjoying Life. The GM's job is to challenge them and
        offer opportunity, especially a crisis arc like Keeping a Secret. It's
        clear that you don't want to live a life of responsibility, but that
        life will come calling whether you like it or not.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>The game will hum along
        just fine without story arcs. They're a player tool that expands vantage
        and lets you push the story towards what you want to be doing. They tell
        the GM, and other players, that you are interested in these
        themes.</p><p>If they fit your play style well, lean into
        them.</p></blockquote>
