  - sort: 1700000
    name: Upholding Honor
    type: text
    _id: 5kIaJLA3828DOQdA
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>You look to your desire for <em><strong>belonging</strong></em> and,
        feeling found at last, replace it with a new
        one—<em><strong>honor</strong></em>. You introduce a tangle, deciding to
        stay on the bridge. "Go," you tell your friends, turning to hold off the
        horde on the bridge while they escape.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>While traits and desires
        don't give spark directly, they do give you vantage to add tangles. When
        they change, you should also let your group see it play
        out.</p></blockquote>
