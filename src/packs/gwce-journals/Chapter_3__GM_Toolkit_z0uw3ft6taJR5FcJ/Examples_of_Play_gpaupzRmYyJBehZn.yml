  - sort: 900000
    name: Distracted Guard
    type: text
    _id: 8efSGISEADVnD9gL
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>You call the guard over to distract him with chitchat, rolling
        Presence and get [3, 6] perfect! This gives your rogue friend a chance
        to pick the lock. They spent thread to have found some wire they could
        finagle into a makeshift lockpick, but using it on the lock is still
        +2t.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>Without spending thread,
        the rogue wouldn't have even been able to pick the lock. Had the guard
        been watching, the difficulty (+3t) would have made it incredibly
        difficult. These are the kinds of factors players and GMs must consider
        when judging rolls, and how thorns can affect the
        outcomes.</p></blockquote><p>They roll Agility, getting [3, 4, 2 - 7, 8]
        disaster! The messy (4) is cut by the thorns twice (7, 8) from a messy
        to a grim, then to a disaster. The lock opens, but the GM makes two
        impact moves here. The guard runs over, kicks the door, bloodies the
        rogue, and slams it shut, locking it.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>At the end, the GM's
        second impact move comes from the disaster. In this case, the GM could
        have given the rogue desperate harm if it had made
        sense.</p></blockquote>
