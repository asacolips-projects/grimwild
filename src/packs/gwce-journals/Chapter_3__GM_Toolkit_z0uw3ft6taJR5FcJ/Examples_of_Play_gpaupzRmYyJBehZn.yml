  - sort: 1800000
    name: Chieftain's Temper
    type: text
    _id: zALMQr687S6FPP7i
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>You and the cleric, as honored prisoners, are hauled out to join the
        chieftain at the head table. The GM has made it clear that the chieftain
        angers easily, so they start a 4d Temper pool. You find a chance during
        the meal to try to persuade the chieftain to let you go, but roll a
        grim. Annoyed with your badgering, they bash the table and gesture for
        the guards to haul you back to your tent. This triggers the Temper pool
        and the GM rolls 1, 3, 1, 6 :: <strong>4d→1d</strong>. With just 1d
        left, the GM makes sure to describe the chieftain being on the edge of
        losing it. The cleric decides to keep their mouth shut.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>Pools can be very
        swingy, which is by design. Here we see things almost instantly move
        towards an incredibly tense situation.</p><p>You might also end up with
        a much longer leash than you imagined if the pool doesn't drop much at
        all. Either way, it's clear that they had best tread lightly. Even when
        not rolled, pools have a great passive effect on scenes like
        this.</p></blockquote>
    video:
      controls: true
      volume: 0.5
    src: null
