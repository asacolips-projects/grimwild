  - sort: 1600000
    name: Blessed Incense
    type: text
    _id: eXmhxmbst4fo6bsu
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>You have a special pack of blessed incense you brought from your home
        temple. It's a <strong>4d resource pool</strong>. Each time you use it,
        it triggers a roll to see how much is remaining. The first time you use
        it, you roll 4d and get [6, 2, 6, 4]. The 2 result drops the pool by 1,
        4d→3d. The next time you use it, you roll 3d and get 4 5 5. Nothing is
        dropped from the pool! While you did use it, the pool's an abstract
        measurement of how much is remaining and doesn't change this time. The
        final time, though, you roll 3d again and get [2 1 2], 3d→0d. You use
        it, but then the pool depletes and you're out of incense!</p><blockquote
        style="border-style:solid;border-radius:8px"><p>This is a really
        straightforward example of how pools work. If you were working against a
        task pool or trying to affect a timer with an action roll and it dropped
        0d from the pool, remember that you can <strong>push</strong> or
        <strong>pivot</strong>. Taking a mark to drop 1d, or taking a secondary
        effect instead.</p></blockquote>
    video:
      controls: true
      volume: 0.5
    src: null
    category: null
    ownership:
      default: -1
      79CEe5dKC6Ls5VbU: 3
