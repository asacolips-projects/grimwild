  - sort: 400000
    name: Undead Hordes
    type: text
    _id: zfnAyKJHPZ0f8Mh1
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>The PCs have made a grave mistake, and the entire cemetery
        surrounding them is starting to come to unlife. You (the GM) tell them
        there are skeletons and zombies everywhere. They have a choice—they
        could run, and it would be an <strong>8d | Escape</strong> challenge,
        but the town would be gone for sure. Or you can stay and fight, just
        wave after wave of undead. You remind the rogue of their
        <strong>definitely not honorable trait</strong>. The rest seem dead set
        on staying, but the rogue wavers. They
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.pNW9iH0hc9EFKfPK#quarrels]{quarrel}</strong></em>,
        and finally the other three win out— they stay, and fight like the
        heroes most of them are.</p><p>You think on what waves of zombies might
        look like. Each undead is weak individually, but the entire horde is
        epic. You set it up as waves, three linked <strong>4d-6d-8d | Undead
        Horde challenges</strong>.</p><p>You then call for a
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.V9XAOE6EuQRhd0cW.JournalEntryPage.WDm6CTveG7RjIgHI#build-up]{Build
        Up}</strong></em> move and introduce the challenge. Each player
        describes their character getting ready as the horde starts to claw its
        way out of the ground. <strong>They take spark from the quarrel earlier,
        and spark from the Build Up</strong>.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>Setting up challenges on
        the fly is one of the most important parts of being a GM. With time, it
        becomes second nature and lets you set up dynamic scenarios
        quickly.</p><p>Unfortunately, the rogue here got stuck with losing out
        on a spark— but it all happened so quickly that as the GM, you should
        give them a pass and let them have three (tangle, quarrel, Build up)
        just this once.</p><p>Giving PCs opportunities to get spark like that as
        well incentivizes them using it. In these cases, usually one or two PCs
        will have spark still on their sheet and miss out on getting that second
        one as theirs is full.</p></blockquote>
