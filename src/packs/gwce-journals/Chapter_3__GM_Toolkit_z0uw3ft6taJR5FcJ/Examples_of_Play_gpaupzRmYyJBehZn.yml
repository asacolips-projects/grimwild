  - sort: 2200000
    name: Settling Debts
    type: text
    _id: u1pBtL1L9Z9J2AkY
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>As you enter the small city, you remember your Settle Debts story arc
        and want to explore it. You spend <strong>thread</strong> and declare
        that the father you never knew is here and you've carried this chip on
        your shoulder a long time—now's the time to confront him.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>Here, you don't use a
        tangle, instead opting to spend thread. Tangles are always bad, while
        story just makes things happen.</p></blockquote><p>Through play, you
        learn that your father has become a benevolent guild leader in the city,
        looked up to by all. Not very interested in bringing down someone
        helpful to the community, <strong>you bury the feelings and move
        on</strong>. You take spark for finishing the arc.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>Arcs aren't
        prescriptive. They don't have any ending in mind. Whether you accomplish
        it, end it through failing at it, or just give up on it, you take spark
        as your character finds something new to drive them.</p></blockquote>
