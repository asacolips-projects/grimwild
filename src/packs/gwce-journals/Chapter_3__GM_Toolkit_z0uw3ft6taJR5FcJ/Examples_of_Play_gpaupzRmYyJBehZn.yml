  - sort: 1000000
    name: Bar Brawl
    type: text
    _id: DhJ49ymyNsBnP1he
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>You tell the GM you want to punch the guy in the face, so he calls
        for a Brawn roll. Confused, you rewind a bit and explain that you're
        sucker punching him, and it's mostly just to get him to back down.
        Seeing the situation more clearly now, <strong>the GM calls for
        Agility</strong>.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>This is why the how
        &amp; why is important. Without it, the GM can’t get the stat
        right.</p></blockquote><p>With an Agility of 2, you roll 2d and get [3,
        5] messy. You're going to do it, but the GM makes an impact move. That
        guy will be back with some friends. The GM starts a 4d Hooligans
        timer.</p>
