  - sort: 700000
    name: The Red Dragon
    type: text
    _id: jtbC0lRq87J7h9lJ
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><em>By @zach.labounty on Discord, adapted for Community Edition and
        used with permission.</em></p><p>The party is The Bard, Fighter, Rogue,
        and Cleric. The GM sets the scene and narrates the sound of wings
        flapping and the giant, red head popping up over the trees of the forest
        nearby town.</p><p>The GM uses the Build Up move before they introduce
        the challenge, and give the PCs spark. The Bard says he's posted up high
        on a parapet with a ballista aimed and ready. The Fighter narrates their
        stoicism as they stand at the town gate prepared to defend everyone with
        their life. The Rogue says he's waiting at the edge of the treeline to
        come in from behind and try to mount the thing. The Cleric says they've
        safely put everyone in town in a stone building with a fire trench built
        around it and they're going to protect the townsfolk and back everyone
        up.</p><p>The dragon flies over the town once and as they do, the GM
        <strong>spends one suspense</strong> from the Body. <strong>It uses its
        breath weapon to ravage the town.</strong> GM decides that the Cleric
        and Bard are subject to the breath and need to make defense rolls with
        no thorns because the dragon is still a bit high up. They both succeed,
        but now the town is ablaze.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>Suspense can be spent to
        target multiple PCs. In this case, the town is also caught in the fire.
        Consider lessening the consequences or thorns; falling from a group
        attack isn’t as dynamic as other impact moves.</p></blockquote><p>The
        dragon does another fly over and as it does, the Bard shoots it with the
        ballista (they say they're aiming for the wings to down it). They get a
        messy and the GM rolls the Wings pool (6d → 3d), but they get an impact
        move in result. The GM decides to take suspense. The dragon descends a
        bit and a rain of kobolds fall from its back and begin causing mayhem in
        the city.</p><p>The GM spends suspense from Kobold Minions and has them
        attempt to overwhelm the Cleric. Another defense roll and this time it's
        a Grim! The Cleric is caught off guard and takes
        <strong>bloodied</strong>.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>Instead of giving
        bloodied, another option would be to target the townsfolk—striking
        directly at the Cleric’s goal.</p></blockquote><p>The dragon fully
        descends outside town face to face with the fighter and the fighter is
        the first to react! They go straight for its eye with a jumping strike.
        Messy! The GM rolls the Body pool (8d →6d), not very
        effective.</p><p>The GM uses the impact move from the Messy to have the
        dragon roar and attempt to
        <strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.v1Y89kCcCc4AYWaW#vex]{vex}</strong>
        the entire party. The fighter normally wouldn't get a defense roll, but
        because the GM is aiming for more than a light consequence, the fighter
        gets to roll too.</p><p>Some quick defense rolls and two perfects say
        the fighter and rogue are in it to win it. The bard gets a messy and
        takes a mark to Presence. The Cleric gets a Grim again and takes vex,
        opting for Flight as they narrate their character running away from the
        town's shelter and leaving it free to be attacked by the kobold minions,
        despite their desire to protect the townsfolk.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>The Cleric isn’t out of
        the scene just yet. Given a few moments to collect themselves they may
        return, but they’ll certainly have to explain themselves to their allies
        and the town—assuming there’s one left to come back
        to!</p></blockquote><p>The GM then spends one suspense from Claws and
        has another suspense from Tail as the dragon makes two quick strikes at
        the fighter who just landed back on the ground. The fighter makes two
        defense rolls and gets a Grim on both! The first leaves him rattled as
        the claws come inches away from his head, and then he takes the full
        force of the tail, and gets bloodied as well!</p><p>The Rogue comes in
        with a sneak attack, runs up the tail, and attempts to use his precise
        dagger to stab it in the neck under some scales. They succeed! Perfect!
        The GM decides to roll the Body pool (6d→2d), it's pretty effective!
        But, it's time for all that Suspense to get spent again. <strong>The GM
        uses a suspense from Wings to have the dragon fly high into the
        air</strong> with the Rogue on its back, but just in time the bard uses
        an Inspiration to interrupt the impact move. They roll and get a
        Perfect, narrating a vicious, mocking taunt that keeps the dragon from
        running away. The GM spends another suspense from Tail to have it swing
        up and try to get the Rogue off its back. The Rogue gets a messy, and
        gets knocked off the dragon's back, but is otherwise okay.</p><p>The
        party is in a pretty bad situation! Three PCs left, the fighter on his
        last leg, and lots of suspense!</p><blockquote
        style="border-style:solid;border-radius:8px"><p>If it ever makes sense
        in the narrative for the dragon to flee, the GM could use Lock Down,
        using the ‘fly away’ fail state. The party should work towards cutting
        this off in some way before too long.</p></blockquote><img
        src="modules/grimwild/assets/img/linked2-dragon.svg">
