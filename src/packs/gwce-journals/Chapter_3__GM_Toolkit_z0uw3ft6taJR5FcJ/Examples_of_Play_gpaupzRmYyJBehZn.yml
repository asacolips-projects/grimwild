  - sort: 2300000
    name: Archmage Secrets
    type: text
    _id: jSUcAk9IhDfbX8uj
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Your party meets with the archmage, who reveals a dark secret about
        your past. The GM targets your Presence to keep it together, adding a
        thorn—the secret is especially damning. You roll [4, 1, 5 - 7] grim.
        You're overwhelmed by memories, and take <strong>vex</strong>!</p><p>Now
        you have a choice. You could <strong>fight</strong> and attack the
        archmage in a rage, someone your party sees as an ally. You could take
        <strong>flight</strong> away from the group, back outside the tower. You
        could <strong>freeze</strong>, dropping the potion you intended to give
        the archmage. You could <strong>freakout</strong>, lashing out at your
        allies' shocked, judgemental stares.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>Vex gives a chance to
        really double down on who your character is or go in the exact opposite
        direction with something surprising. Either way, it's a big open door to
        roleplaying.</p></blockquote>
