  - sort: 800000
    name: Kobold Trials
    type: text
    _id: wqBO54rvYeLGBXY8
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>The Wizard's brought before the kobold elders for her <strong>4d |
        Trial by Ordeal</strong>. The first trial is to lift a boulder, and she
        gets a perfect! You roll for progress (<strong>4d→4d</strong>), but none
        is made. The elders, unimpressed, call for a larger boulder, but the
        Wizard pivots for a secondary effect, and wins the chieftain over. With
        a wave of their hand, he silences them. She moves to the next trial, no
        progress, but in the chieftain's good graces.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>And here's where it all
        comes together, the mix of setting up challenges, rolling pools,
        reacting within the fiction to how those pools progress, and hitting
        with appropriate impact moves while giving out
        thorns.</p></blockquote><p>Next, the Wizard must walk across a very
        narrow balance beam (+1t). She rolls [2, 6, - 7]. Her perfect gets cut
        to a messy. As she makes it to the end, she stumbles off and smacks her
        head. You decide that Wits gets marked but the elders laugh and seem
        pleased (4d→1d). The final ordeal is a ridiculous riddle (+2t)—and ends
        up rolling a another messy. You decide the kobolds begin to argue over
        the correct answer, even as the chieftain declares the Wizard has passed
        (1d→0d). A fight breaks out, but the Wizard has earned the trust of the
        leader, so he unlocks the chains.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>Throughout all of this,
        there's of course a lot more narration, but this is the ideal flow of a
        challenge. Each roll is giving great prompts for narration and it
        progresses smoothly towards its horrible ending.</p></blockquote>
