  - sort: 1500000
    name: Assassin Attack
    type: text
    _id: BpBIFCrN3eqoAM9U
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>You're walking through the library at night when an assassin strikes
        from above. This could be Wits to see it coming, but <strong>the GM
        thinks it's more of a physical reaction, Agility</strong>. The GM makes
        it clear this is dire stakes—a grim means you're dropped, maybe
        dead!</p><p>You take +1t since the assassin has the drop on you. You get
        [6, 1 - 8] messy! The knife misses and you don't end up bloodied, but
        Brawn gets marked as the assassin crashes into you, knocking the wind
        out of you. You're both sprawled out on the ground, the knife now
        between you. What do you do?</p><blockquote
        style="border-style:solid;border-radius:8px"><p>The GM has a lot of
        flexibility in choosing the defense they want to test—and testing the
        stats is the best way of thinking about what's happening. The player has
        no choice in the stat, besides a soft veto on things that are very out
        of character.</p><p>The GM could have made this Brawn if the assassin
        had tried to garrote them, or Wits if they didn't want to assume the
        assassin went unspotted. Presence is pretty hard to make sense of in
        this scenario, though.</p></blockquote>
    video:
      controls: true
      volume: 0.5
    src: null
    category: null
    ownership:
      default: -1
      79CEe5dKC6Ls5VbU: 3
