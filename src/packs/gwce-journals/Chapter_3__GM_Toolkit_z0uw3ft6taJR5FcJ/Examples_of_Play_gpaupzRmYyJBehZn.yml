  - sort: 500000
    name: Treacherous Channel
    type: text
    _id: Uzp1tXKVYdFQ07sa
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>The Fighter takes the helm as they 8d | Navigate Channel. They roll
        Wits, but the thorn from the treacherous currents cuts their perfect to
        a messy. You roll for their progress navigating (8d→4d), then make an
        impact move—Graze Reef. The rogue up in the lookout makes a Wits defense
        roll but gets a grim. They don’t see it and the boat slams against the
        reef. You start a <strong>6d Taking on Water</strong> pool, then roll it
        (6d→4d) alongside the <strong>6d Storm Blows In pool</strong> (6d→2d).
        Things are getting bad!</p><blockquote
        style="border-style:solid;border-radius:8px"><p>Fail states provide an
        important check against neverending rolls to whittle down pools. Setting
        up a proper one, here the Storm Blowing In and even later a second one
        with Taking on Water, means there's urgency and care in what they do.
        They'll work hard together to make sure those pools don't get
        rolled.</p></blockquote><p>At the edge of catastrophe, the Fighter tries
        to right the course. They spend spark and the Rogue and Wizard jump in
        to
        <strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.bs6rHob3redyMuPl#assist]{assist}</strong>.
        Before they roll, you make another impact move—the Violent Winds give
        the roll
        <strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.V9XAOE6EuQRhd0cW.JournalEntryPage.O7u8kywnCA1IHYAp#dire-stakes]{dire
        stakes}</strong>. If this fails, the pools are rolled and one or more of
        the PCs is going overboard into shark-infested waters. Everyone grabs
        their dice.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>This kind of pressure
        creates teamwork and teamwork is what an adventuring party should be all
        about. If you find your players struggling against challenges, make sure
        to point out mechanics like assists that they might be missing out
        on.</p><p>And don't be afraid to Lock Down if they don't do it. The
        story will just move on in a different
        direction!</p></blockquote><p><strong>You (GM):</strong> “Your ship rams
        the pirate ship! You see the Pirate Captain pull out a horn, look
        terrified, and then blow it. Amidst the high waves surrounding both
        ships, the Kraken’s Tentacles burst forth from the water. There are
        about 20 deckhands below and a group of 10 archers above, each a 4d mook
        pool. There are a few swashbucklers too, and the Captain's an
        elite.”</p><p>You put out some tokens representing all of this on the
        battlemap. “Go ahead and put your tokens where they make the most sense.
        What do you do?”</p><p><strong>Fighter:</strong> “I have my bow out and
        start launching arrows at the archers.”</p><p>They roll Agility and get
        a grim. You give a mark to Brawn and Presence as an arrow slices their
        arm. You follow up by spending suspense. You have the Pirate Captain
        swing onto their boat and attack the fighter, who rolls a messy on their
        Brawn defense roll because of the mark. <strong>They mark Agility, then
        clear the mark on Brawn because it was rolled.</strong></p><blockquote
        style="border-style:solid;border-radius:8px"><p>Clearing marks after
        other marks are applied makes sure you don't end up in weird situations
        where you take a mark, roll it, clear it, take another, roll it, clear
        it, and so on. It's better to change the fiction up and have it move to
        a different stat.</p></blockquote><p><strong>Rogue:</strong> “I want to
        trick the Kraken into trying to hit me! I’ll slice at a tentacle, then
        jump over towards the deckhands, like right into the middle of
        them.”</p><p>You double check their intent, to make the kraken hit the
        deckhands, and then have him roll Wits (+2t), warning that this is
        <strong>dire stakes—this could get them dropped</strong>. Hearing that,
        the cleric uses their crossbow to assist with some cover fire at the
        deckhands. The rogue agrees and they roll a messy, but it works! You
        think on it and make a ruling prioritizing the fiction here. That
        tentacle is enough to wipe out those deckhands without a roll. However,
        the rogue is definitely dropped, out of the scene in some
        way.</p><blockquote style="border-style:solid;border-radius:8px"><p>If
        you know a situation could cut straight to a dropped on a grim without
        being desperate first, you need to let them know that it's dire stakes.
        Players buying into a roll that could leave their PC dropped makes them
        way more okay with it if it happens, or even laughing it off when it
        does.</p><p>However, if you drop them out of nowhere and they roll a
        grim on the story roll, it's likely to fall pretty
        flat.</p></blockquote><p>You get ready to make a story roll for the
        dropped rogue, but the cleric jumps in to <strong>assist</strong> again!
        They roll 1d on a defense roll since the rogue didn't get one and get a
        perfect! They run across and tackle the rogue out of the way just as the
        tentacle sweeps the deck hands off into the sea.</p><p>You check in that
        the battlemap has the tokens in roughly the right spots. You also feel
        it's good timing for the threat pool and roll 4d Waves (4d→0d). Waves
        wash over the boats and you have everyone make Brawn defense rolls. They
        all get a perfect except the cleric, who rolled a grim—they're washed
        overboard!</p><blockquote
        style="border-style:solid;border-radius:8px"><p>Remind your players a
        few times when you first start playing that they can assist on action
        rolls that prompt impact moves. They only get to roll 1d and open
        themselves up to the risk, but it's a chance! They can also spend spark
        on the roll.</p></blockquote><p><strong>Wizard:</strong> “Can I try to
        save the cleric just before he goes over? Or like right as he goes over?
        I want to cast <em>Flaming Claw</em> to grab him.”</p><p>You let her
        know she can’t undo something that happened, but there’s enough gray
        area to try this. You remind her that Flaming Claw scorches whatever it
        touches, so the cleric's Agility will get marked no matter what here.
        She makes the roll and gets a messy. The cleric is scorched a bit, but
        safe as the claw drags him back up the side of the boat. Not wanting to
        further complicate this beat, you decide to take
        <strong>suspense</strong> instead of making an impact move, a nice soft
        reset on the action. You point the Spotlight back at the
        PCs.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>Suspense is a great
        fallback on a messy when you want to wrap up a beat and move on.
        Sometimes a perfect or a grim both make sense, but the middle zone
        doesn't—let the PCs have their easy victory for now,then hit them out of
        nowhere with suspense later.</p></blockquote><section class="grid
        grid-2col"><div><img
        src="modules/grimwild/assets/img/challenge1-channel.svg"></div><div><img
        src="modules/grimwild/assets/img/battleground-pirateship.svg"></div></section>
