  - sort: 2000000
    name: Dwarf vs. Cave Troll
    type: text
    _id: hR1YOnkv3fWudiEI
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Fleeing from a massive cave troll, you spend <strong>thread</strong>
        and invoke your Dwarf of the Deepmoot heritage's underground navigation
        wise. You say you spot a tight side tunnel to lead the troll in to fight
        it. The GM decides the cave troll can't maneuver well and +2t becomes
        +1t.</p><blockquote style="border-style:solid;border-radius:8px"><p>A
        cave troll is massively dangerous, +2t, but if it can't maneuver well,
        it's only kind of dangerous. Thread can definitely be used to gain
        mechanical advantage like this.</p></blockquote>
