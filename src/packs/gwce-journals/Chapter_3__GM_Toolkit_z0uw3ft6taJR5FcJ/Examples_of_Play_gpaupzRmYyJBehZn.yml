  - sort: 1300000
    name: Rogue Healing
    type: text
    _id: 1XvIymkSs0HyQ05K
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>You want to cast a healing spell to remove an arrow from the rogue.
        The wizard and fighter assist. The GM decides it’s risky, so you make
        the action roll which ends up being a 2, 4, 1. The fighter rolls a 1 and
        the wizard a 6. The end result is [2, 4, 1, 1, 6] perfect!</p><p>You
        start narrating. Your describe your healing spell going awry and things
        getting real bloody. The rogue starts fighting it and the fighter says
        they can't quite hold the squirrely rogue down. The wizard steps in with
        their enchantment magic and soothes the rogue, letting you finish your
        work.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>When you roll assists,
        all of the results are combined towards one outcome, but each person
        rolls their own dice. </p><p>In this case, the healer is most important
        so they're leading the roll. If nobody had medical knowledge, the leader
        might have been the fighter—holding down the rogue now becomes vitally
        important. </p><p>Post roll, be sure to narrate
        together!</p></blockquote>
