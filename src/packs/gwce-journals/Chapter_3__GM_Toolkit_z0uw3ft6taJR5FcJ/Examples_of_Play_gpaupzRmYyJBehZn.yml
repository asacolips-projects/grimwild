  - sort: 1200000
    name: Cliff Escape
    type: text
    _id: TPgJT9Q6v2ttsDxH
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>You’re already bloodied and want to climb up this cliff to get away
        from the goblins shooting arrows at you. The GM has you roll Agility and
        adds a thorn to represent the goblins. You roll a [5 - 7, 1]. Your messy
        gets cut by the 7 and turns into a grim. The GM lets you know you're
        getting an arrow in your back and falling back down the wall, ending up
        desperate. You start gleefully narrating how horribly it
        goes.</p><p><strong>You decide to make one last attempt.</strong> This
        time, you spend spark and now have another thorn from desperate. You
        roll 2d3t and get [6, 3 - 7, 2, 6] messy. The messy means you did it, so
        the GM thinks on the consequences and makes you
        <strong>rattled</strong>. That was one scary as hell climb. Once again,
        you get to narrating your near-demise.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>It's possible to roll
        again for the same thing, as long as the situation's changed. If nothing
        has changed, it shouldn't need a roll in the first place.</p><p>One very
        important point is that messy is successful, it's just not pretty. Here
        the GM faces a bit of a dilemma—you're being shot at with arrows. If you
        took bloodied again, you could have died. But you did make it to the top
        of the cliff. They went with rattled due to how terrifying it was, but
        bloodied could have worked as well. It's just that you would have been
        dropped at the top.</p></blockquote>
