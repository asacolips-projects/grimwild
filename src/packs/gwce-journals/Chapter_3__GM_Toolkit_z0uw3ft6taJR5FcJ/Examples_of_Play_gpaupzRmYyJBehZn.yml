  - sort: 600000
    name: Bandit Showdown
    type: text
    _id: RMl06LAI8nuobgW4
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>The rogue spots the ambush and sneaks into the trees, up behind the 4
        Bandit Rabble. He strikes, rolling Agility and gets a perfect. You let
        him know these are just mooks and this takes out all of them, so he
        takes the creative liberty to narrate a sequence of him dispatching the
        bandits quietly, one by one.</p><p>The player knows there’s also a
        Bandit Leader here, but the rogue character doesn’t—he introduces a
        tangle. They recently changed their trait from definitely not honorable
        to definitely not quiet, so he wants to say his character doesn't know
        about the bandit and walks out loudly bragging. That makes sense and
        seems in-character, so you okay it and he takes spark.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>A single good roll can
        take out a couple of mooks or one tough. With a good enough pool roll,
        it can even take out one elite.</p></blockquote><p>The player expected
        the leader to run away, but you check his role—brute. A smart enemy
        might flee, but not a
        <strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.V9XAOE6EuQRhd0cW.JournalEntryPage.zddvwn5XRnOMszDl#brute]{brute}</strong>.
        You make a 1d (unlikely) story roll for the rogue to see if the bandit
        runs and get a grim. Looks like it's a fight. You declare dire stakes,
        then make a move that was prompted by the story roll—Hit 'Em
        Hard.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>When in doubt about what
        an enemy would do, look to their
        @UUID[Compendium.grimwild.gwce-journals.JournalEntry.V9XAOE6EuQRhd0cW.JournalEntryPage.zddvwn5XRnOMszDl#roles]{role}
        and go from there.</p></blockquote><p>The Bandit Leader charges from the
        bushes. The rogue rolls a grim and gets blindsided. You skip marked and
        go straight to bloodied.</p><p>The rogue describes the attack, blood
        flying from a blow to the head. <strong>You use a Buildup move and you
        both narrate a moment, the bandit looking to finish this, the rogue
        having a chance to stand up. They face off.</strong> The rogue takes
        spark, you take suspense. Now it's a fight.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>Cinema like this is why
        we play the game. Imagine all this through the camera lens, your shared
        imagination space. When the mechanics flow like this, the system
        sings.</p></blockquote>
    video:
      controls: true
      volume: 0.5
