  - sort: 1400000
    name: Tunnel Collapse
    type: text
    _id: rEjM5BwQqT0gh6Ic
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>As the session winds to a close, the GM calls for a
        <strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.3ZhPTONYCcx0olaV#montage-roll]{montage}</strong>
        roll to escape the collapsing dungeon. You're bloodied, so you have a
        thorn and roll [1, 1 - 7] a disaster. The wizard in your group rolls [2,
        2] grim.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>After a long adventuring
        session is the perfect timing for a montage. Everyone has grown a bit
        tired of that location and want to move on to bigger
        things.</p></blockquote><p>The fighter rolls a [4, 2] messy! The best
        outcome is a <strong>messy</strong>, so the overall outcome is a messy.
        You manage to get out, but the impact move leaves you each with Agility
        and Presence marked. You collaborate on the narration.</p><p>Had the
        overall result here been a grim, it may have been a good idea to zoom in
        on a tough scene as they get caught fleeing the dungeon. The GM could
        have inflicted those marks, dropped your character even, then started
        the scene off.</p><p>You already have <strong>marks</strong> on Brawn
        and Agility, so it goes to <strong>bloodied</strong>. Unfortunately, you
        were also bloodied and desperate, so you're instead
        <strong>dropped</strong>. You make a 2d roll and get a messy, completely
        knocked out.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>This is a good look at
        how damage escalates. If Brawn wasn't marked, you could have gotten away
        with just a mark even if you were already desperate. Unfortunately, the
        adventure had taken a toll and just that last small hit was the straw
        that broke the camel's back.</p><p>A 2d roll on dropped is a good
        default. That last hit was from a mark, so unlikely to have killed you.
        Even 3d would have been okay.</p></blockquote><p>The wizard describes
        getting everyone lost in the tunnels. You narrate collapsing from your
        wounds, telling the group to leave you behind. The fighter refuses,
        hoists you over their shoulder, and heads in a single direction—and
        somehow finds their way to the surface!</p><p>Outside, the rogue stands
        waiting and cheekily asks what took you so long. They were elsewhere and
        got a perfect on their montage.</p><p></p>
    video:
      controls: true
      volume: 0.5
