  - sort: 1900000
    name: Nemesis Tangle
    type: text
    _id: S04fMXWYQ8hxtQrj
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>The heir must survive as the battle turns into a rout. Just then, you
        introduce a <strong>tangle</strong>—you spot your nemesis, Mortica,
        across the battlefield. By choosing the tangle, you risk the mission to
        protect the heir, but your vengeance is more important. You take
        spark.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>Here we see the player
        introducing story details via a tangle instead of using thread, which is
        completely fine.</p></blockquote><p>The GM decides to make a 2d story
        roll and lets you know first what might happen. On a
        <strong>perfect</strong>, you spot her first. On a grim, she spots you
        first. On a messy, you both spot each other.</p><blockquote
        style="border-style:solid;border-radius:8px"><p>On a perfect, you might
        also consider another tangle—to wait until Mortica sees her to engage
        honorably. Mortica, however, would definitely blindside you with an
        impact move on that grim.</p></blockquote>
    video:
      controls: true
      volume: 0.5
    src: null
    category: null
    ownership:
      default: -1
      79CEe5dKC6Ls5VbU: 3
