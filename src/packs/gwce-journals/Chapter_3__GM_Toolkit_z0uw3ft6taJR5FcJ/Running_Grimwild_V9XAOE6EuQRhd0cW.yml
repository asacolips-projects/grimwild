  - sort: 900000
    name: Combat Kit
    type: text
    _id: zddvwn5XRnOMszDl
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>GM tools to create dynamic antagonists and combat scenarios quickly.
        Tier is an opponent's threat level. Role is a keyword used to guide its
        behavior in battle to vary its tactics. Use these together (Tier + Role)
        to inform how these combatants act in the heat of battle. See below for
        each enemy tier:</p><h3>Mook</h3><p>These are mostly just set dressing,
        especially if encountered alone. One action roll can take out several at
        once, though a large group can be treated as a task pool.</p><p><span
        style="color:rgb(110, 110, 110)"><em>drunken patrons (a few), 4d goblins
        (a bunch), annoying imp (one)</em></span></p><h3>Tough</h3><p>A typical,
        fairly dangerous enemy. One action roll can take one of them out of the
        scene, while a small group can be treated as a task pool.</p><p><span
        style="color:rgb(110, 110, 110)"><em>lizardfolk warrior (one), 4d
        bandits (a few), 8d zombies (a lot)</em></span></p><h3>Elite</h3><p>A
        dangerous foe with strong scene presence, often leading a group of
        lesser enemies. These are typically a challenge themselves.</p><p><span
        style="color:rgb(110, 110, 110)"><em>6d minotaur (one), 4d treant (one),
        6d pirate captain (one)</em></span></p><h3>Boss</h3><p>These are grand
        foes that command the scene. They're powerful, often acting as a large
        or linked challenge alone.</p><p><span style="color:rgb(110, 110,
        110)"><em>8d+4d lich (one), 4d+4d+6d+8d dragon (one), 8d high devil
        (one)</em></span></p><h2>Roles</h2><p>Make sure each enemy role brings a
        unique dynamic to combat. To help, you can use the templates below as a
        simple basis for traits and moves, or even assign them alongside a
        monster entry (Chapter 5). The traits below contain two strengths and a
        weakness, while the moves have one offensive, one defensive, and one
        utility. Additionally, each role has a small table for ideas on how to
        spend
        <em><strong>@UUID[.1hwVUU0jguFscQg1#suspense]{suspense}</strong></em> in
        response to common worst-case scenarios that role
        encounters.</p><section class="grid grid-2col"><div><h3>Blaster</h3><img
        src="modules/grimwild/assets/img/roles/role-blaster.webp"><p>@UUID[Compendium.grimwild.gwce-crucibles.RollTable.an2loLlis7dhCEiE]{Blaster
        - As a last ditch defense, it...}</p><h3>Lurker</h3><img
        src="modules/grimwild/assets/img/roles/role-lurker.webp"><p>@UUID[Compendium.grimwild.gwce-crucibles.RollTable.wqJoMWBmql16A4AK]{Lurker
        - When their cover is blown, it...}</p><h3>Predator</h3><img
        src="modules/grimwild/assets/img/roles/role-predator.webp"><p>@UUID[Compendium.grimwild.gwce-crucibles.RollTable.Cj4HXQD1u3pAhmM0]{Predator
        - When prey slips away, it...}</p><h3>Skirmisher</h3><img
        src="modules/grimwild/assets/img/roles/role-skirmisher.webp"><p>@UUID[Compendium.grimwild.gwce-crucibles.RollTable.FXtl27Ki0JdU0KGq]{Skirmisher
        - When it loses the advantage, it...}</p><h3>Tactician</h3><img
        src="modules/grimwild/assets/img/roles/role-tactician.webp"><p>@UUID[Compendium.grimwild.gwce-crucibles.RollTable.vhpw71Ocn0Ux3C6H]{Tactician
        - When its plan fails, it...}</p></div><div><h3>Brute</h3><img
        src="modules/grimwild/assets/img/roles/role-brute.webp"><p>@UUID[Compendium.grimwild.gwce-crucibles.RollTable.6FDEvrtNvxMFcjoe]{Brute
        - When challenged or taunted, it...}</p><h3>Marksman</h3><img
        src="modules/grimwild/assets/img/roles/role-marksman.webp"><p>@UUID[Compendium.grimwild.gwce-crucibles.RollTable.vM6ulX9lFjnqQQB4]{Marksman
        - When under pressure, it...}</p><h3>Protector</h3><img
        src="modules/grimwild/assets/img/roles/role-protector.webp"><p>@UUID[Compendium.grimwild.gwce-crucibles.RollTable.5g0RA6A1VzFL2Tff]{Protector
        - When an ally is in danger, it...}</p><h3>Swarmer</h3><img
        src="modules/grimwild/assets/img/roles/role-swarmer.webp"><p>@UUID[Compendium.grimwild.gwce-crucibles.RollTable.n6wtogRXD1rwICWR]{Swarmer
        - When their numbers thin, they...}</p><h3>Trickster</h3><img
        src="modules/grimwild/assets/img/roles/role-trickster.webp"><p>@UUID[Compendium.grimwild.gwce-crucibles.RollTable.cpTRDcAfciVKFPtB]{Trickster
        - When its tricks fail, it...}</p></div></section>
