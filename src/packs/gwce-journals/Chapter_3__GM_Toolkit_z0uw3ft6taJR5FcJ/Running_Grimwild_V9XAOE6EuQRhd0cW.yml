  - sort: 800000
    name: Vigilance Examples
    type: text
    _id: yE5b4MhRlnVlLvdx
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <table><thead><tr><th><p>Danger</p></th><td><p>Reveal</p></td><td><p>Hint</p></td><td><p>Strike</p></td></tr></thead><tbody><tr><td><p>poisoned
        dart trap</p></td><td><p>dartgun spotted in wall</p></td><td><p>floor
        creaks unnaturally</p></td><td><p>darts fly from the
        walls</p></td></tr><tr><td><p>flammable gas trap</p></td><td><p>bit of
        gas ignites</p></td><td><p>faint smell lingers</p></td><td><p>area
        engulfedin flames</p></td></tr><tr><td><p>political
        intrigue</p></td><td><p>wax seal is clearly
        fake</p></td><td><p>inconsistencies in letter</p></td><td><p>forgery
        leads to crisis</p></td></tr><tr><td><p>hidden
        malice</p></td><td><p>threatens a PC</p></td><td><p>suspicious
        glances</p></td><td><p>calls the
        guards</p></td></tr><tr><td><p>fractured resolve</p></td><td><p>express
        doubts or fears</p></td><td><p>hesitates when
        speaking</p></td><td><p>act against
        plans</p></td></tr><tr><td><p>concealing illusion</p></td><td><p>reveals
        true form</p></td><td><p>shimmering distortion</p></td><td><p>causes a
        wrong move</p></td></tr><tr><td><p>shattered trust</p></td><td><p>lets
        intentions slip</p></td><td><p>avoids eye contact</p></td><td><p>betrays
        the party</p></td></tr><tr><td><p>crumbling
        ceiling</p></td><td><p>cracks spread visibly</p></td><td><p>dust falls
        lightly</p></td><td><p>debris crashes
        down</p></td></tr><tr><td><p>swarming insects</p></td><td><p>clouds of
        insects in sky</p></td><td><p>animals running away</p></td><td><p>swarm
        descends viciously</p></td></tr><tr><td><p>cursed
        relic</p></td><td><p>it speaks your name</p></td><td><p>air growing
        cold</p></td><td><p>it curses the
        handler</p></td></tr><tr><td><p>creeping spiders</p></td><td><p>see
        skittering</p></td><td><p>large webs above</p></td><td><p>descends from
        the sky</p></td></tr><tr><td><p>bandit ambush</p></td><td><p>form ducked
        in cove</p></td><td><p>crossbow behind tree</p></td><td><p>bandits
        threaten party</p></td></tr></tbody></table><p></p><h3>Play
        Example</h3><p><em>The sorcerer, fighter, and rogue are creeping through
        an ancient dwarven city on the hunt for lost treasures. Up ahead, they
        see an area lit by a single torch. As they get close, they notice the
        stone statue of a dwarf holding a ruby.</em></p><p><em>The GM, knowing
        it's a trap, <strong>spotlights</strong> one of the
        characters:</em></p><h4>The sorcerer…</h4><p><em>a noble, has nothing in
        their vantage about traps, or dwarven architecture. They go for the ruby
        and take a <strong>@UUID[.5kv1YGSsJ8PoRdSe#strike]{Strike}</strong>.
        Flames erupt from the statue and catch their robes on
        fire!</em></p><h4>The rogue…</h4><p><em>a weary dungeon delver, knows
        there's danger around every corner. As he walks up, he gets a
        <strong>@UUID[.5kv1YGSsJ8PoRdSe#hint]{Hint}</strong>— flame scarring on
        the ground beneath the statue.</em></p><h4>The fighter…</h4><p><em>a
        dwarf herself, identifies the statue as the god of greed and cruelty.
        She gets a <strong>@UUID[.5kv1YGSsJ8PoRdSe#reveal]{Reveal}</strong> and
        spots that the strange stonework is hiding a flame
        trap!</em></p><blockquote
        style="border-style:solid;border-radius:8px"><h3>Optional Rule - Active
        Vigilance</h3><p>If you want PC vigilance to be dependent on a roll of
        the dice, consider using the
        @UUID[Compendium.grimwild.gwce-journals.JournalEntry.unDWj5tvsH6ZOLYD.JournalEntryPage.9x1uz89EFCD3CUvx#active-vigilance]{active
        vigilance optional rule}.</p></blockquote>
