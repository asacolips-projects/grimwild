name: Running Grimwild
_id: V9XAOE6EuQRhd0cW
pages:
  - sort: 100000
    name: GM Moves
    type: text
    _id: 1hwVUU0jguFscQg1
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>A framework for good GMing practices. While they can be called out
        specifically, they typically sit in the background, left unsaid,
        aligning naturally with what you do as GM. The players know actions have
        consequences, and the suspense you've earned can come back to bite them.
        It shows things aren't arbitrary—the GM is also playing the game, just
        by different rules.</p><p><strong>Suspense moves</strong> help the
        players out in some way or escalate tension, earning or offering a way
        to take suspense when used. Make these moves with good
        timing.</p><p><strong>Impact moves</strong> deal significant
        consequences, crank up the tension, and make the world feel powerful.
        Make these moves when prompted.</p><h2>Prompt</h2><p>This is a trigger
        for you to make an impact move. They can be caused by things like grim
        or messy action rolls, a relevant depleted pool, an unaddressed
        <em><strong>@UUID[.WDm6CTveG7RjIgHI#foreshadow]{foreshadow}</strong></em>
        move, or by spending <em><strong>suspense</strong></em>. Don't get hung
        up on making sure an impact move is prompted—if the fiction demands its
        use, use it. <span style="color:rgb(110, 110, 110)"><em>The berserker
        jumps off a cliff | the curious rogue drinks a bottle labeled
        'poison'.</em></span></p><h2>Suspense</h2><p>Pure rising tension and
        cinematic timing. Gain <em><strong>suspense</strong></em> by skipping a
        prompted impact move or making certain suspense moves. Spend it to
        prompt an impact move at any time.</p><p>Skipping an impact move feels
        like the PCs got off lucky—something should have happened, but didn't.
        That lingering suspense builds tension, ready to strike later. Use this
        when no immediate move feels compelling or when you want to shift focus
        to other scenes.</p><blockquote
        style="border-style:solid;border-radius:8px"><h4>Reader Lens - Games
        Without GM Moves</h4><p>The more comfortable you feel with the rules,
        and the more your table trusts you, the more you can bend, break, or
        toss out this framework. Most importantly, keep a general idea of your
        suspense and when you add complications (impact moves), as some talents
        affect them specifically. As long as everybody at the table is having a
        good time, you’re doing it right.</p></blockquote>
