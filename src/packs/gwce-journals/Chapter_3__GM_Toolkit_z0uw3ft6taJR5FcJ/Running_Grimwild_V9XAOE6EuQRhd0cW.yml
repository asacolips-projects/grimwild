  - sort: 950000
    name: Running Combat
    type: text
    _id: jbFcmVZQ5gelTXcP
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Running Combats</h2><p>There's no turn order. The GM describes the
        impending danger in the current situation and asks how the PCs respond,
        or the PCs take action on their own. The
        <em><strong>@UUID[.yzOUHnsPoxCyooSW#spotlight]{spotlight}</strong></em>
        is often on the PCs, and the world's actions flow from what they do. You
        make enemies more proactive by
        <em><strong>@UUID[.WDm6CTveG7RjIgHI#foreshadow]{foreshadowing}</strong></em>
        events and following up after, or spending
        <em><strong>@UUID[.1hwVUU0jguFscQg1#suspense]{suspense}</strong></em> to
        make impact moves. This results in a cinematic ebb and flow to
        combat.</p><p>Battles occur in the theater of the mind, using the
        group's shared imagination to keep track of each participant's fictional
        positioning to map fiction to rules. However, using battlemaps or
        sketching maps with minis or markers to track locations during a fight
        works well, too. This helps organize the chaotic situation, makes sure
        everyone gets time to shine, and keeps everyone's imagination aligned.
        Don't get caught up in detailed tracking—update the map with big
        changes.</p><h2>Combat Rulings</h2><p>You map the fiction to the rules
        just like any scene, making rulings to fill in gaps. However, in combat
        you'll often see the same scenarios come up, so for the sake of
        consistency, some common rulings:</p><h3>Movement</h3><p>Moving usually
        accompanies another action—the goal isn't just to get somewhere, but to
        get there and do something. If an interesting obstacle blocks the way,
        it needs an action roll.</p><h3>Melee</h3><p>Compare the weapons in play
        and use common sense to resolve any issues. Most weapons are evenly
        matched, but the roll might shift based on weapon styles, approach, and
        goal. Most melee weapons use Brawn, while light, and fast weapons use
        Agility. Dirty tricks call for Wits, but rarely work more than
        once.</p><h3>Ranged</h3><p>Precision attacks roll <em>Agility</em>,
        while thrown weapons use <em>Brawn</em> or <em>Agility</em> based on
        weight and range. Charging an enemy with ranged weapons is reckless,
        adding +1t or requiring a separate action to close the gap.</p><p>Impact
        moves against ranged characters can be more difficult to come up with.
        Losing or breaking weapons, running out of ammo, getting charged by the
        enemy can always turn up the tension. Remember, you can also take
        <em><strong>suspense</strong></em> and use it to target their allies as
        well (giving them a
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.3ZhPTONYCcx0olaV#defense-roll]{defense
        roll}</strong></em>).</p><h3>Ranged and Casters in
        Melee</h3><p>Spellcasting and precise ranged attacks demand focus, which
        is tough with nearby threats. Inflict <em><strong>thorns</strong></em>
        or call these rolls impossible depending on the immediate
        danger.</p><h3>Armor</h3><p>Heavy armor and shields can be represented
        by talents like Bulwark (pg. 65). Other armors remain as vantage and set
        dressing—impacting rolls and thorns. A heavy breastplate may let a
        barbarian make a defense roll with one less thorn, but it may also add
        +1t when in a chase.</p><blockquote
        style="border-style:solid;border-radius:8px"><h4>Optional Rule -
        Armor</h4><p>If you want armor choice to stand out a bit more, consider
        using the
        @UUID[Compendium.grimwild.gwce-journals.JournalEntry.unDWj5tvsH6ZOLYD.JournalEntryPage.B7f2yRAHKyPk7hb5#armor]{armor
        optional rule}.</p></blockquote><h3>Attacking Multiple</h3><p>PCs with
        the vantage to do so, can target multiple dangerous foes with their
        weapons at once, though this often depends on the foe's
        @UUID[.zddvwn5XRnOMszDl]{tier} and comes with great risk adding thorns
        or higher stakes with the attempt. Vantage often comes from sweeping
        weapons, time on the battlefield, or incredible martial
        skill.</p><h3>Defense Rolls</h3><p>The GM selects the stat to test.
        Melee attacks can be dodged with Agility, blocked with Brawn, or
        anticipated with Wits. Resisting mental and magical attacks is usually
        Wits, while defending your stance and reputation, and keeping your nerve
        is Presence. With warning and time to react, spells can allow a defense
        roll with the connected stat.</p><h3>Vulnerabilities</h3><p>Exploiting a
        vulnerability can lower thorns, drop 1d before rolling a pool (as if
        with greater effect on a critical), or even bypass the need for a roll.
        In some cases, finding a vulnerability is required to attack, as all
        other rolls are deemed impossible.</p><h3>Enemy Magic</h3><p>Enemy magic
        doesn't follow the same rules as PC magic. It manifests through GM moves
        and is constrained only by the fiction.</p>
