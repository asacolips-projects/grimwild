  - sort: 700000
    name: Vigilance
    type: text
    _id: 5kv1YGSsJ8PoRdSe
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>The assumed alertness of the PCs, avoiding overly cautious gameplay
        to keep the focus on the action.</p><p>PCs are always considered to be
        as vigilant as their <em><strong>vantage</strong></em> allows when
        dealing with hidden dangers like traps, lies, or secret doors. However,
        this doesn't mean they are always aware of hidden threats. Instead, the
        GM
        <em><strong>@UUID[.yzOUHnsPoxCyooSW#spotlight]{spotlights}</strong></em>
        the most relevant PC and uses a gut feeling to decide how much they
        perceive based on their vantage and the type of tension the GM wants to
        build.</p><p>Each of the three levels of vigilance creates a different
        dynamic in the scene, a different view of PC competence and the danger
        of the world. These three levels are: <em><strong>reveal</strong></em>,
        <em><strong>hint</strong></em>, and
        <em><strong>strike</strong></em>.</p><p><span
        style="color:#6e6e6e"><em>Against a prowling panther, it's most likely
        that a farmer gets a hint, a hunter gets a reveal, and a scholar takes a
        strike. Against a duke lying about their lineage, a priest gets a hint,
        another noble gets a reveal, and a commoner takes a
        strike.</em></span></p><h2>Reveal</h2><p><em><strong>@UUID[.WDm6CTveG7RjIgHI#foreshadow]{Foreshadow}</strong></em>
        with an obvious unveiling of an imminent threat. The PC that becomes
        aware has a chance to react before the danger strikes, potentially
        side-stepping the threat even without an action. Character competence
        guides the story forward.</p><p><span style="color:#6e6e6e"><em>Spotting
        the assassin in hiding. | A whirling of gears betraying the swinging
        scythe trap about to
        spring.</em></span></p><h2>Hint</h2><p><em><strong>@UUID[.WDm6CTveG7RjIgHI#foreshadow]{Foreshadow}</strong></em>
        with a subtle clue about a hidden element. The player gets a single
        chance to interpret the situation. They're limited to just one to
        highlight the natural response of the PC and to keep things flowing.
        Intuition guides the story forward. A correct response leads to a
        <em><strong>reveal</strong></em>, letting the character take the
        initiative before danger strikes, or possibly bypass the situation
        entirely.</p><p><span style="color:#6e6e6e"><em>That funny feeling of
        being watched. | A blood trail down a hallway. | Unnatural
        quiet.</em></span></p><h2>Strike</h2><p>Make an
        <em><strong>@UUID[.qTI1iQgKkAMUFvhm]{impact move}</strong></em> as the
        danger immediately strikes them. The GM assumes the PCs were not
        vigilant enough to see the threat beforehand. The dangerous world guides
        the story forward. This costs
        <em><strong>@UUID[.1hwVUU0jguFscQg1#suspense]{suspense}</strong></em> as
        any other impact move, though you can consider using
        <em><strong>@UUID[.WDm6CTveG7RjIgHI#clue-in]{Clue In}</strong></em> to
        gain suspense and let the players in on the secret.</p><p><span
        style="color:#6e6e6e"><em>You realize the servant slipped poison into
        your glass. | A trapdoor opens beneath you.</em></span></p>
