  - sort: 1000000
    name: Factions
    type: text
    _id: vGSxlgH2QfQMoguw
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Track off-screen developments of major forces, creating a feeling of
        a living world beyond the PCs. They
        have:</p><p><strong>Resources</strong> that show their power and
        influence, like assets, traits, and
        relationships.</p><p><strong>Goals</strong> that show their ambitions.
        Track them with a timer called a faction pool, rolled between sessions
        or when triggered by events in the story.</p><p>When a faction pool
        depletes, the goal is either accomplished or they make their move
        against another faction, with a story roll in their favor determining
        how it plays out. Keep 4-6 active factions, balancing major and minor
        ones, with competing goals. Replace factions that are no longer relevant
        to the story.</p><h2>Campaign Pools</h2><p>Timers that pace long-term
        events across sessions <span style="color:rgb(110, 110, 110)"><em>(lunar
        eclipse, wyvern migration)</em></span>. They work like faction pools but
        don’t require faction details. Use them to signal upcoming events or
        remind you to reintroduce plotlines <span style="color:rgb(110, 110,
        110)"><em>(betrayed NPC seeking revenge)</em></span>.</p><section
        class="grid grid-3col"><div><img
        src="modules/grimwild/assets/img/campaign1-villageofellit.svg"
        alt="Village of Ellit"></div><div><img
        src="modules/grimwild/assets/img/campaign2-twistedforest.svg"
        alt="Twisted Forest"></div><div><img
        src="modules/grimwild/assets/img/campaign3-warintheeast.svg" alt="War in
        the East"></div></section><p></p><img
        src="modules/grimwild/assets/img/campaign-pemtown.svg" alt="Pemtown
        Powderkeg"><figure></figure><p><em>The air in Pemtown hums with tension.
        Baron Prog’s coffers run dry, his troops grow restless, and whispers of
        rebellion stir in the ranks. Meanwhile, deep in the forest, alliances
        shift as Shaz’s warband, the goblin horde, and the druids of the
        Oldgrove edge closer to explosive confrontation.</em></p>
