  - sort: 500000
    name: Consequences
    type: text
    _id: O7u8kywnCA1IHYAp
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>What happens when things go wrong—from failed rolls, timers, or
        impact moves. They should feel hard but fair, reflecting the stakes and
        severity of the situation. Every roll carries risk; otherwise, it
        shouldn’t be rolled.</p><p>Damage is a solid baseline: in a fight,
        injuries could leave you hurt, such as with bloodied or marked. Other
        consequences, even narrative ones, should sting just as much. You can
        also split consequences by breaking a big one into smaller ones.
        Multiple effects can be just as effective and make more sense in the
        situation. You might break up <em><strong>bloodied</strong></em> into a
        few <em><strong>marks</strong></em>, or
        <em><strong>rattled</strong></em> becoming <em><strong>vex</strong></em>
        or rolling a pool instead. You can also spread out consequences, hitting
        multiple PCs, nearby NPCs, or even a PC who didn't prompt the move.
        Consequences can be identical, vary in severity, or differ entirely. If
        a PC other than the one prompting it is hit, they get a defense roll.
        Spreads make the impact feel broader and pull more people into a dynamic
        scene.</p><p>Split and spread consequences to increase the tension, and
        give the PCs
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.v1Y89kCcCc4AYWaW#harm]{harm}</strong></em>
        during big moments to give the world teeth. If there’s a roll, it’s
        because something can go wrong.</p><h2>Thinking Offscreen</h2><p>Fallout
        can happen beyond the immediate action. Not all consequences need to
        occur in the spotlight. Hitting elsewhere builds tension, hastens
        incoming trouble, or creates missed opportunities. These unseen events
        make the world feel alive, adding depth beyond the present
        moment.</p><p><span style="color:#6e6e6e"><em>The lich’s ritual gets one
        step closer to completion. | An innocent is blamed for something the PCs
        did. | The caravan begins to run low on food
        supplies.</em></span></p><h2>Using Pools</h2><p>Building pressure with
        danger or timer pools. Start or roll a pressure or timer pool as another
        outlet for consequences, often offscreen. These create looming threats
        and situations the PCs want to avoid or mitigate. They build pressure
        and offer a strong alternative to skipping the move and banking
        suspense.</p><p><span style="color:#6e6e6e"><em>The lizardfolk blows a
        warhorn before you skewer him (start 6d reinforcements arrive). | The
        rushing waters break one of the bridge supports (roll 4d bridge
        destroyed).</em></span></p><h2>Stakes</h2><p>Stakes frame the danger of
        a scene, telling the table about the severity of trouble they should
        expect. This can be implied with storytelling cues as you set the scene,
        or stated explicitly using the categories of stakes below. The greater
        the stakes, the clearer this communication should be. Unless clearly
        otherwise, the scene has regular stakes.</p><h3>Low
        Stakes</h3><p>Lighter territory. You may roll for things you’d normally
        skip or don’t see as <em><strong>risky</strong></em>. Impact moves have
        the weight of 1 mark, or softer consequences (set dressing, vex, raise
        stakes). This is a tool for tone, moving between intense and light play.
        <span style="color:#6e6e6e"><em>Fisticuffs in a barfight. | Keep your
        nerve while questioned by a friendly guard. | Help a cat that’s stuck in
        a tree.</em></span></p><h3>Regular Stakes</h3><p>Typical play and the
        assumed default. Impact moves have the weight of 1 harm, or other
        standard consequences (2 marks, condition, roll a pressure pool,
        complicate things). <span style="color:#6e6e6e"><em>Sneak through a
        guarded warehouse. | Handle a tense negotiation. | Fight a gnoll,
        1-on-1.</em></span></p><h3>High Stakes</h3><p>Things are escalated.
        Impact moves have the weight of desperate harm, twice that of a standard
        consequence. A disaster can drop PCs immediately, with most incoming
        trouble putting them at death’s door. <span
        style="color:#6e6e6e"><em>Defend yourself while cornered by an angry
        ogre. | Explaining your actions to the queen. | Bluff a trained and
        suspicious guard.</em></span></p><h3>Dire Stakes</h3><p>Death looms.
        Keep players in the loop and let them know that PC death is on the
        table. Any prompted impact move will instantly drop the PC. <span
        style="color:#6e6e6e"><em>Pushed off a cliff. | Looking into the eyes of
        an elder horror.</em></span></p><blockquote
        style="border-style:solid;border-radius:8px"><h3>Varied
        Consequences</h3><p>The above scale uses weights of harm as a reference,
        but you can always use any type of impact move (setbacks, strained
        bonds, collateral damage, conditions, etc.), or split up trouble into
        smaller consequences as you see fit. Keeping consequences varied helps
        give the world teeth, while pushing a cinematic
        feel.</p></blockquote><h2>Taking Suspense</h2><p>You can skip the impact
        move, and instead take <em><strong>suspense</strong></em>. This can be
        spent to make an impact move against the players anytime later, or spent
        right away to affect a different character or group (each giving a
        defense roll against the move).</p>
