  - sort: 50000
    name: Running Grimwild
    type: text
    _id: yzOUHnsPoxCyooSW
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>As the GM, you play the game by a different set of rules, utilizing
        the tools laid out in this chapter to craft an engaging and dynamic
        game. You wield GM moves and suspense to drive the narrative forward,
        challenges to model difficult tasks, the combat kit to create thrilling
        battles, and story rolls along with the GM crucible for inspiration when
        the unexpected arises.</p><p>Your primary role is mapping fiction to
        mechanics, keeping the players immersed in the story while you
        seamlessly weave the rules into the narrative, and know when to instead
        ditch a rule and just let the narrative take over.</p><p>Above all, be
        creative. Use the mechanics as a springboard to manufacture drama,
        tension, and memorable moments.</p><h2>Story Rolls</h2><p>Roll to
        disclaim decision-making, letting the dice decide story questions when
        you don’t want to, like an NPC’s reaction, off-screen action, or how
        good or bad something that just happened is. You can also collapse any
        rule back to a story roll when there's no specific mechanic to map it
        to.</p><p>Roll dice based on the odds of a favorable outcome for the
        chosen perspective. <em>Are you rolling for the fish or the
        fisherman?</em></p><p><strong>1d Bad Odds | 2d Even Odds | 3d Good
        Odds</strong></p><ul><li><p>(6) <strong>PERFECT.</strong> It's the ideal
        situation</p></li><li><p>(4-5) <strong>MESSY. </strong>It's okay, but
        there's a catch.</p></li><li><p>(1-3) <strong>GRIM.</strong> It's not
        good, and now it's a problem.</p></li></ul><p><em><strong>How does the
        weather look as the party reaches the
        cliffside?</strong></em></p><p><em>Perfect: The clouds start to part as
        the rain stops, and it appears you have a clear day ahead of
        you.</em></p><p><em>Messy: The light drizzle holds steady. It'll be a
        little slick moving up the side of the mountain.</em></p><p><em>Grim:
        The wind begins to blow harder and the rain gets heavier. It's going to
        be tough to get to the top.</em></p><h2>GM Crucible</h2><p>A forge for
        inspiration, encouraging emergent, low-prep gameplay. Turn to the GM
        crucible, often along with a story roll, when you want the seed of an
        idea to expand upon to help answer questions about the story. Roll once
        on each table. Each roll gives two results (3, 1 = 31: precarious or 13:
        broken). Let your mind drift towards the most evocative, then drill down
        on it and interpret what it might
        mean.</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.HrMWKbsgUTT4hVnW]{GM
        Crucible
        1}</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.8DIEqJed0Aee3VJc]{GM
        Crucible 2}</p><p style="text-align:center"><em><strong>What's inside
        the temple?</strong></em></p><section class="grid grid-2col"><div
        style="text-align:center"><p><em>Roll: aged +
        beacon</em></p><p><em>Interpret: a forgotten artifact</em></p></div><div
        style="text-align:center"><p><em>Roll: perilous +
        maze</em></p><p><em>Interpret: a dangerous
        trial</em></p></div></section><p
        style="text-align:center"><em><strong>Why is the village so
        quiet?</strong></em></p><section class="grid grid-2col"><div
        style="text-align:center"><p><em>Roll: tense +
        scheme</em></p><p><em>Interpret: they're plotting
        rebellion</em></p></div><div style="text-align:center"><p><em>Roll:
        bleak + debris</em></p><p><em>Interpret: it was
        ransacked</em></p></div></section><p
        style="text-align:center"><em><strong>What caused the
        havoc?</strong></em></p><section class="grid grid-2col"><div
        style="text-align:center"><p><em>Roll: flickering +
        rift</em></p><p><em>Interpret: demonic portal opened</em></p></div><div
        style="text-align:center"><p><em>Roll: immense +
        betrayal</em></p><p><em>Interpret: a coup took
        place</em></p></div></section><p
        style="text-align:center"><em><strong>What is the farmer
        hiding?</strong></em></p><section class="grid grid-2col"><div
        style="text-align:center"><p><em>Roll: tough +
        scar</em></p><p><em>Interpret: a wartorn past</em></p></div><div
        style="text-align:center"><p><em>Roll: lost +
        jackpot</em></p><p><em>Interpret: secret rumored
        trove</em></p></div></section><h2>Starting a Campaign</h2><p>When
        players describe their character, ask follow-up questions. They might
        have an idea, or might not yet, but thinking about it can help flesh out
        the character. The same goes for traits and desires.</p><p>These kinds
        of questions are open-ended and a bit leading—hitting them with a
        question that doesn't fit can spur them into giving an answer that does
        fit. And if they don't really have an answer? Let it go. It's obviously
        not important to their character concept. As you walk through different
        characters, keep an eye out for connections—little dots we can use to
        draw lines between characters and drill deeper with questions. Maybe two
        of them both want power, but it’s not the same kind of power. Or one
        avoids wealth, and the other craves it. These differences and
        similarities can help explain why they’re adventuring together—or make
        you wonder why they would be.</p><p>Once everyone has a clear idea of
        their characters and each other, ask about their bonds. Some might’ve
        already written them out, but this is their chance to tweak or rethink
        them now that they’ve heard about the other characters in detail. It
        should be organic—bonds tend to pop up naturally during the
        conversation. Pick out one bond per player to dig a little bit
        deeper.</p><blockquote
        style="border-style:solid;border-radius:8px"><p><em>Why do they have
        <strong>rough hands</strong>? How did growing up as the small kid affect
        them?</em></p><p><em>You want <strong>power</strong>, but not
        <strong>wealth</strong>. They're usually connected, why is this time
        different?</em></p><p><em>How long's that <strong>complex
        rivalry</strong> been going on for? When did they recently get the
        better of you?</em></p></blockquote><h2>Spotlight</h2><p>Keep the
        narrative flowing, the action engaging, and get things moving when they
        stall out. Player actions drive the story, and putting the
        <em><strong>spotlight</strong></em> on them can nudge them forward,
        prompting them into action. Using the spotlight helps you direct the
        action and ensure no one is left out, putting focus where it's needed.
        While describing scenes, try mixing in cinematic language and using the
        camera to help frame your group's shared imagination space. Cut back and
        forth between PCs and scenes to build tension and avoid focusing on a
        single PC for too long. Definitively moving between characters and set
        pieces can help pace the story, while bringing in more passive
        players.</p><p><span style="color:rgb(110, 110, 110)"><em>We cut to the
        rogue, back against the crate as an unaware guard walks
        past.</em></span></p><p><span style="color:rgb(110, 110, 110)"><em>The
        camera pans over to show the mage finishing a chalk circle on the
        ground. We’ll move to the paladin. Your order just denied your plea.
        What do you do?</em></span></p><p>When you move the spotlight, try
        asking a poignant question focused on the character’s perspective. This
        stirs up drama and helps to flesh out the world. The character’s inner
        thoughts can help drive the story, lighten your creative load, and show
        the kind of story the player is interested in telling.</p><p><span
        style="color:rgb(110, 110, 110)"><em>How do you feel about your ally
        killing the surrendered bandit? What do you say about the queen as you
        sit around the fire? As you polish your father’s sword, what are you
        thinking about?</em></span></p><h2>Scenes</h2><p>These are the
        continuous periods of action that make up the game, a few linked story
        beats, and nearly always start with the GM jumping to the engagement at
        the beginning. Skip detailed planning and cautious lead ups that often
        drag game play down. Instead, jump straight into the action, an in
        medias res shot of things already in motion! When you're unsure about
        the specifics of the current fiction, have the players make a story
        roll, with the result setting the opening mood and
        <em><strong>stakes</strong></em> for the scene.</p><p>When a scene has
        served its purpose, grown stale, or feels like a foregone conclusion.
        Don't waste game time—instead, have the players make a montage roll to
        wrap it up and move on. Closing these scenes out decisively keeps the
        narrative tight and focuses on what's next. Keep the game flowing, the
        action engaging, and get things moving when they stall out.</p>
