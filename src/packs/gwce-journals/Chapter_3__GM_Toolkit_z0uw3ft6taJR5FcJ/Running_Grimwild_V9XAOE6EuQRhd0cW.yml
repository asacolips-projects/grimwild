  - sort: 200000
    name: Move Summary
    type: text
    _id: N48BPffbdXapf3Io
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Here are all eight of the GM Moves in Grimwild for quick reference on
        when to use them and what they do. Remember, these are the scaffolding
        of the game— guardrails to help you run cinematic games. Use them as
        much or as little as needed.</p><h2>Suspense Move
        Summary</h2><ul><li><p><strong>BUILD UP</strong> • <span
        style="color:#6E6E6E"><em>Add a brief scene before, or as the intro to
        the challenge ahead.</em></span></p><ul><li><p>Each PC adds a detail to
        the vignette, and takes spark. The GM takes suspense, often before
        introducing a challenge.</p></li></ul></li><li><p><strong>CLUE IN
        </strong><em>• </em><span style="color:#6e6e6e"><em>Cut away, or zoom
        out to show the forces acting against the
        PCs.</em></span></p><ul><li><p>The players learn new details and see the
        direction of the story. The GM takes
        suspense.</p></li></ul></li><li><p><strong>FORESHADOW </strong>•
        <em>Telegraph a danger, giving the PCs time to deal with
        it.</em></p><ul><li><p>The PCs have a chance stop or avoid the danger.
        The GM can take the impact move if it goes
        unaddressed.</p></li></ul></li><li><p><strong>RESOLVE </strong>• <span
        style="color:#6e6e6e"><em>Solve a problem for the PCs and move the story
        forward.</em></span></p><ul><li><p>The PCs get a way out of a tough
        situation, by resolving it for them. The GM takes
        suspense.</p></li></ul></li></ul><h2>Impact Move
        Summary</h2><ul><li><p><strong>COMPLICATE THINGS</strong> • <span
        style="color:#6e6e6e"><em>Add or develop a
        threat.</em></span></p><ul><li><p>The new aspect adds difficulty or
        danger for PCs. Choose this move when things are too stable, or too
        easy.</p></li></ul></li><li><p><strong>COUNTER</strong> • <span
        style="color:#6e6e6e"><em>Stop a PC action, or take away a
        permission.</em></span></p><ul><li><p>Stop a successful action or
        permission (usually refunding resources). Choose this move to show a
        threat's resilience. Be careful of
        overuse.</p></li></ul></li><li><p><strong>HIT HARD</strong> • <span
        style="color:#6e6e6e"><em>Apply direct
        consequences.</em></span></p><ul><li><p>Hit with marks, harm, vex, or
        conditions. Choose this move when injury is the most dramatic
        consequence.</p></li></ul></li><li><p><strong>LOCK DOWN</strong> • <span
        style="color:#6e6e6e"><em>Declare a strict choice, or take an option
        away permanently.</em></span></p><ul><li><p>Close opportunities, force
        them to choose. Choose this move to add cinematic
        edge.</p></li></ul></li></ul>
