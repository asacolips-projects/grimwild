  - sort: 400000
    name: Impact Moves
    type: text
    _id: qTI1iQgKkAMUFvhm
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><em><strong>Use these moves when prompted</strong></em></p><p>Deliver
        hard-hitting consequences that challenge PCs and push the action
        forward. They require prompting, so when you use them, they're sure to
        be justified and fair, codified into the rules. They've had fair warning
        and should have an idea of the risks. So when you make a move, make sure
        it has <strong>impact</strong> to ensure the choices leading to them
        matter and the world feels powerful.</p><p>When not prompted by their
        own roll, impact moves directly against a PC give them a defense roll.
        Some talents also give the ability to
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.pNW9iH0hc9EFKfPK#interrupt]{interrupt}</strong></em>
        impact moves, possibly negating them. If the roll to interrupt is a
        messy, you take
        <em><strong>@UUID[.1hwVUU0jguFscQg1#suspense]{suspense}</strong></em> or
        keep it if you spent it to prompt the move.</p><h2>Complicate
        Things</h2><p>Add a new obstacle, twist, or threat to a scene, or
        develop an existing one. When used, introduce a new aspect to the scene
        working against the characters, or make one worse. Mechanically, this
        may be an aspect that adds thorns to some rolls (more difficulty), or
        raises the
        <em><strong>@UUID[.O7u8kywnCA1IHYAp#stakes]{stakes}</strong></em> (more
        danger).</p><ul><li><p>Use this move to raise the stakes or add thorns
        to relevant rolls. </p></li><li><p>Use this move when things are too
        easy or stable.</p></li></ul><p><span style="color:#6e6e6e"><em>A huge
        storm rolls in. The guard catches sight of you and rings the alarm bell.
        The ruffians in the tavern all draw their weapons. The fire spreads to
        the furniture.</em></span></p><p><span style="color:#6e6e6e"><em>You see
        skeletal hands burst from the ground as <strong>The Lich</strong>
        summons more undead!</em></span></p><h2>Counter</h2><p>Stop the PCs in
        their tracks, and show that the world won’t just roll over. This can
        stop anything a character does, including successful action rolls and
        permissions they normally have. If they use a talent that costs them
        resources, they generally don't have to expend that resource (your call)
        but can't quickly use it again. However, this can never be used to stop
        defense rolls and criticals—don't steal their thunder. Be careful, this
        can get frustrating if used too much. Keep this move reserved for
        powerful enemies and serious trouble, and even then, it should be
        rare.</p><ul><li><p>Use this move to counter a PC’s action or
        permissions.</p></li><li><p>Use this move when you want to showcase the
        resilience of a major threat.</p></li></ul><p><span
        style="color:#6e6e6e"><em>The mage casts a quick protective spell,
        slowing your strike. The queen raises a hand, silencing everyone. Your
        punch lands square on his jaw, and he slowly
        grins.</em></span></p><p><span style="color:#6e6e6e"><em>With a flash of
        necrotic power, The Lich <strong>dispels your magic</strong>, making it
        dissipate into the aether.</em></span></p><h2>Hit Hard</h2><p>Inflict
        direct consequences to underscore the seriousness of the situation. It's
        a heavy reminder that the world pushes back against their actions. When
        you use it, you should be hitting them just as hard as they're trying to
        hit the world.</p><ul><li><p>Use this move to inflict marks, harm, vex,
        or conditions on someone. </p></li><li><p>Use this move when physical or
        mental injury is the most dramatic consequence.</p></li></ul><p><span
        style="color:#6e6e6e"><em>The ceiling collapses, raining rocks down on
        you. | She smirks wickedly at you—take vex, you’re pissed. | The
        bandit’s arrow whistles through the air, embedding itself in your
        shoulder.</em></span></p><p><span style="color:#6e6e6e"><em>His boney
        hand grabs your wrist. <strong>You take bloodied</strong> as the life
        force is sapped from you.</em></span></p><h2>Lock
        Down</h2><p>Definitively bring consequences onto the characters by
        taking away options. Present stark decisions that they can't wiggle
        their way out of. Break or take something from them. Let the villain get
        away. Many
        <em><strong>@UUID[.8ROPHl1aOu4ioKhu]{Challenges}</strong></em> list a
        fail state, an example lock down ending and failing it for the players.
        In this case, consider pairing the move with foreshadow for story
        continuity and to give them a chance to stop it. When used, make sure to
        follow through without softening the impact—once done, it’s
        done.</p><ul><li><p>Use this move to declare an unavoidable event to
        take chances, options, equipment, and allies away.</p></li><li><p>Use
        this move when you want to add cinematic edge, reflecting the dire
        consequences protagonists face.</p></li></ul><p><span
        style="color:#6e6e6e"><em>The thief gets away, nowhere to be seen. | The
        bridge behind you collapses. | No going back. Your gold pouch and sword
        slide towards the lava, which do you go for?</em></span></p><p><span
        style="color:#6e6e6e"><em>A magic barrier forms in front of the door. It
        seems <strong>the only way out</strong> now is to defeat this grand evil
        once and for all.</em></span></p>
