  - sort: 0
    name: GM with Moxie
    type: text
    _id: 9EiJCa41Bp8Pha5Z
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Map fiction to rules.</strong> Encourage players to focus on
        the fiction and let you handle the rules. The more narratively important
        something is, the more mechanical weight you should give
        it.</p><p><em>In a game of courtly intrigue, slaying a dragon might be a
        montage roll for a knight while an important dinner party is a complex
        linked challenge full of dire stakes.</em></p><p>Get creative applying
        the rules, mixing them up in ways not explicitly laid out. Don't be
        afraid to tinker. Moxie is modular and you're not going to break it.
        Graft on rules from other systems you like, or hack Moxie and make it
        your own.</p><p>If the rules clash with what makes sense in the fiction,
        the fiction wins. Engage with the rules quickly, resolve them, and
        return to the story.</p><p><em>"What does that look like?" or "Give us a
        quick scene."</em></p><p><strong>Make rulings to fill gaps.</strong> The
        rules are a flexible framework and designed not to cover every detail.
        When things fall through the cracks, try to interpret the rules' intent
        and make a ruling that fits the moment. If it's a judgment call, tell
        the players. If you're unsure of a rule, make a quick call now and check
        later. When in doubt, everything can collapse down to a single story
        roll—ask the players what they want to happen, then roll to see if
        that's how it goes down</p><p><strong>Pace the game
        cinematically.</strong> Keep the game flowing like a well-paced movie.
        Don't let scenes drag, wrap up scenes to move on to something more
        interesting. If players don't seem keen on an upcoming situation,
        suggest a montage. Skip long planning phases by cutting to the action,
        using a story roll to discover the players’ situation if needed. Reward
        players buying into these techniques by giving them good
        odds.</p><p><strong>Follow the players' lead.</strong> Keep tabs on
        story arcs and present drama, dilemmas, and opportunities related to
        them. Follow where the characters want to go. Present interesting
        situations related to it. When players hesitate or hit an impasse, spur
        them into action with danger timers,
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.pNW9iH0hc9EFKfPK#quarrels]{quarrels}</strong></em>,
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.TFE7qnkVkpzsZYW6#tangles]{tangles}</strong></em>,
        or <em><strong>@UUID[.WDm6CTveG7RjIgHI#resolve]{Resolve}</strong></em>
        the situation and move on.</p>
