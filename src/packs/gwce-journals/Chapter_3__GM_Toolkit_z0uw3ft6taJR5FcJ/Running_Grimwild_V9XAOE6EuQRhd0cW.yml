  - sort: 300000
    name: Suspense Moves
    type: text
    _id: WDm6CTveG7RjIgHI
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><em><strong>Use these moves with cinematic
        timing</strong></em></p><p>Create familiar moments inspired by TV shows,
        incentivizing you mechanically to take the time to structure the story
        cinematically. You move the story forward and introduce ways to prompt
        impact moves, so they reward you for handling some of the tedium of
        GMing and remind players to stay engaged. Suspense keeps the world
        active when things stall. When your supply of suspense runs dry, you can
        use these to jump start the action again. However, use them
        carefully—overuse can get frustrating for players, so pick your spots.
        But timely use makes good, cinematic sense.</p><h2>Build Up</h2><p>Focus
        in on scenes with greater narrative importance, and create moments that
        set the stage for the challenge ahead. This may be a vignette of the PCs
        before the danger, their reaction to the incoming threat, or a brief
        scene showing the looming problem. Give players a chance to add depth
        and feeling to their characters that might get overlooked. Treat this
        like a cut scene before the action. After the vignette, each PC
        <em><strong>takes spark</strong></em>, and the GM takes
        <em><strong>@UUID[.1hwVUU0jguFscQg1#suspense]{suspense}</strong></em>,
        often before introducing a
        <em><strong>@UUID[.8ROPHl1aOu4ioKhu]{challenge}</strong></em>.</p><ul><li><p><strong>Use
        this move to give each PC spark, and take
        suspense.</strong></p></li><li><p><strong>Use this move when you want to
        build up drama before a big scene.</strong></p></li></ul><p><span
        style="color:rgb(110, 110, 110)"><em>The dragon roars, and rocks tumble
        from the ceiling. What does it look like when you dodge them and engage?
        | How are you dressed as you enter the masquerade? | You sit around a
        campfire, knowing the battle to come in the
        morning.</em></span></p><p><span style="color:rgb(110, 110,
        110)"><em>You watch the <strong>goblin warband</strong> in the distance.
        They’ll be here by morning. What is the mood around the
        camp?</em></span></p><h2>Clue In</h2><p>Give the players details on the
        bigger picture, like a TV show scene. Cut away to show villains
        plotting, armies marching, or even positive events. Zoom out to see the
        details the party doesn’t know. When you reveal details with Clue In,
        take suspense. It’s more fun when players know what's happening and they
        can steer their PCs' actions toward that drama, even if their characters
        don't explicitly know about it. Consider using this when you want to
        <em><strong>@UUID[.5kv1YGSsJ8PoRdSe#strike]{strike}</strong></em> (see
        vigilance). After the reveal, take
        <em><strong>suspense</strong></em>.</p><ul><li><p><strong>Use this move
        to give the players knowledge, but leave the PCs in the dark, then take
        suspense.</strong></p></li><li><p><strong>Use this move when you want to
        show the direction of the story.</strong></p></li></ul><p><span
        style="color:rgb(110, 110, 110)"><em>We see the baron through the castle
        window, draining blood from his latest victim. | As you trek through the
        forest, unaware, we see the glint of feline eyes behind
        you.</em></span></p><p><span style="color:rgb(110, 110, 110)"><em>We
        move to the next town over. <strong>We see flames</strong> and dancing
        goblins, as they make plans to come to Humblefalls
        next.</em></span></p><h2>Foreshadow</h2><p>Signal upcoming threats and
        give the players a chance to react. This is a great way to introduce
        adversity when you don't have or want to spend
        <em><strong>suspense</strong></em>, and can be used to telegraph danger
        even in combat. Drop a detail for the PCs while describing a scene, or
        give a specific hint to one character. If they fail to deal with it or
        ignore the danger, it prompts an impact move, and the pace of the story
        picks up. <em><strong>@UUID[.5kv1YGSsJ8PoRdSe]{Vigilance}</strong></em>
        makes use of this move to give characters a chance to address the danger
        based on vantage, allowing a
        <em><strong>@UUID[.5kv1YGSsJ8PoRdSe#hint]{hint}</strong></em> or
        <em><strong>@UUID[.5kv1YGSsJ8PoRdSe#reveal]{reveal}</strong></em>.</p><ul><li><p><strong>Use
        this move to telegraph an incoming danger, using the impact move if
        ignored.</strong></p></li><li><p><strong>Use this move when you want to
        introduce adversity without spending
        suspense.</strong></p></li></ul><p><span style="color:rgb(110, 110,
        110)"><em>You hear hoofbeats coming, a 4d timer. | The dragon takes a
        deep breath. | You see thick spider webs on the ceiling. | One of the
        tiles ahead of you is slightly raised and
        discolored.</em></span></p><p><span style="color:rgb(110, 110,
        110)"><em>Before walking up to the wrecked caravan, you notice
        <strong>small humanoid tracks</strong> around it. Everything seems too
        quiet.</em></span></p><h2>Resolve</h2><p>Fix a problem to provide a
        quick out and move the story forward. This can be used to connect dots
        with exposition or immediately de-escalate a situation. Normally, it
        would feel like an unearned freebie, but you earn one
        <em><strong>@UUID[.1hwVUU0jguFscQg1#suspense]{suspense}</strong></em> to
        make it a fair trade. Never use it when players are engaged—save it for
        when it's needed.</p><ul><li><p><strong>Use this move to help the
        characters, and get suspense in
        return.</strong></p></li><li><p><strong>Use this move when the players
        are stuck or cornered.</strong></p></li></ul><p><span
        style="color:rgb(110, 110, 110)"><em>You hear from above, "Need some
        help down there?" | The minotaur seems satisfied that it won and turns
        to walk away.</em></span></p><p><span style="color:rgb(110, 110,
        110)"><em>Seeing what happened to Guzrak, the remaining goblins
        <strong>drop their weapons and surrender</strong>.</em></span></p>
