  - sort: 600000
    name: Challenges
    type: text
    _id: 8ROPHl1aOu4ioKhu
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>A framework to represent tasks, obstacles, enemies, and scenarios
        that have greater tenacity and complexity than a single action can
        accomplish. Challenges allow you to track progress towards them, but
        also proactively oppose the PCs. These can be introduced as the GM sees
        fit, but often alongside the
        <em><strong>@UUID[.WDm6CTveG7RjIgHI#build-up]{Build Up}</strong></em>
        suspense move. Each challenge gives the GM 2 bonus
        <em><strong>@UUID[.1hwVUU0jguFscQg1#suspense]{suspense}</strong></em> to
        be spent on moves relating to it, and use a task pool to represent its
        complexity or resilience. They can also have:</p><p>✱
        <strong>Traits:</strong> Qualities they have with strong narrative
        impact, inflicting thorns, denying permissions, or changing
        vantage.</p><p>◉ <strong>Moves:</strong> Suggested impact moves they
        might make. These are examples, not limitations.</p><p>✘ <strong>Fail
        State:</strong> A trigger that signals the challenge failed, like a
        competing timer pool or a specific event. Fail states can also be
        triggered with a <em><strong>@UUID[.qTI1iQgKkAMUFvhm#lock-down]{Lock
        Down}</strong></em> impact move, cutting off any chance of success for
        the PCs when it feels appropriate. Consider Foreshadowing the move to
        give the PCs a chance to intervene and keep the action
        coherent.</p><p><em>Note: Challenges don't always have all
        three.</em></p><section class="grid grid-2col"><div><img
        src="modules/grimwild/assets/img/challenges/challenge1-channel.webp"
        alt="8d | Navigate Channel"></div><div><img
        src="modules/grimwild/assets/img/challenges/challenge2-thief.webp"
        alt="6d | Escaping Thief"><p></p><img
        src="modules/grimwild/assets/img/challenges/challenge3-ritual.webp"
        alt="6d | Stop the Ritual"></div></section><h2>Building
        Challenges</h2><ol><li><p>Assign a task pool (2d - 8d) for its
        tenacity.</p></li><li><p>Add traits (1 or 2) that shape the situation.
        Skip the obvious (storm is windy) and highlight what matters (strong
        winds are blinding). Keep them brief and evocative.</p></li><li><p>List
        short, punchy moves (2 or 3) with flexible interpretations. These are
        examples, not limits. You can spend bonus
        <em><strong>suspense</strong></em> on other moves, or trigger these when
        an impact move is prompted by something else.</p></li><li><p>Define a
        fail state, a specific trigger that prevents that challenge from being
        accomplished. Avoid obvious outcomes (dying in a fight) and focus on
        what creates tension (breaking a code of honor). Players should know the
        fail state unless mystery is part of the fun—and even then, make it
        clear one is in play.</p></li></ol><h2>Battlegrounds</h2><p>This is a
        special kind of combat <em><strong>challenge</strong></em>, where the
        location is important. Identify the environmental elements that play a
        proactive part of the scene. These can be broken down
        into:</p><p><strong>Features:</strong> Elements likely to impact,
        usually complicating, the ongoing action. They have a strong effect on
        vantage and difficulty. <span style="color:rgb(110, 110,
        110)"><em>Strong winds, cluttered warehouse, angry
        onlookers.</em></span></p><p><strong>Threats:</strong> Hazards that
        present extra dangers. They either get 2 suspense of their own, or
        repeat on a timer. They have a strong proactive presence in the scene,
        able to prompt impact moves unless dealt with somehow. <span
        style="color:rgb(110, 110, 110)"><em>4d heavy waves, ○○ aggressive
        spirits, 6d guard patrol.</em></span></p><img
        src="modules/grimwild/assets/img/battleground.svg" alt="Example
        Battlegrounds"><p><em>Note: Enemies gathered into a single task pool are
        listed with dice in front (4d archers). Creatures acting as their own
        challenge (with suspense) are shown with a | after the pool. (8d |
        dragon).</em></p><h2>Using Challenges</h2><p>Challenges are for moments
        of narrative importance. They make whatever you assign them to a
        proactive element in the story. Use them to spotlight what's
        happening—not because it's harder, but because it deserves proper screen
        time and presence. They’re pivotal scenes worthy of demanding attention
        from the characters, and will be a major focus of the session. <span
        style="color:rgb(110, 110, 110)"><em>The sleeping dragon wakes up. | You
        hear drumming from the deep. | Arrows whiz by, it’s an
        ambush!</em></span></p><h2>Linked Challenges</h2><p>Linked challenges
        are greater, more complex interactions, like epicly powerful enemies or
        unbelievably tense social situations. Each part of the whole has its own
        proactive presence in the scene. Give them traits that prompt impact
        moves, triggered by the fiction for dynamic interactions. <span
        style="color:rgb(110, 110, 110)"><em>The dragon has 'protects the body'
        on its claws. If a PC attempts to strike the body, it will prompt a claw
        impact move!</em></span></p><img
        src="modules/grimwild/assets/img/challenges/linked1-civilwar.webp"><p><em>Following
        the death of the Ember Queen, the realm descended into chaos sparking a
        long and bloody civil war. The PCs have managed to bring all three sides
        to the negotiating table, but the road to peace is rocky. They need each
        to sign off on splitting the realm.</em></p><img
        src="modules/grimwild/assets/img/challenges/linked2-dragon.webp"><p><em>The
        Great Red Dragon descends, lured into the PCs' trap by the goats as
        bait. They ready the barbed ballista, knowing they must prevent the
        beast from escaping into the sky. The dragon's kobold minions scurry
        down from its back, swarming the clearing. The battle
        commences.</em></p><blockquote
        style="border-style:solid;border-radius:8px"><h3>The Fiction of Linked
        Challenges</h3><p>In most challenges (especially combat), beating one
        link doesn't necessarily mean it's
        <em><strong>destroyed</strong></em>—it just means it's defeated in the
        greater linked challenge. It may be hindered, weakened, or overcome some
        other way, but that doesn't mean it's gone completely.</p></blockquote>
