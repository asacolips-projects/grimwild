  - sort: 900000
    name: Expanded Downtime
    type: text
    _id: cGgJSZjmuFlLFSGw
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>When the GM declares that <em><strong>@UUID[.uQHSxzoSFeG4ORHo]{time
        passes}</strong></em>, the PCs can decide how their downtime is spent,
        be it drinking merrily, making plans, or striking out on their own.
        Carousing by selling off treasure, and extended rest healing has been
        replaced with downtime actions.</p><h2>Downtime Actions</h2><p>When
        <em><strong>time passes</strong></em>, pick one of the following to show
        how you spent your time. If you sell off treasure, you can pick two
        different actions.</p><h3>Rest</h3><p>Heal all
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.v1Y89kCcCc4AYWaW#marks]{marks}</strong></em>,
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.v1Y89kCcCc4AYWaW#harm]{harm}</strong></em>,
        and all non-permanent
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.v1Y89kCcCc4AYWaW#conditions]{conditions}</strong></em>.
        The GM may decide certain long-term conditions persist through normal
        rest. <span style="color:#6e6e6e"><em>The Bard's 8d Broken Arm heals.
        The Berserker, after taking on a fierce dragon, makes a full
        recovery.</em></span></p><h3>Plan Ahead</h3><p>You prepare for a future
        adventure, giving you a special kind of
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.TFE7qnkVkpzsZYW6#thread]{thread}</strong></em>.
        Write a few words describing the general preparation you make, but save
        the details for later. This thread doesn’t count towards your maximum,
        and can only be used to add story details based on the preparation. The
        thread is lost when <em><strong>time passes</strong></em> again. <span
        style="color:#6e6e6e"><em>The Warlock does a favor for the local
        nobility, earning goodwill. The Rogue borrows a few horses for a quick
        getaway.</em></span></p><h3>Pursue a Goal</h3><p>You take action to work
        on a side goal. Each endeavor is tracked by a task pool. Roll the pool
        each time you take this downtime action, and describe the result. Your
        goal can cover anything from crafting arcana, creating a new spell
        theorem, or even retraining a talent or wise. Work with your GM to
        determine the goal and starting pool size. <span
        style="color:#6e6e6e"><em>The Druid cleanses the nearby forest (6d
        pool). The Cleric learns about esoteric magic (retrain a wise, 4d
        pool).</em></span></p><h3>Unwind</h3><p>You spend time enjoying
        yourself. While this is often carousing with drink and friends, it could
        just as easily be tending to a forgotten shrine, or partaking in the
        arts and theater. Give a vignette and
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.vwluhFw7CUnimj9t]{take
        spark}</strong></em>. <span style="color:#6e6e6e"><em>The Fighter gets a
        new drink named after her. The Monk meditates on top of a lonely
        hill.</em></span></p><h3>Venture</h3><p>You keep moving, doing odd jobs
        or adventuring on your own. Make a story roll to see how it goes. The GM
        may reward you with a minor treasure, rumor, or new ally. On a messy or
        less, it's complicated. <span style="color:#6e6e6e"><em>The Wizard joins
        an expedition for the University. The Paladin defends a nearby town from
        a gnoll attack.</em></span></p>
