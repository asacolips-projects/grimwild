name: Exploration
_id: lvFavQ8BROBgMMZb
pages:
  - sort: 100000
    name: Exploring the Grimwild
    type: text
    _id: iQ3xBZqx5s4XweVx
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Exploration is an adventure, and this pointcrawl system captures that
        spirit. It's about venturing into the unknown, both as your characters
        and as players, uncovering what lies ahead. As you explore, connections
        form naturally, and a narrative begins to emerge—one built from your
        experiences and the discoveries you yourselves have added to the region.
        It's discovery as PCs, but also as players, figuring out and creating a
        region together on the fly and finding the wonder and drama that lies
        within it. This chapter includes rules for the Grimwild setting,
        exploring, and downtime, all entirely optional—use any if they fit your
        style of game.</p><h2>What is the Grimwild?</h2><p>The Grimwild is a
        completely optional campaign setting or exploration system you can bolt
        onto your own setting. It's a chaotic wildland, a once sparsely
        populated borderland that was shattered by a cataclysm half a century
        ago. Within, three realities have collided—the original small towns and
        keeps, the ruins of a long-fallen empire, and a savage wilderness
        teeming with monsters. The Remnants, the Wilds, and the Ruins have fused
        into a surreal region that defies logic and strict canon, the three
        bleeding into each other across the Grimwild's expanse. Old settlements
        have either adapted or vanished, and survivors live in a tenuously
        strange existence where a dragon might nest beneath a town or farmers
        inhabit an ancient wizard’s tower.</p><p>It's a long corridor spanning
        harsh terrain, a week's ride east to west and twice that north to south—
        if the way were clear. Such territory is rare in the Grimwild. Sheer
        cliffs line the stormy eastern coast, jagged mountains rise to the west,
        and dense forests and swamps choke the north and south. Surrounding the
        borders is the fog, impossibly dense.</p><p>To enter the fog and leave
        the Grimwild is to risk becoming lost forever, never knowing which of
        the three realities you will emerge into. Expeditions into and out of
        the region rarely returned. The borderland was written off as a cursed
        wasteland by those outside. Those inside have learned their present
        situation is better than the horrors of the other realms. The Grimwild
        is isolated, left to its own fate.</p><p>The Grimwild is a canon-less
        sandbox where you have the freedom to explore, discover, and make it all
        up as you go. Logical connections don’t matter here, giving you the
        freedom to add whatever sounds fun to your party and let a storyline
        emerge through play. It is a land of discovery, one even its own
        inhabitants don't understand well.</p>
