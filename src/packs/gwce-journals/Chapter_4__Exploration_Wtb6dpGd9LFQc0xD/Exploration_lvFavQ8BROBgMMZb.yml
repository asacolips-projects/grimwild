  - sort: 400000
    name: Region maps
    type: text
    _id: QdJB4eOlIaVTKmF8
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>The Grimwild region map begins with squares along each border: the
        west is nearly impassible mountains, the east a long, cliffside
        coastline. The north is a heavy forest, and the south a dire swamp. And
        throughout each of these is the fog, which you dare not exit— entering
        the fog will take you to one of the three realities, with no way to know
        which one.</p><p>This creates a limited, but completely unknown sandbox
        to begin exploring. You enter on one side of this sandbox, drawing a
        path into it. From there, you begin your exploration. Here's what you
        can spend tokens on, and how much they cost:</p><h2>Points of Interest
        (1-2 tokens)</h2><p>You can place minor (1 token) or major (2 tokens)
        points of any of the following. Major points are larger and have a
        greater impact on the world around
        them.</p><p><strong>@UUID[.NP03XqE067RnowkY#settlement]{Settlement}:</strong>
        Places people live—towns, tribes, or
        villages.</p><p><strong>@UUID[.NP03XqE067RnowkY#sites]{Site}:</strong>
        Places that hold rewards—dungeons, ruins, unique natural
        features.</p><p><strong>@UUID[.NP03XqE067RnowkY#dangers]{Danger}:</strong>
        Hostile monsters, hazardous nature, or enemies.</p><h2>Paths (0-2
        tokens)</h2><p>There are three different types of paths, for varying
        costs. When you place a path, you can add <strong>Passes</strong> such
        as bridges or tunnels for free along it, allowing it to travel over or
        through the terrain. <strong>Waypoints</strong> are added to the path by
        the GM. Each represents 1 day of travel on
        horseback.</p><p><strong>Major Path (2 tokens):</strong> Well-maintained
        roadways or trade routes. Travel is quicker, less dangerous, and
        waypoints are more spread out.</p><p><strong>Minor Path (1
        token):</strong> Lesser trails—footpaths, forest tracks, game
        trails.</p><p><strong>Rough Path (free):</strong> Difficult and
        dangerous terrain—overgrown paths, rocky trails, dry creek beds. These
        may not have waypoints, if travel time is unclear.</p><h2>Special
        Locations (3 tokens)</h2><p>These locations can be placed by anyone for
        3 tokens, though the GM can add them for free to spice up the map, or as
        the story
        requires.</p><p><strong>@UUID[.NP03XqE067RnowkY#curiosities]{Curiosity}:</strong>
        Unclear but intriguing signs or information waiting to be
        explored.</p><p><strong>@UUID[.NP03XqE067RnowkY#barrier]{Barrier}:</strong>
        Obstacles to travel—rivers, mountains, cliffs. Only crossable via
        dangerous rough paths or passes.</p><p><strong>Area:</strong> Large,
        usually natural, spaces with a single theme—lakes, swamps,
        deserts.</p><h2>Making the Map</h2><p>To start off mapping a region,
        begin on one border and
        <em><strong>@UUID[.hiqcakAitXcJk2qe#expand-the-map]{expand the
        map}</strong></em>. The GM draws a rough path into the region, then go
        through one or two rounds, until the map feels just detailed enough to
        venture into.</p><p>When you place something on the map, you always
        label it. This can be a simple evocative label of just a few keywords or
        even a name. If you aren't sure, you can consult the crucibles on pg.
        138 for ideas! You can also label it [Remnants] [Wilds] [Ruins], if you
        want to specify which reality it is mostly from.</p><p>You can add
        factions to the map and campaign as needed. There's a
        @UUID[.NP03XqE067RnowkY#factions]{factions crucible} to
        help.</p><h3>Key</h3><img
        src="modules/grimwild/assets/img/region-key.svg"><h3>Example
        Region</h3><img
        src="modules/grimwild/assets/img/region-example-map.svg">
