    image: {}
    text:
      format: 1
      content: >-
        <p>The GM can declare that <em><strong>time passes</strong></em>, which
        moves the game forward, usually to the next month or season. Try
        creating custom months to add a fantastic touch to your world. Stick to
        a four-season cycle with three months per season, rolled on the tables
        below. Include three simple details like atmospherics, weather, or
        flora—don’t forget to mix in fantastic elements! When you reach another
        month, add three more for it. If you want to keep it simple, you can
        track time passing with a 4d campaign timer.</p><p>For each season
        below, choose one word from the left and one from the right and smash
        them together to create a custom month name (or click to roll for
        one).</p><section class="grid grid-4col"><div><p
        style="text-align:center"><span
        style="font-size:large">@UUID[Compendium.grimwild.gwce-crucibles.RollTable.AGyhzqwQyRYTB1Ho]{SPRING}
        →</span></p><table><tbody><tr><td><p>green</p></td><td><p>bloom</p></td></tr><tr><td><p>petal</p></td><td><p>wind</p></td></tr><tr><td><p>moss</p></td><td><p>wave</p></td></tr><tr><td><p>eager</p></td><td><p>dawn</p></td></tr><tr><td><p>fresh</p></td><td><p>shine</p></td></tr><tr><td><p>well</p></td><td><p>hope</p></td></tr></tbody></table></div><div><p
        style="text-align:center"><span
        style="font-size:large">@UUID[Compendium.grimwild.gwce-crucibles.RollTable.rLxsOIih9RVpHbuJ]{SUMMER}
        →</span></p><table><tbody><tr><td><p>ash</p></td><td><p>storm</p></td></tr><tr><td><p>flood</p></td><td><p>haze</p></td></tr><tr><td><p>sear</p></td><td><p>flare</p></td></tr><tr><td><p>lazy</p></td><td><p>glow</p></td></tr><tr><td><p>gold</p></td><td><p>breeze</p></td></tr><tr><td><p>buzz</p></td><td><p>surge</p></td></tr></tbody></table></div><div><p
        style="text-align:center"><span
        style="font-size:large">@UUID[Compendium.grimwild.gwce-crucibles.RollTable.IdDjMhN7oXKLltk4]{FALL}
        →</span></p><table><tbody><tr><td><p>husk</p></td><td><p>mist</p></td></tr><tr><td><p>wilt</p></td><td><p>moon</p></td></tr><tr><td><p>amber</p></td><td><p>dew</p></td></tr><tr><td><p>rust</p></td><td><p>chill</p></td></tr><tr><td><p>bitter</p></td><td><p>flow</p></td></tr><tr><td><p>turn</p></td><td><p>smoke</p></td></tr></tbody></table></div><div><p
        style="text-align:center"><span
        style="font-size:large">@UUID[Compendium.grimwild.gwce-crucibles.RollTable.nvCVIhGB7iz8zrEW]{WINTER}
        →</span></p><table><tbody><tr><td><p>storm</p></td><td><p>tide</p></td></tr><tr><td><p>bleak</p></td><td><p>gale</p></td></tr><tr><td><p>quiet</p></td><td><p>sheen</p></td></tr><tr><td><p>howl</p></td><td><p>hush</p></td></tr><tr><td><p>frost</p></td><td><p>freeze</p></td></tr><tr><td><p>drift</p></td><td><p>morn</p></td></tr></tbody></table></div></section><p><em>If
        tracking specific months isn’t appealing, try just using parts of the
        season: “The beginning of…”, “The height of…”, and “The end
        of…”</em></p><h3>Example Atmospherics</h3><section class="grid
        grid-4col"><div><ul><li><p><em>frost
        melts</em></p></li><li><p><em>rivers swell</em></p></li><li><p><em>buds
        bloom</em></p></li><li><p><em>emerald
        fields</em></p></li><li><p><em>luminous
        spores</em></p></li><li><p><em>humming
        bees</em></p></li><li><p><em>light
        rainfalls</em></p></li><li><p><em>velvet
        moss</em></p></li><li><p><em>flower fields</em></p></li><li><p><em>calm
        winds</em></p></li><li><p><em>glowing
        fungi</em></p></li><li><p><em>clear
        skies</em></p></li></ul></div><div><ul><li><p><em>endless
        downpours</em></p></li><li><p><em>roaring
        rivers</em></p></li><li><p><em>lightning
        skies</em></p></li><li><p><em>heavy
        stillness</em></p></li><li><p><em>rising
        heat</em></p></li><li><p><em>warm winds</em></p></li><li><p><em>rippling
        fields</em></p></li><li><p><em>golden
        shimmer</em></p></li><li><p><em>insect
        swarms</em></p></li><li><p><em>pollen
        bursts</em></p></li><li><p><em>blooming
        thistles</em></p></li><li><p><em>dying
        fungi</em></p></li></ul></div><div><ul><li><p><em>drifting
