  - sort: 600000
    name: Site Maps
    type: text
    _id: XA33xYXoY9it75R6
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>The 5-Point Site technique, inspired by the 5-Room Dungeon concept,
        is used for mapping adventure locations. These can cover sites from
        warehouses and abandoned city districts, to temples and sunken
        ruins.</p><p>The GM begins by adding the Reward point on the map first,
        then everybody gains their 3 exploration tokens from
        <em><strong>@UUID[.hiqcakAitXcJk2qe#expand-the-map]{expand the
        map}</strong></em>, spending them on rooms, paths, and special
        locations. When you place one of the points, describe it with a two-word
        phrase—or use the settlements, sites, or dangers crucibles on pg. 138.
        Stop when you have all 5 points and the map is just detailed enough to
        enter. The GM decides the path, and what monsters, dangers, and
        challenges await within the site. Here are the points and paths that can
        be added:</p><h2>Rooms (1-2 tokens)</h2><p>Minor rooms cost 1 token,
        while major rooms play a more impactful role, costing
        2.</p><p><strong>Entrance:</strong> The entrance to the site has a
        challenge that blocks the way—it may be trapped, hidden, require a key
        (word, ceremony, object), or has a guardian to overcome. <em>This point
        sets the tone and tests the adventurers’
        mettle.</em></p><p><strong>Puzzle:</strong> An encounter that requires
        clever thinking, roleplaying, or teamwork. Creativity should always be
        rewarded, as there should never be just one resolution to the challenge.
        <em>This is usually a non-combat encounter, adding variety to the
        narrative.</em></p><p><strong>Hitch:</strong> Something unexpected
        catches the party off-guard. This may be a betrayal, illusion, trap,
        dilemma, or hidden threat. If the site calls for it, this may be another
        puzzle or unique combat. <em>This point keeps everyone engaged and on
        edge.</em></p><p><strong>Showdown:</strong> The dungeon’s central
        conflict—usually a big combat or intense encounter with high stakes.
        Incorporate the theme, location, and terrain to make this memory.
        <em>This point brings resolution and key
        rewards.</em></p><p><strong>Reward:</strong> The loot, or knowledge the
        party sought, sometimes with a twist or hook for future adventures.
        <em>This point ends with a memorable moment.</em></p><h2>Special
        Locations (3 tokens)</h2><p><strong>Curiosity:</strong> These are vague
        signs of something more to be explored. They might lead to new
        information, trouble, or both. <em>This point adds more context or a new
        hook.</em></p><p><strong>Barrier:</strong> Obstacles that make getting
        around the site more difficult, such as chasms, and flowing lava.
        <em>This point offers texture and the occasional
        challenge.</em></p><p><strong>Area:</strong> Spaces, usually natural,
        that cover some part or all of the site, such as a lake, or ruined
        debris. <em>This part of the map gives a backdrop, and ties it to the
        outside world.</em></p><h3>Key</h3><img
        src="modules/grimwild/assets/img/site-key.svg"><h3>Example
        Sites</h3><section class="grid grid-2col"><div><img
        src="modules/grimwild/assets/img/site-1.svg"><img
        src="modules/grimwild/assets/img/site-2.svg"></div><div><img
        src="modules/grimwild/assets/img/site-4.svg"><img
        src="modules/grimwild/assets/img/site-3.svg"></div></section>
