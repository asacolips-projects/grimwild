  - sort: 1000000
    name: Communities
    type: text
    _id: PLe154IeuZJxNlZt
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Between delving into forgotten dungeons and monster lairs,
        adventurers need a place to rest. Not only do
        <strong>Communities</strong> represent a place of respite in a dangerous
        world, they can be homes, guilds, and even their own factions. By
        pooling resources as a party, the players can fund their own homestead,
        building them from the ground up, and shaping them as they
        wish.</p><h2>Stockpile</h2><p>This special resource pool represents the
        amount of building materials, manpower, and gold—everything needed to
        begin construction. This pool increases with PC contribution, usually by
        trading in treasure, though the GM may bestow stockpile directly as they
        see fit. When <em><strong>@UUID[.uQHSxzoSFeG4ORHo]{time
        passes}</strong></em>, the party can roll their stockpile pool, adding
        all dropped dice towards completing their next asset. Once the total
        cost of the asset is paid, it’s complete! Extra dropped dice can be
        added to the next.</p><p>When trading in treasure, increase your
        stockpile based on the tier: <strong>minor</strong> treasures net 2
        stockpile, <strong>major</strong> increases it by 4, and
        <strong>mythic</strong> adds 8.</p><img
        src="modules/grimwild/assets/img/community/community.svg"><h2>Assets</h2><p>Newly
        built structures, hosted events, and trained underlings are all assets.
        These expand vantage when finished, often opening new opportunities for
        the PCs, or perhaps even producing stockpile on their own.</p><p>Each
        has a tier that determines its stockpile cost and impact. <strong>Minor
        assets</strong> cost 4 and have a modest impact, usually just giving
        vantage. <strong>Major assets</strong> cost 8 and have a greater impact,
        expanding vantage and having another bonus. Work with the GM to
        determine where your next project falls.</p><p>When finished, the party
        decides on an NPC representative of it and adds a few traits to describe
        them. This might be a barkeep for a new tavern, or a leader for a gang
        of knuckleheads. This helps to bring your community to life, making it
        truly feel lived in—and making the stakes personal should something
        threaten it. See the next page for example assets.</p><h3>Asset
        Examples</h3><section class="grid grid-2col"><div><img
        src="modules/grimwild/assets/img/community/asset1-barracks.svg"><p></p><img
        src="modules/grimwild/assets/img/community/asset3-grandfeast.svg"><p></p><img
        src="modules/grimwild/assets/img/community/asset5-irongriplumbermill.svg"><p></p><img
        src="modules/grimwild/assets/img/community/asset7-hostkinggaramond.svg"></div><div><img
        src="modules/grimwild/assets/img/community/asset2-marketsquare.svg"><p></p><img
        src="modules/grimwild/assets/img/community/asset4-spynetwork.svg"><p></p><img
        src="modules/grimwild/assets/img/community/asset6-alchemist.svg"><p></p><img
        src="modules/grimwild/assets/img/community/asset8-fightersguild.svg"></div></section><h2>Threats</h2><p>Threats
        are everywhere in the Grimwild, and there will always be rival factions,
        destructive beasts, and fool-hardy raiders willing to test your
        defenses. When danger threatens your PC's community, play it out—but as
        the GM, don't take away player achievements. Damage to assets is often
        only superficial, or at worst has a cost of 1 or 2 stockpile to
        rebuild.</p><h2>Advanced Strongholds</h2><p>If you want to make
        communities a core focus, try splitting the stockpile pool into various
        resources such as lumber, ore, foodstores, and coin with separate pools.
        The GM can split the cost between these, rolling each applicable pool
        when time passes.</p><p><em>Adapted from @Studious' Stronghold Rules on
        Discord, and used with permission.</em></p>
