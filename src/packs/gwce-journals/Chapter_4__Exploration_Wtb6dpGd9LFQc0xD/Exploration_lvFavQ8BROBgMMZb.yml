  - sort: 500000
    name: Settlement Maps
    type: text
    _id: ZRyWbqO7k7qig75l
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Road (1 token)</h2><p>Draw a straight line between any two other
        lines on the map. These act as the main roads used throughout the
        settlement. Passes can be added to roads for free when placed, allowing
        them to cross <em><strong>areas</strong></em> and
        <em><strong>barriers</strong></em> as needed.</p><h2>Buildings (2-3
        tokens)</h2><p>Draw a notable building within an empty space between
        roads on the map, generally in small areas you've created. Detail it or
        use the crucible on the next page. Created buildings can be minor or
        major, the difference being the narrative impact.</p><p><strong>Minor
        Building (2 tokens):</strong> When you add a minor building, write it on
        the map in lower case letters.</p><p><strong>Major Building (3
        tokens):</strong> Adding a these buildings tells the GM that you want
        the location to be more important in the setting or story. When you add
        a major building, write it on the map in capital letters.</p><h2>Special
        Locations (3 tokens)</h2><p>These locations can be added by the GM for
        free to spice up the map, or as the story
        requires.</p><p><strong>@UUID[.NP03XqE067RnowkY#curiosities]{Curiosity}:</strong>
        Rumors or interesting locations and happenings that can be
        explored.</p><p><strong>@UUID[.NP03XqE067RnowkY#barrier]{Barrier}:</strong>
        Obstacles such as rivers, changes in elevation, and walls that prevent
        easy travel. These are only crossable via
        passes.</p><p><strong>Area:</strong> Large spaces that are thematically
        distinct from the larger settlement. Natural areas could include lakes
        or indoor caverns, while artificial areas might include city
        districts.</p><h2>Building
        Crucible</h2><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.7yc1Km1cgnetzd0p]{Building
        1}</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.xWlpsmcJxtAP2PKc]{Building
        2}</p><h3>Example Settlement - The Village of Humblefalls</h3><img
        src="modules/grimwild/assets/img/village-example.svg">
