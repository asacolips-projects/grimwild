  - sort: 200000
    name: The Three Realities
    type: text
    _id: EIt6oXw5i5UoKllU
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Below are some basic truths about the three realities that make up
        the Grimwild, a set of pillars for you to start building within and
        around. You can hang your own fiction off of them, or topple them over
        and create something totally different. The point is to make a sandbox
        that's easy to play in.</p><h2>The Remnants</h2><p><em><strong>Forgotten
        People of the Borderlands</strong></em></p><p><strong>Fiercely
        Independent:</strong> Long before the cataclysm, the borderlands thrived
        as a melting pot of cultures, blending traditions into something
        uniquely their own.</p><p><strong>Scattered Settlements:</strong>
        Villages, homesteads, and the occasional keep dot the harsh landscape,
        home to survivors who endure isolation.</p><p><strong>Simple
        Monsters:</strong> Orcs, goblins, and a few larger beasts lurk, but
        they're nothing compared to the horrors of the Ruins and
        Wilds.</p><p><strong>Blended Heritage:</strong> A patchwork of
        languages, customs, and traditions born from centuries of border nations
        mingling.</p><h2>The Wilds</h2><p><em><strong>Untamed and Unforgiving
        Wilderness</strong></em></p><p><strong>Tribal Nomads:</strong> Scattered
        tribes thrive where others perish. Each tribe has its own customs, some
        steeped in ancient magic, while others forge brutal pacts with the
        Wilds’ predators.</p><p><strong>Raw Magic:</strong> The land itself
        pulses with ancient, untamed power, twisting flora, fauna, and even the
        air into something alive and unpredictable.</p><p><strong>Deadly
        Terrain:</strong> Shifting rivers, jagged cliffs, and choking forests
        make navigation a perilous gamble for outsiders.</p><p><strong>Primal
        Beasts:</strong> Terrible creatures stalk the Wilds, from towering apex
        predators to grotesque hybrids warped by magic.</p><h2>The
        Ruins</h2><p><em><strong>A Fallen
        Empire</strong></em></p><p><strong>Shattered Greatness:</strong> Once a
        realm of truly unmatched knowledge and power, now reduced to crumbling
        relics of its glory.</p><p><strong>Forgotten Relics:</strong> Ancient
        artifacts of magic and technology linger, broken or lost, yet still
        brimming with untapped potential.</p><p><strong>Corrupted
        Wasteland:</strong> Overgrown cities and desolate ruins seethe with
        decay, haunted by strange energies and whispers of the
        past.</p><p><strong>Eldritch Horrors:</strong> Nightmarish creatures
        lurk in the shadows—aberrations, cursed beings, and the tortured echoes
        of those consumed by the empire’s collapse.</p>
