  - sort: 300000
    name: Exploration System
    type: text
    _id: hiqcakAitXcJk2qe
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Exploration is played out with a token-based system that lets players
        and the GM work together to create and draw out the world. You gain
        exploration tokens, then spend them to add things to the map, giving
        each player equal opportunity to have an impact, while the spending of a
        resource adds weight to the contributions.</p><p>You're creating a
        pointcrawl to map out the meaningful locations (points) and the
        connections (paths) between them, focusing on what really matters.
        Everything outside those paths? Either it’s tough to get through, or
        there’s nothing worth finding there. This approach keeps the spotlight
        on the places and journeys that drive the story, cutting out the tedium
        and keeping exploration sharp, deliberate, and packed with interesting
        things to experience.</p><h2>Earning Tokens</h2><p><strong>Expand the
        Map:</strong> When the GM chooses to expand the map all players and the
        GM gain 3 exploration tokens.</p><p><strong>Significant
        Discoveries:</strong> You can earn 1-3 tokens by discovering something
        meaningful when you actively explore or uncover key details of an
        area.</p><p><strong>Spend Thread:</strong> You can also spend a thread
        as an exploration token, as long as it is connected to a wise or story
        arc. After, explain how you knew about what you spent it on
        in-character.</p><h2>Spending Tokens</h2><p>Exploration tokens can be
        spent to add points and paths to the map. Points are locations of
        interest, with a few key words to describe them. Paths are drawn to
        connect points or lead off into unexplored territory. The token cost
        depends on the map type (region, settlement, site), covered in the next
        few pages.</p><h2>Expand the Map</h2><p>When the GM wants to encourage
        and make time for exploration and mapping, they can call to
        <em><strong>expand the map</strong></em>. This can be done at any time,
        but must be used when:</p><ul><li><p>The adventuring party reaches the
        edge of the known map and cannot proceed without expanding
        it.</p></li><li><p>There's a natural narrative progression requiring new
        points or paths to open up.</p></li><li><p>Everyone's just excited to
        add more to the map, like at the start or end of a
        session.</p></li></ul><p>When the GM calls to expand the map, everyone
        (GM included) takes <strong>3 exploration tokens</strong>. The map is
        pulled out, and everyone at the table goes around, in any order, adding
        points to the map until all tokens are spent. Tokens disappear once
        finished.</p><h2>The Joy of Exploration</h2><p>Take
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.vwluhFw7CUnimj9t]{spark}</strong></em>
        when you engage with the wonder of exploration as
        such:</p><ul><li><p><strong>Pause and take in the world around
        you</strong>. Let your roleplaying bring out a moment of beauty— what
        does your character notice, and how do they feel about it? Take spark
        when it creates a meaningful scene.</p></li><li><p><strong>Ask a
        question about the world</strong> that nobody knows the answer to,
        sparking curiosity in yourself and others. Encourage wonder. Take spark
        when the table embraces it.</p></li><li><p><strong>Travel somewhere far
        off</strong>, simply to see what’s there. Everyone on the journey takes
        spark.</p></li><li><p><strong>Highlight the unique nature of a
        place</strong>, even a seemingly mundane one. Make the scene about the
        location itself—exploration is at its heart. Take spark when you realize
        you’ll never forget that place.</p></li></ul>
