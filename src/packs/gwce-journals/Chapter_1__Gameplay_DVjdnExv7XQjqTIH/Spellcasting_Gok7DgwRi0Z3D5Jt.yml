  - sort: 200000
    name: Spells
    type: text
    _id: h2oPwWbdbP0KBBeq
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Spells have effects comparable to an action roll, results one person
        with the right training and tools can achieve, while expanding
        vantage—allowing new possibilities through magic. These always use the
        stat referenced in the talent granting spellcasting, or in the case of
        Clerics and some arcana—power pools. Spells are the baseline magnitude
        of spellcasting actions. For most paths, when spells are cast without
        <em><strong>risk</strong></em>, they are automatically successful (as
        all actions) and don’t expend resources.</p><p><span
        style="color:rgb(110, 110, 110)"><em>Just like sticking an arrow in a
        bugbear, a spell can call lightning to strike them or enchant their ally
        to backstab them. [Result: The bugbear is dead.]</em></span></p><p><span
        style="color:rgb(110, 110, 110)"><em>Just like picking a lock or
        smashing it apart, a spell can melt through it with acid or let you
        phase through the door. [Result: You get past the
        lock.]</em></span></p><p><span style="color:rgb(110, 110, 110)"><em>You
        float harmlessly down from the burning airship in the sky. [New
        Possibility, similar in impact to an action.]</em></span></p><p>The
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.rAWKSZVoFjZNOUBd]{vantage}</strong></em>
        from spellcasting also allows you to add trivial magical details as set
        dressing without making an action roll. <span style="color:rgb(110, 110,
        110)"><em>A fire touchstone lights a candle. | The brooms sweep the room
        for you. | You talk to a flower and it starts to bloom.</em></span></p>
