  - sort: 600000
    name: Spellcasting Rulings
    type: text
    _id: t2FOoDjFUEaykaLz
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Magic's a freeform system, built on flexibility and creative rulings
        from the GM, with the understanding that its freedom is meant to
        preserve the feeling of magic. While this system can be exploited in
        unfun ways aimed at "winning," it relies on you buying into your magic
        touchstones and the magnitudes of magic. Don't be a weasel—play in good
        faith and have fun with the freedom it gives you. With that in mind,
        here are some common rulings for various situations involving
        magic:</p><h3>Assisting with magic</h3><p>Using magic to assist a roll
        is just set dressing with no cost—just keep the narration reasonable
        (the weaker end of a spell). Remember you're assisting. If you're making
        the action roll on a group level, cast as
        usual.</p><h3>Detecting</h3><p>With a relevant touchstone, you can
        easily recognize magic. Without one, it's harder, though magic ability
        counts as a factor. Without training, the magic must be very obvious to
        be noticed.</p><h3>Dispelling</h3><p>Anyone aware that something is
        magic can try to dispel it. This does not require training—you can cast
        a spell with relevant touchstones that counters it, cause enough of a
        disturbance to it <span style="color:#6e6e6e"><em>(smashing the arcane
        shield with a battleaxe, shaking someone until they're no longer
        charmed)</em></span>, or outsmarting the magic's logic in some way <span
        style="color:#6e6e6e"><em>(throwing water on a fire spell)</em></span>.
        Creativity should be rewarded here.</p><h3>Magic Duration</h3><p>As a
        rule of thumb, a spell lasts just a moment, maybe two, and a potent
        spell lasts for a scene. This is judged by the GM based on the intended
        effect, which you balance against the magnitude of the
        spell.</p><h3>Trappings</h3><p>Discuss with the GM how your casting
        appears, its visual style, movements you make, and tools you use.
        Casting magic is clear and evident—trying to hide it is, at best,
        extremely difficult, but usually impossible. Losing implements or being
        hindered can deny permission to cast or inflict thorns. <span
        style="color:#6e6e6e"><em>A cleric without the symbol of their god may
        have a harder time casting spells (+1t).</em></span></p><h3>Buffs &amp;
        Enemy Debuffs Spells</h3><p>Beneficial effects to allies, or detrimental
        effects on enemies that expand PC vantage, likely affecting thorns,
        providing a lasting setup, or bestowing a new ability—often as a 2-4d
        timer, power pool, or shared pool of bonus dice. Potent spells often
        target a group, or allow the change to last for the scene. Rituals can
        add permanency or affect massive areas. <span
        style="color:#6e6e6e"><em>Breathe underwater, a 2d timer. (spell) | Fill
        an ally with strength, a 3d bonus dice pool. (potent) | Banish a demon
        back to their home plane. (ritual)</em></span></p><h3>Damage
        Spells</h3><p>Spells that directly harm others. Consider how touchstones
        might affect vantage here. Potent spells often affect an area, or
        provide a critical bonus (greater effect, secondary effect, setup).
        Rituals give extra permissions, such as permanent magical traps, and
        affecting massive areas or someone miles away. <span
        style="color:#6e6e6e"><em>Shoot a bolt of acid. (spell) | Cause a
        massive explosion of fire. (potent) | Afflict a town with an illness.
        (ritual)</em></span></p><h3>Defense Spells</h3><p>Spells that protect
        you and your allies in the moment. The GM chooses the stat for defense
        rolls, and can choose to let you use spellcasting to defend yourself, if
        you have time and warning (relevant touchstones may help these). Spells
        allow you to use your casting stat, while a potent spell can extend to
        allies or lessen the incoming threat. <span
        style="color:#6e6e6e"><em>Create a quick shield. (spell) | Hold falling
        rocks in the air while allies escape.
        (potent)</em></span></p><h3>Healing Spells</h3><p>These spells soothe
        the mind, body, and emotional states. Spells can clear marks, vex, and
        other minor conditions. Potent spells can cure harm and more serious
        conditions. Resurrection and healing extreme conditions is possible
        through rituals, though they are often costly, risky, and may not
        ultimately be worth the price. <span style="color:#6e6e6e"><em>Calm an
        ally frozen in fear. (spell) | Mend a broken bone. (potent) | Regrow a
        limb. (ritual)</em></span></p><h3>Information Spells</h3><p>This type of
        spell unveils secrets, and reveals new knowledge. Spells allow you to
        seek a specific answer, or glean surface level information. Potent
        spells give more detail, or don’t require probing for a specific answer.
        Rituals let you scry and learn clear and detailed information. <span
        style="color:#6e6e6e"><em>Read a stranger’s surface thoughts. (spell) |
        Replay the recent past of a weapon you hold. (potent) | Spy on a foe
        from miles away. (ritual)</em></span></p><h3>Summoning
        Spells</h3><p>These spells create items or conjure creatures to the
        scene. Spells call forth tools and equipment for the scene, or allies
        using a 2d power pool. Potent spells conjure creatures that use a story
        roll or 4d power pool. Rituals can be permanent, on a massive scale, or
        bind powerful creatures with an 8d power pool. <span
        style="color:#6e6e6e"><em>Summon a silver dagger. (spell) | Call a dire
        wolf to your side. (potent) | Conjure a wall around a city.
        (ritual)</em></span></p>
