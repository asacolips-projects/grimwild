  - sort: 400000
    name: Rituals
    type: text
    _id: WlrtIlgx9NHM6uyu
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Rituals can accomplish magical effects far beyond what can be done
        with even <em><strong>potent</strong></em> spells, equal to the labor of
        an entire team of people over an extended period, effects that can have
        significant impact on the world, or push the very limits of
        implausibility. Casting a ritual consists of 3 parts:</p><p><strong>A
        source of magic</strong>, with relevant touchstones. This can be a
        spellcasting talent or a scroll, potion, or other arcana. It might also
        be something creative like asking or tricking a monster into helping.
        Even a PC without magic ability can initiate a ritual as long as they
        have a source of magic.</p><p><strong>Anchors for the ritual</strong>,
        binding the physical and metaphysical realms. These are chosen by the GM
        and players together. They should feel connected to the ritual's
        touchstones and intent, and match the intended impact of the ritual.
        Grander and more powerful rituals should require rarer and more unique
        anchors. Each ritual should have two or three. Check out the crucibles
        below for anchor ideas.</p><blockquote
        style="border-style:solid;border-radius:8px"><h4>Tangible Anchor
        Examples</h4><section class="grid grid-3col"><div><ul><li><p>dangerous
        relic</p></li><li><p>home cooked meal</p></li><li><p>exotic
        ingredients</p></li><li><p>unbroken circle</p></li><li><p>lost
        key</p></li><li><p>predator's
        tooth</p></li></ul></div><div><ul><li><p>circle of
        casters</p></li><li><p>new moon</p></li><li><p>spilled
        blood</p></li><li><p>holy grounds</p></li><li><p>gold and
        jewels</p></li><li><p>piece of
        art</p></li></ul></div><ul><li><p>leyline</p></li><li><p>planar
        essence</p></li><li><p>planet's alignment</p></li><li><p>light
        rain</p></li><li><p>top of a mountain</p></li><li><p>murder
        weapon</p></li></ul></section><h4>Intangible Anchor
        Examples</h4><section class="grid grid-3col"><div><ul><li><p>ancient
        knowledge</p></li><li><p>first light</p></li><li><p>a true
        name</p></li><li><p>divine guidance</p></li><li><p>shared
        secret</p></li><li><p>a place like
        home</p></li></ul></div><div><ul><li><p>deep
        chanting</p></li><li><p>sacred dance</p></li><li><p>waking
        dream</p></li><li><p>true love</p></li><li><p>utter
        silence</p></li><li><p>festive
        holiday</p></li></ul></div><div><ul><li><p>unexpected
        betrayal</p></li><li><p>fond memory</p></li><li><p>child's
        laughter</p></li><li><p>binding vow</p></li><li><p>fun
        melody</p></li><li><p>indulged
        vice</p></li></ul></div></section></blockquote><p><strong>The
        invocation</strong>, to finalize its casting. The invocation is the act
        of casting the ritual, a challenge that must be overcome, made far more
        difficult or even impossible if any of the anchors are missing. All
        rituals take time, while most carry <em><strong>risk</strong></em>,
        using a task pool to complete the casting. <span
        style="color:#6e6e6e"><em>The wizard meticulously draws symbols of chalk
        on the ground while the party protects him. | The Sorcerer strains
        themself, trying to hold the intense magical fire together. | The
        cleansing ritual pulls the corruption out and gives it form—and it’s
        about as friendly as you would expect.</em></span></p>
