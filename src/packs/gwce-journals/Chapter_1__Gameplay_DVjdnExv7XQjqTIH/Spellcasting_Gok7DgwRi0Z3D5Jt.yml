  - sort: 700000
    name: Spellcasting Talents
    type: text
    _id: Znga72phK72goeYs
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Many paths grant <em><strong>spellcasting ability</strong></em> with
        their core talent, while some path talents feature a lesser version also
        granting the ability. The magic from each of these sources is unique,
        using specific touchstones, limitations, and ways to make spells potent.
        See below for a general overview of each.</p><h3>Cleric</h3><p>Holy
        casters that use power pools to track their magic. They cast spells by
        performing general rites, channeling magic through the lens of their
        god. Cleric spellcasting can be taken by other paths with the
        @UUID[Compendium.grimwild.gwce-talents.Item.vrqgtMc5cPttKALb]{Divine
        Blessing} talent.</p><h3>Druid</h3><p>These naturalists don't have
        spellcasting on their own, however those wishing to control the elements
        can take the
        @UUID[Compendium.grimwild.gwce-talents.Item.GKlmqAT2ey3WtA4N]{Primordial
        Bonds} path talent.</p><h3>Psion</h3><p>Mentalists that can unleash
        potent magic at the cost of coming unraveled, making future spells more
        difficult. They use bastions, areas of psychic expertise, as their
        touchstones.</p><h3>Sorcerer</h3><p>Wielders of raw, unbridled, and
        unlimited magic, that can push beyond normal limits for potent spells.
        Their dangerous power combines a magic path (the source of power) with a
        technique (its use) as touchstones. Sorcerer spellcasting can be taken
        by other paths with the
        @UUID[Compendium.grimwild.gwce-talents.Item.cTwECbEA971GWkZe]{Eldritch
        Affinity} talent.</p><h3>Warlock</h3><p>Pact makers with no true magic
        of their own. They instead wield their patron's magic as a weapon, and
        ask for potent spells—weary of angering their fickle master. The nature
        of their patron and pact acts as their
        touchstones.</p><h3>Witch</h3><p>Wonders of magic take time for these
        mysterious casters. They use words of power, the universal language of
        magic, to cast spells, combining two as the touchstones. With enough
        time, they can make them potent, or even
        rituals.</p><h3>Wizard</h3><p>Methodical and scholarly, wizards use
        specific magic formula, spell theorems, to cast spells. They hold an
        ever growing arsenal, with a limited amount of magic per session. Wizard
        spellcasting can be taken by other paths with the
        @UUID[Compendium.grimwild.gwce-talents.Item.k05clNwHNfu182P4]{Arcane
        Training} talent.</p>
    video:
