  - sort: 300000
    name: Potent Spells
    type: text
    _id: 5WIIqKTLpYkHFlvN
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Potent spells accomplish more than a normal spell—they give
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.7bKZMabTgv4QYNEK]{potency}</strong></em>
        and broaden
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.rAWKSZVoFjZNOUBd]{vantage}</strong></em>.
        As with other potent actions (pg. 24), you can attempt jaw-dropping
        effects that are normally impossible. Compared to potent actions,
        though, potent spells tend to have more dramatic effects that bend the
        rules even further, accomplishing tasks that couldn’t be performed with
        a conventional tool. A more impactful effect should be balanced with
        higher thorns and stakes to keep the moment exciting and pivotal. If you
        cast a potent spell with an effect on the level of a normal spell, it
        also bestows another effect, such
        as:</p><ul><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.i6LDtcGasJUZQnAo#criticals]{Critical
        effect}: </strong>add greater effect, secondary effect, or a
        setup</p></li><li><p><strong>Lasting effect:</strong> keep the spell for
        the scene or longer</p></li><li><p><strong>Broad effect:</strong> affect
        a group or area with the spell</p></li></ul><h3>Potent Spells
        Examples</h3><p><em>Picking off these armored goblin raiders one-by-one
        gives them time to rush you, but a potent spell
        <strong>Fireball</strong> could take a group out at once! (+1t → +0t,
        plus a broad effect)</em></p><p><em>This stone wall is too sturdy to
        knock down, but a potent spell <strong>Thunderous Boom</strong> could do
        the trick. (impossible → +1t).</em></p><p><em>The hideout is teeming
        with guards, and a few moments of invisibility won’t get you far, but a
        potent <strong>Invisibility</strong> spell could keep you shrouded until
        you find the exit. (+0t → +0t, plus a lasting effect)</em></p><p><em>The
        rogue is bleeding, and fading in and out, but you can't stop for
        treatment while being chased by hobgoblins. You clutch the symbol of
        your god and ask for help, using your <strong>Healing Rite</strong> to
        cast a potent spell to heal them. (impossible → +1t, new
        possibility)</em></p><p><em>This ice elemental would normally be immune
        to cold magic, but as the daughter of a great ice dragon, you channel
        your <strong>Glacial Fury</strong> for a potent spell to show it the
        true meaning of cold. (impossible → +2t, bypass a
        trait)</em></p><p><em>The guard is suddenly suspicious, so you decide to
        use your <strong>False Memory</strong> spell to clear his mind of the
        last couple seconds, though you know the mind is a delicate thing.
        (impossible→+2t, new possibility)</em></p>
