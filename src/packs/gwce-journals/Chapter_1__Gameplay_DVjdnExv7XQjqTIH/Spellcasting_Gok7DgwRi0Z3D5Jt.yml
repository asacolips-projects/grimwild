name: Spellcasting
_id: Gok7DgwRi0Z3D5Jt
pages:
  - sort: 100000
    name: Spellcasting
    type: text
    _id: VqNKDJVlTDJ6smrU
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Spellcasting is the ability to harness magic, acquired through
        <em><strong>talents</strong></em> or <em><strong>arcana</strong></em>.
        While each style has its quirks, they all follow the same laws of magic.
        Spells are cast as an action (specified in the talent or arcana) using
        <em><strong>@UUID[.uA8QT8XrFuderyGt]{touchstones}</strong></em>—key
        terms like spell names, or godly domains. You interpret these
        on-the-fly, defining the permissions and limitations of your magic when
        you cast. Each source clearly defines its touchstones, casting methods,
        costs, and limitations. Spells cast without
        <em><strong>risk</strong></em> are automatically successful, and don't
        expend resources, unless <em><strong>potent</strong></em>.</p><p>Magic
        has three magnitudes: spells, potent spells, and rituals. Determine the
        magic's magnitude by comparing the impact of the action to what can be
        achieved with a non-magic action (or the narrative impact to the story
        if that’s not possible). This is a judgment call set through play, so
        transparency and consistency are
        key.</p><p><strong>@UUID[.h2oPwWbdbP0KBBeq]{Spells}</strong> are similar
        to an action roll, impactful but not dominating a scene. They should
        feel useful.</p><p><strong>@UUID[.5WIIqKTLpYkHFlvN]{Potent
        spells}</strong> are similar to a group effort, effort over time, or a
        single potent effort. They bend the rules, and should feel
        powerful.</p><p><strong>@UUID[.WlrtIlgx9NHM6uyu]{Rituals}</strong> are
        plot-changing, similar to a large team over an extended period, or a
        massive collective effort. They break the rules, and should feel
        miraculous.</p>
