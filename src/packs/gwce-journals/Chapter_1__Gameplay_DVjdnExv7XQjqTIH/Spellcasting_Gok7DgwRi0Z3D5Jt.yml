  - sort: 500000
    name: Touchstones
    type: text
    _id: uA8QT8XrFuderyGt
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Spellcasting ability comes with touchstones and all magic effects
        must logically align with them, making sense and feeling natural. If it
        feels like a reach, it’s beyond the touchstone’s
        bounds.</p><p><strong>Flaming</strong> can burn or illuminate, but can’t
        calm someone.</p><p><strong>Dazzling</strong> can blind or distract, but
        can’t mend objects.</p><p><strong>Warding</strong> can create barriers
        or protect, but can’t attack.</p><p><span style="color:#6e6e6e"><em>You
        cast Flaming Claw as a spell at the goblins, aiming for a huge claw to
        grab one, ignite it, and hurl it into the rest. This fits the
        touchstones, but your intent—harming multiple goblins at once—might work
        as a spell on a bunch of mooks, but these are some tough goblins. You'll
        have to choose to target just one or cast a potent spell to pull off the
        full effect.</em></span></p><p>The GM can veto spells that don't align
        with your touchstones. They can also instead allow it, but inflict a
        thorn or collateral effects when it's pushing your touchstones, but not
        completely implausible.</p><p><strong>A Slime Wall spell</strong> can
        slow enemies, but has trouble completely blocking them
        (+1t).</p><p><strong>A Dominion spell</strong> can command someone to
        help, but can’t cause wounds.</p><p><strong>A Wand of
        Invisibility</strong> can make objects disappear, but can’t make sounds
        vanish.</p><p><span style="color:#6e6e6e"><em>You want to grab a
        treasure chest and haul it across the chasm and try to cast your Flaming
        Claw spell to do it. Discussing it with the GM, you both decide that the
        claw has a physical form, but since it's on fire, it'll scorch anything
        it touches. The GM says that the chest will be 4d On Fire. This is just
        a spell, since you could get across the chasm with an
        action.</em></span></p><h2>Touchstone Limitations</h2><p>When you take a
        magic talent, have a discussion with the GM about what your magic can
        and can't do. Clearly defining it in this way makes the magic more fun
        to play with—creativity thrives within limitations. If a PC's magic
        feels too broad during the campaign, consider discussing new limitations
        to keep it balanced and engaging. Most limitations arise naturally from
        their touchstones or source.</p><p><span style="color:#6e6e6e"><em>A
        shadow sorcerer limits their magic so it can't be used in direct
        sunlight.</em></span></p><p><span style="color:#6e6e6e"><em>A scholarly
        wizard limits their magic by needing their spellbook in hand to cast
        spells.</em></span></p><p><span style="color:#6e6e6e"><em>A cleric of
        the god of thieves limits their magic so it requires a gold piece for
        their rites.</em></span></p><p></p>
