  - sort: 150000
    name: Designing Arcana
    type: text
    _id: fXwbtovdLaNpoowy
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <ol><li><p><strong>Start with an idea of the magic item.</strong> Where
        does it come from, and what themes should go along with
        it?</p></li><li><p><strong>Pick a function from the list below.</strong>
        This describes the general effect, and acts as a
        touchstone.</p><ul><li><p><strong>Attack:</strong> lash out to deal
        direct harm or destruction.</p></li><li><p><strong>Enhance:</strong>
        temporarily boost senses, ability, or bestow something new.
        </p></li><li><p><strong>Hinder:</strong> impede or debilitate others or
        areas.</p></li><li><p><strong>Influence:</strong> alter thoughts,
        emotions, or perceptions.</p></li><li><p><strong>Protect:</strong>
        defend yourself and others from outside harm or influence.
        </p></li><li><p><strong>Restore:</strong> heal wounds, cleanse maladies,
        and mend materials.</p></li><li><p><strong>Reveal:</strong> sense and
        reveal the hidden, and uncover new information.
        </p></li><li><p><strong>Summon:</strong> manifest objects, creatures, or
        forces themselves. </p></li><li><p><strong>Transform:</strong> change
        the nature or form of the
        subject.</p></li><li><p><strong>Traverse:</strong> move across space,
        through barriers, or in a new
        way.</p></li></ul></li><li><p><strong>Decide on the two remaining
        touchstones.</strong> These should be thematic and focused, evoking the
        magic ability of the arcana. Use the crucibles on the next page for
        inspiration, or to randomize touchstones.</p></li><li><p><strong>Decide
        the tier, based on the magical impact.</strong> Remember that the effect
        is one tier higher if it's expendable, and one lower for unlimited use
        arcana.</p></li><li><p><strong>Pick a fitting form for the
        item.</strong> Consider the magic and function, and pick items that make
        thematic sense, such as a pair of boots using traverse, or a dagger
        using <em>attack</em>. It's okay to subvert expectations,
        too!</p></li><li><p><strong>Write the description</strong>, giving an
        idea as to how the magic manifests and what it does in the fiction. Keep
        this focused on the fiction, the mechanics may change depending on the
        situation and use.</p></li></ol><blockquote
        style="border-style:solid;border-radius:8px"><h3>Open-Ended Arcana
        Creation</h3><p>These rules are a baseline to get started creating
        items. Experienced players and GMs should treat this as guidance. Use
        your vision of the arcana to create it as you see fit, judging the tier
        based on the item’s general abilities and limitations
        afterward.</p></blockquote>
