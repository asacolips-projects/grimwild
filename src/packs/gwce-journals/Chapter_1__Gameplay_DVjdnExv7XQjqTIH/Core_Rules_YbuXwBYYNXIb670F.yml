  - sort: 1200000
    name: Sessions
    type: text
    _id: WZauoxU0hSzW7GlL
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Pre-Session</h2><p>Before each session (after the first), recall the
        previous session and share your PC's best moment. Each player takes
        <em><strong>@UUID[.vwluhFw7CUnimj9t]{spark}</strong></em>, and resets
        <em><strong>@UUID[.TFE7qnkVkpzsZYW6#thread]{thread}</strong></em> and
        all per session talents.</p><p>When all are finished, the GM takes
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.V9XAOE6EuQRhd0cW.JournalEntryPage.1hwVUU0jguFscQg1#suspense]{suspense}</strong></em>
        and recaps the main points of the previous session, tying all of these
        moments together into a proper "Previously on..." and starts the
        session.</p><h3>Per Session Talents</h3><p>Many talents have a set
        number of uses per session, these are reset when before beginning a new
        session. These are balanced around 3 hours of play. If you run longer
        games, the GM can choose to have talents refresh in the middle of a
        session, when it makes thematic sense. <strong>If you prefer talents to
        reset while resting, use the Rest Resets optional rule on page
        174.</strong></p><h2>Experience</h2><p>After each session, take 1 XP and
        fill in its box. You start at level 1 and advance when you fill boxes
        equal to the next level (Level 4→5 = 5 more boxes).</p><p>The GM can
        award 1 bonus XP for a standout session (about 1 in 4). For a slower
        pace, slash each XP box before filling it.</p><h3>Levels</h3><p>PCs
        start at level 1 and can go up to level 7. This takes about 6 months of
        weekly play. Reaching a new level lets you choose a new
        <em><strong>talent</strong></em>. At certain levels, your
        <em><strong>core talent</strong></em> is upgraded as well.</p><p>One-off
        games with experienced players tend to work best at level
        3.</p><blockquote
        style="border-style:solid;border-radius:8px"><h4>Reader Lens -
        D&amp;D</h4><p>Levels don’t translate well between this and d20 fantasy
        games. Levels in Grimwild would be closer to levels 4-11 in 5th edition
        D&amp;D, but even then, most growth happens through versatility, not
        power and more hit points.</p></blockquote><p></p>
