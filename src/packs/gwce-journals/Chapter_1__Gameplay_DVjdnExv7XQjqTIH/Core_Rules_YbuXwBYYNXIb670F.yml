name: Core Rules
_id: YbuXwBYYNXIb670F
pages:
  - sort: 100000
    name: Action Rolls
    type: text
    _id: i6LDtcGasJUZQnAo
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>When you attempt to pull off something risky, clearly describe your
        goal (<em>why you’re doing it</em>) and approach (<em>how you’re doing
        it</em>). The GM will pick which stat the action falls under, and you
        roll that many d6, looking to the highest for your
        result.</p><ul><li><p>(6) <strong>PERFECT</strong>. You
        <strong>succeed</strong> and avoid any trouble</p></li><li><p>(4-5)
        <strong>MESSY.</strong> You <strong>succeed</strong>, but there's also
        trouble. This prompts an <em><strong>impact
        move</strong></em>.</p></li><li><p>(1-3) <strong>GRIM.</strong> You
        <strong>fail</strong>, and there's trouble. This prompts an
        <em><strong>impact move</strong></em>.</p></li></ul><p>The GM makes an
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.V9XAOE6EuQRhd0cW.JournalEntryPage.qTI1iQgKkAMUFvhm]{impact
        move}</strong></em> to introduce consequences. Remember: the characters
        are competent, you’re not rolling to see how you do, you’re rolling to
        see how it goes. The consequences may not even directly relate to the
        action taken.</p><h2>Criticals</h2><p>A
        <em><strong>critical</strong></em> happens when you roll more than one
        6. These ignore
        <em><strong>@UUID[.tKwMCPQjyvrk3NNo]{thorns}</strong></em> , and let you
        choose a critical bonus:</p><ul><li><p><strong>Greater Effect:</strong>
        The action is more impactful. If a
        @UUID[.2nnUgNYYbbPgAqBL#task-pools]{task pool} would be rolled because
        of the action, remove 1d from it before rolling. <span
        style="color:rgb(110, 110, 110)"><em>The knife gets plunged between the
        dragon’s scales. | Your quick-witted remark infuriates
        him.</em></span></p></li><li><p><strong>Secondary Effect:</strong> Gain
        the effects of another related perfect action. <span
        style="color:rgb(110, 110, 110)"><em>With a flick, your attack also
        disarms the pirate. | The baroness is charmed, and she also lets slip a
        secret.</em></span></p></li><li><p><strong>Setup:</strong> Give a
        benefit to a follow-up roll, usually as an
        @UUID[.bs6rHob3redyMuPl#assist]{assist} without @UUID[.#risk]{risk}.
        <span style="color:rgb(110, 110, 110)"><em>Your rain of arrows gives
        your ally a chance to rush through their lines. | You draw the orc’s
        full attention.</em></span></p></li></ul><p><em>If nothing comes to
        mind, take <strong>@UUID[.vwluhFw7CUnimj9t]{spark}</strong> and keep
        moving.</em></p><h2>Risk</h2><p>What counts as risky
        <em><strong>shifts</strong></em> with the moment and tone of the game.
        Most often this is when there is an immediate threat or time is of the
        essence. <strong>Assume the characters are competent and only roll when
        it pushes the story forward</strong>, when meaningful results come about
        no matter the outcome. Damage can sometimes make things risky that
        otherwise wouldn’t be. If there’s no risk, give the PC the
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.V9XAOE6EuQRhd0cW.JournalEntryPage.yzOUHnsPoxCyooSW#spotlight]{spotlight}</strong></em>
        to narrate their success. If failing to do something isn’t an
        interesting consequence, focus on what it costs for them to get what
        they want.</p><p><span style="color:rgb(110, 110, 110)"><em>The Thief is
        picking the lock to a warehouse on the dock (no risk), but city patrols
        are making rounds in the area (now the action is
        risky).</em></span></p><p><span style="color:rgb(110, 110, 110)"><em>The
        Healer needs to administer an antidote to their ally (no risk), but they
        have to act quickly, and get there from across the city (now the action
        is risky).</em></span></p>
