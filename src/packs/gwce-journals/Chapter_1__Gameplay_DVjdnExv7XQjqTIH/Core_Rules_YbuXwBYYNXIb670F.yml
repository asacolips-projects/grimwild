  - sort: 1100000
    name: Damage
    type: text
    _id: v1Y89kCcCc4AYWaW
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Marks</h2><p>Light damage, a temporary hindrance to a stat (out of
        breath, confused). When the stat is rolled, clear the
        <em><strong>mark</strong></em>, and take +1t on the roll.</p><p>If a
        stat is already marked, you take <em><strong>harm</strong></em> (below)
        instead. As long as a stat is unmarked, even if you have its related
        harm, you can take a mark to it.</p><p>Marks are often combined with
        another mark or other consequences when inflicted directly (Agility mark
        + thrown off your horse) as an alternative to harm. You also take a mark
        when you <em><strong>@UUID[.pNW9iH0hc9EFKfPK#push-yourself]{push
        yourself}</strong></em>. If a mark is reduced (such as by a messy
        defense roll), it becomes set dressing.</p><h2>Harm</h2><p>This is a
        lingering hindrance to PC's body or mind. Adventurers have ways to
        protect themselves from <em><strong>harm</strong></em>, whether armor,
        quick reflexes, or magical ability. Take vantage into account—harm
        should only come into play when those defenses can be overcome, or
        circumstances could otherwise leave a character dropped. <strong>When
        harm is likely, and dramatic weight calls for it, the GM can inflict one
        of the following:</strong></p><p><strong>Bloodied:</strong> Pressing
        physical damage that inflicts +1t to Brawn and
        Agility.</p><p><strong>Rattled:</strong> Pressing mental damage that
        inflicts +1t to Wits and Presence.</p><p><strong>Desperate:</strong>
        Damage taking you to the edge, only taken as harm upon a second bloodied
        or rattled, adding +1t to all rolls and making some outright impossible.
        Harm that would leave you desperate a second time drops you instead (see
        below).</p><blockquote
        style="border-style:solid;border-radius:8px"><h4>Example
        Damage</h4><p>Mark + small narrative consequence (mark Agility + drop
        your weapon | mark Wits + take @UUID[.#vex]{vex})</p><p>Two marks (mark
        Agility + Wits as you’re shaken | mark Wits + Presence as you're
        confused)</p><p>Harm (take bloodied as they leave a gash | take rattled
        as you're terrified by what you see)</p><p>Condition (take 3d Blinded as
        they throw sand in your eyes | take Watched as they're
        suspicious)</p></blockquote><h2>Dropped</h2><p>Taking harm while
        Desperate leaves you dropped—you're out of the scene. Make a story roll
        (usually 2d): on a perfect, you're merely out until the scene ends. On a
        messy, things get even worse, like also taking on a temporary
        <em><strong>@UUID[.#conditions]{condition}</strong></em> <span
        style="color:rgb(110, 110, 110)"><em>(4d bleeding, broken leg,
        trauma)</em></span>. On a grim, things get far worse, such as taking on
        a permanent condition <span style="color:rgb(110, 110, 110)"><em>(blind,
        cursed)</em></span>, or ending their story and taking an option
        below.</p><p>You have the final say on long-term and permanent changes
        to your character—including death. When your character would face a
        severe personal consequence, work with the GM to find a good fit for
        your PC and the situation. If it feels like it’s time for your story to
        end, choose <strong>sacrifice</strong>, <strong>retirement</strong>, or
        craft <strong>another end</strong>
        together.</p><h3>Sacrifice</h3><p>When you’re ready, you take one more
        action in the scene, then you die. Your action is an automatic success
        with whatever effect feels appropriate. Work with the GM to describe a
        dramatic and satisfying ending for your
        character.</p><h3>Retirement</h3><p>You’re dropped from the scene, alive
        but deeply scarred somehow. Work with the GM to find an opportunity in
        the near future for your character to retire from the adventure. The
        sooner the better: if you’re dropped again, you’ll
        perish.</p><h3>Another End</h3><p>Not everyone dies a hero or finds
        peace. Some reach an ignoble demise, an ambiguous fate, a turn to
        antagonist, or some other conclusion.</p><blockquote
        style="border-style:solid;border-radius:8px"><h3>On
        Pacing</h3><p>Resolving a dropped character’s fate takes time and
        discussion. One way to keep things moving is to remove a dropped
        character immediately from the scene, but leave their roll and
        resolution until the scene’s end. Keep in mind that the player can still
        decide to resolve their fate at any point in between if it feels
        appropriate, either with a roll or a decision like
        sacrifice.</p></blockquote><h2>Vex</h2><p>This is an intense flash of
        emotion like anger, fear, or confusion. <em><strong>Vex</strong></em> is
        inflicted as a consequence, either on its own or in addition to a mark
        or harm. Vex prompts an immediate, instinctive response. Choose one of
        the following, then interpret the response, which usually lasts a beat
        or two.</p><ul><li><p><strong>Fight:</strong> Lash out recklessly at the
        subject of your fear or hate.</p></li><li><p><strong>Flight:</strong>
        Run from the subject, taking whatever path
        nearest.</p></li><li><p><strong>Freeze:</strong> Stop in your tracks,
        with the emotion taking over your
        mind.</p></li><li><p><strong>Freakout:</strong> Do something else to put
        yourself, others, or your surroundings in harm's
        way.</p></li></ul><p>Your PC is driven by emotion, but you decide how it
        plays out. Aim to balance what's fun, what fits the story, and what
        flows from the emotion.</p><h2>Conditions</h2><p>These are specific
        injuries or maladies that impact only relevant situations and are often
        lasting. They often replace harm, making actions more difficult for the
        afflicted PC, but not bringing them closer to dropped. Conditions can
        be:</p><ul><li><p><strong>Urgent:</strong> These conditions act as
        short-term timers for a worse fate.</p><ul><li><p><span
        style="color:rgb(110, 110, 110)"><em>4d poisoned →
        harm</em></span></p></li><li><p><span style="color:rgb(110, 110,
        110)"><em>6d losing consciousness → out
        cold</em></span></p></li><li><p><span style="color:rgb(110, 110,
        110)"><em>4d bleeding out → death</em></span></p></li><li><p><span
        style="color:rgb(110, 110, 110)"><em>8d losing your mind →
        madness</em></span></p></li></ul></li><li><p><strong>Short-term:</strong>
        These often wear off on their own, shortly.</p><ul><li><p><span
        style="color:rgb(110, 110, 110)"><em>twisted ankle (clears after
        scene)</em></span></p></li><li><p><span style="color:rgb(110, 110,
        110)"><em>drunk (tipsy after scene)</em></span></p></li><li><p><span
        style="color:rgb(110, 110, 110)"><em>8d thrown out
        back</em></span></p></li><li><p><span style="color:rgb(110, 110,
        110)"><em>4d pissed
        off</em></span></p></li></ul></li><li><p><strong>Long-term:</strong>
        These require treatment or intervention to heal, or last for extended
        periods of time. Timers are treated as campaign
        pools.</p><ul><li><p><span style="color:rgb(110, 110, 110)"><em>broken
        arm</em></span></p></li><li><p><span style="color:rgb(110, 110,
        110)"><em>ruined reputation</em></span></p></li><li><p><span
        style="color:rgb(110, 110, 110)"><em>8d witch’s
        curse</em></span></p></li></ul></li><li><p><strong>Permanent:</strong>
        These conditions often stay forever. They might need a ritual or daring
        acts to clear, if they can be healed at all.</p><ul><li><p><span
        style="color:rgb(110, 110, 110)"><em>gouged-out
        eye</em></span></p></li><li><p><span style="color:rgb(110, 110,
        110)"><em>insanity</em></span></p></li><li><p><span
        style="color:rgb(110, 110, 110)"><em>burn
        scars</em></span></p></li></ul></li></ul><p><strong>Take +1t when a
        condition specifically hinders a roll.</strong> Conditions can also
        reduce your <em><strong>@UUID[.rAWKSZVoFjZNOUBd]{vantage}</strong></em>,
        which can prohibit rolls <span style="color:rgb(110, 110, 110)"><em>(you
        can't jump with a broken leg).</em></span></p><p>Conditions clear when
        it makes sense, like after a scene, with rest, or when a pool tracking
        them depletes. They may also require treatment or another specific
        method to clear them. As mentioned earlier, work with the GM to find a
        good fit when you’d take a lasting condition.</p>
