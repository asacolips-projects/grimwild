  - sort: 1150000
    name: Healing
    type: text
    _id: Mo2laiYpBIw2ths2
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Damage can be healed with treatment, which requires time, tools, and
        training. Treatment can be difficult and healing certain injuries may
        always carry <em><strong>risk</strong></em>. Magic may replace some
        requirements, though only
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.Gok7DgwRi0Z3D5Jt.JournalEntryPage.5WIIqKTLpYkHFlvN]{potent
        spells}</strong></em> can heal harm directly. Treatment is almost always
        successful,
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.V9XAOE6EuQRhd0cW.JournalEntryPage.qTI1iQgKkAMUFvhm]{impact
        moves}</strong></em> from treatment bring other problems to the
        forefront, such as time
        pressure.</p><p><em><strong>@UUID[.v1Y89kCcCc4AYWaW#marks]{Marks}</strong></em>
        are too minor to benefit from most
        healing.</p><p><em><strong>@UUID[.v1Y89kCcCc4AYWaW#harm]{Harm}</strong></em>
        is cleared with
        treatment.</p><p><em><strong>@UUID[.v1Y89kCcCc4AYWaW#conditions]{Conditions}</strong></em>
        can be healed when it makes sense, which might need treatment, or
        require working towards a task pool or fulfilling specific requirements
        before it clears.</p><h3>Healing Example</h3><p><em>The Berserker is
        Bloodied—luckily, the Rogue has the healer background, giving them
        vantage to provide treatment as needed. Guards are after the two, and
        they decide if they should risk stopping.</em></p><h4>Situation
        1</h4><p><em>The Berserker and Rogue are both back at their hideout,
        successfully evading the guards. The GM decides treatment isn't risky,
        so the roll is an automatic success.</em></p><h4>Situation
        2</h4><p><em>The Berserker and Rogue duck into an alley, hoping they
        have enough time to bandage the wounds. Treatment here carries risk, so
        the Rogue rolls and gets a Messy. Bloodied is clear, but there's a
        complication, such as...</em></p><ul><li><p><em>The stress starts to get
        to the Rogue. (mark Wits)</em></p></li><li><p><em>The wound is worse
        than it looked, and leaves a scar. (short-term condition)
        </em></p></li><li><p><em>The guard patrol happens across the alley, and
        the two are spotted.</em></p></li><li><p><em>The Rogue does the best
        they can, but can't treat it completely. (mark
        Brawn)</em></p></li></ul><h3>Resting</h3><p>Any significant stretch of
        time between action (a night's camp, a week's travel) clears all marks
        and harm. This natural healing is paced for drama, not
        realism.</p><h3>Downtime</h3><p>This is an extended break, such as a
        month or season. All PCs fully heal, including relevant conditions, and
        reset per-session talents. The GM rolls
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.V9XAOE6EuQRhd0cW.JournalEntryPage.vGSxlgH2QfQMoguw#campaign-pools]{faction
        pools}</strong></em>, then picks one and depletes it completely to move
        the story forward.</p>
