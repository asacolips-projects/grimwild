  - sort: 500000
    name: Working Together
    type: text
    _id: bs6rHob3redyMuPl
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h3>Assist</h3><p>Characters can help allies on their rolls, giving them
        a better chance at success. Describe how you
        <em><strong>assist</strong></em>, then roll 1d when the ally rolls,
        including your results with theirs for the final outcome. Rolling your
        assist die separately lets the table see the impact of your
        help.</p><p>When you assist, you share the risk and consequences. The GM
        makes an impact move for everyone involved, including the original PC
        and everyone who assisted. The GM can hit everyone with the same impact
        move, use different moves for each PC, take suspense for each PC, or any
        combination thereof. <span style="color:#6e6e6e"><em>The Paladin assists
        the Fighter in forcing open a door. The Fighter makes their roll as
        normal, and the Paladin rolls 1d. The Fighter's highest is a 3, but the
        Paladin rolls a 4—the end result is a messy. The help paid off, but the
        GM rolls a timer pool (an impact move) and takes 1
        suspense.</em></span></p><h3>Outside Help</h3><p>Assistance can also
        come from an element outside the party, such as an NPC or the
        environment. The GM rolls 1d to represent the help, and includes the
        result with the character’s for the final
        outcome.</p><h3>Teamwork</h3><p>When a larger group of characters work
        together, only one PC rolls for the action while others can assist, as
        long as it makes narrative sense. The GM decides who rolls—sometimes the
        most skilled when success is more important, and sometimes the least
        when failure has greater impact. The entire group shares the
        consequences, but the scale of the action increase as well. <span
        style="color:#6e6e6e"><em>The group works together to lift a boulder
        (strongest rolls). | Group sneaks around a guard patrol (least sneaky
        rolls). | Group finds information on criminal local faction (most street
        savvy rolls).</em></span></p><h3>Setup</h3><p>When a previous action
        gives you an upper hand in your task, increase your vantage and take
        +1d. <em><strong>Setups</strong></em> handle more impactful but
        temporary fiction changes, lasting between a single follow up action,
        and the rest of the scene depending on the fiction. <span
        style="color:#6e6e6e"><em>The city watch is distracted. | The queen is
        caught off-guard. | The wizard is
        invisible.</em></span></p><h3>Protecting Others</h3><p>When an ally is
        targeted by an impact move from their own action roll, you can choose to
        put yourself in harm's way to protect them. <strong>Make a 1d
        @UUID[.3ZhPTONYCcx0olaV#defense-roll]{defense roll} and share the
        risk</strong>. With a perfect you both avoid the trouble. On a grim, you
        both get hit with it. On a messy, the GM can lighten the consequences
        for you both, or hit only you with the impact move.</p>
