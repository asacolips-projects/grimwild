  - sort: 300000
    name: Spark
    type: text
    _id: vwluhFw7CUnimj9t
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Pure protagonist energy, useful when there’s a pivotal task you want
        to succeed. You can spend <em><strong>spark</strong></em> before any
        type of roll you make to add +1d per spark spent. Characters can have up
        to 2 spark at a time, and it carries over across sessions. Take
        <em><strong>spark</strong></em> when you introduce your own complication
        (a <em><strong>@UUID[.TFE7qnkVkpzsZYW6#tangles]{tangle}</strong></em>),
        roll a
        <em><strong>@UUID[.tKwMCPQjyvrk3NNo#disasters]{disaster}</strong></em>,
        resolve a <em><strong>@UUID[.TFE7qnkVkpzsZYW6#story-arcs]{story
        arc}</strong></em>,
        <em><strong>@UUID[.pNW9iH0hc9EFKfPK#quarrels]{quarrel}</strong></em>
        with an ally, or an ally's
        <em><strong>@UUID[.pNW9iH0hc9EFKfPK#bonds]{bond}</strong></em> with you
        changes.</p>
