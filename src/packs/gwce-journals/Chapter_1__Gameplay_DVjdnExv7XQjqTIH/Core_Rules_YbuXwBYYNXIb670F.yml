  - sort: 600000
    name: Other Rolls
    type: text
    _id: 3ZhPTONYCcx0olaV
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Defense Roll</h2><p>When a character reflexively tries to avoid
        trouble <strong>not caused by their own action roll</strong>, they make
        a <em><strong>defense roll</strong></em>. Characters don't get defense
        rolls against impact moves prompted by their own action rolls—avoiding
        danger is already factored into the roll. Defense rolls usually come
        into play when the GM spends <em><strong>suspense</strong></em> on an
        impact move. The GM decides which stat should be rolled based on the
        danger, and the character’s likely reaction.</p><ul><li><p>(6)
        <strong>PERFECT</strong>. You avoid the incoming
        trouble.</p></li><li><p>(4-5) <strong>MESSY</strong>. You avoid some of
        the trouble. The GM lessens the consequences.</p></li><li><p>(1-3)
        <strong>GRIM</strong>. You're hit with the trouble, and take the full
        consequences of it.</p></li></ul><p>Defense is cinematic—a reaction, out
        of your hands. The GM picks the @UUID[.pNW9iH0hc9EFKfPK#stats]{stat} to
        fit the danger, your PC’s likely reaction, vulnerabilities, and what
        feels right for the moment. This keeps it varied—you can’t always use a
        strong stat. As a player, you can pitch what stat you think makes the
        most sense. See the examples below:</p><p><strong>Brawn:</strong>
        <em>Block or absorb a punch. Hold your breath through poison
        fog.</em></p><p><strong>Agility:</strong> <em>Dodge a warhammer. Keep
        your footing on the crumbling wall.</em></p><p><strong>Wits:</strong>
        <em>See the archer nock an arrow. Catch the flaw in the courtesan’s
        argument.</em></p><p><strong>Presence:</strong> <em>Keep your nerve.
        Push the enchantment from your mind.</em></p><p>With time and warning,
        spellcasters may use magic to defend themselves, as long as it fits
        their spellcasting and
        @UUID[Compendium.grimwild.gwce-journals.JournalEntry.Gok7DgwRi0Z3D5Jt.JournalEntryPage.uA8QT8XrFuderyGt]{touchstones}.</p><h2>Montage
        Roll</h2><p>Not all scenes need to be played out in detail, if you want
        to zoom out on the fiction and accordion in a few beats while still
        leaving the outcome up to dice, make a <em><strong>montage
        roll</strong></em>. Each participating player makes a 2d action roll,
        collaborating on the results. Take the highest result as the final
        outcome for the scene. Zoom back in to key moments on unlikely or
        interesting results.</p><h3>Montage Example</h3><p>You look up to see
        the peak of the mountain, snow lightly drifting down onto your faces.
        It’s a six-hour climb to get to the top, where the cultist sanctum is
        said to hide. We’re going to do a montage roll to see how the trek
        goes.</p><p><em>Ranger: I try to find the safest path, keeping us away
        from unstable ledges. I got 5, a messy.</em></p><p><em>Fighter: I use my
        climbing gear, and see if I can find any shortcuts. Ope, got a grim.
        3.</em></p><p><em>Wizard: I cast a spell to ward away the cold and keep
        us dry on the way up. Perfect! I rolled a 6!</em></p><p><em>Overall, you
        got a perfect, but let’s zoom in on Fighter—as you climb, one of your
        pitons breaks and you’re about to fall. Who saves
        you?</em></p><p><em>Wizard: Oh! I’ll add a little set dressing. I use
        magic to make him as light as a cloud for a moment, so he drifts safely
        to the ground.</em></p><p><em>Fighter: I quickly get up and lie, “I
        could have handled it!” and walk off in a huff.</em></p><p><em>Great—The
        camera looks out over an edge at the top of the mountain. We see the
        ranger’s hand grab the ledge and pull herself up, followed by Wizard and
        Fighter. You’re tired, and a little sore, but ready for a
        fight.</em></p><p></p><h2>Story Roll</h2><p>Some rolls (such as certain
        magic items, wild surges, and doubtful story details) can be made to
        determine the effect of something outside of your PC, but aren't
        directly related to a stat. These are handled with <strong>story
        rolls</strong>.</p><p>Roll dice based on the odds of a favorable outcome
        for your character, usually 2d. The GM may drop the roll to 1d for bad
        odds, or boost it to 3d for good odds. Though rare, thorns can be added
        story rolls, just as any other.</p><p><strong>If the roll is replacing
        an action roll</strong>, usually when the character is directly
        involved, story rolls can prompt impact moves. <span
        style="color:rgb(110, 110, 110)"><em>I flip the switch for the old trap,
        as the goblin runs down the hall toward me. | How many drank from the
        poisoned keg I left in the kitchen?</em></span></p><p><strong>If the
        roll only tests your luck</strong>, it's used to determine the general
        answer to a question—from positive to negative. <span
        style="color:rgb(110, 110, 110)"><em>Does my magical Robe of Pockets
        have anything useful for this? | I look down the hallway, do I see any
        guards?</em></span></p><h2>Forward Momentum</h2><p>If a grim threatens
        to grind the story to a halt, the GM can keep things moving—you get what
        you want, but in a way that makes things worse, or has an unintended
        effect. If a roll somehow turns out to have no effect <em>(the guard was
        already dead)</em>, you learn new info or
        <em><strong>@UUID[.bs6rHob3redyMuPl#setup]{setup} </strong></em>a
        follow-up.</p>
