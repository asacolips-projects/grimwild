  - sort: 800000
    name: Character Details
    type: text
    _id: pNW9iH0hc9EFKfPK
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Backgrounds</h2><p>Your heritage, upbringing, profession—the core of
        your vantage. You choose any two that most influences who you are now.
        This book contains 18 backgrounds, use these to make a character
        quickly, or mix and match wises to create your own. The ragamuffin
        background means you learned a lot from the streets; without it, your
        upbringing is just set dressing.</p><h3>Wises</h3><p>Each background has
        a set of three wises, though you can also create your own for a more
        personalized backstory. These are evocative key phrases that clearly
        expand your vantage. They can cover niche knowledge, key insights you’ve
        picked up, or neat tricks you’ve grown accustomed to using. Wises are
        most often used when adding details to the story and determining
        thorns.</p><h2>Traits and Desires</h2><p>Traits describe the PC's
        personality, while Desires describe what drives them. Choose 2 that
        strongly describe your character, and 1 that doesn’t. These are included
        in your vantage, can often be used to introduce tangles, complications
        stemming from your character (pg. 25). I am brave and rash, but not
        quiet. I want love and thrills, but not wealth.</p><h2>Distinctive
        Features</h2><p>Detail your 3 most distinctive, outward features that
        others quickly notice. This may include clothes, hair, markings, or how
        they hold themself. Consider other features that some may notice after
        spending time traveling with you. Check out the character crucibles
        (@REF) if you need inspiration.</p><h2>Talents</h2><p>Special advantages
        and abilities that set your PC apart. At character creation, you choose
        a path (rogue, wizard, fighter, etc), which gives you its <strong>core
        talent</strong>. The path talents listed below the core align
        thematically, though any talent from any path may be taken as you
        level.</p><p>Remember, Paths on their own don't expand vantage, but
        talents (and especially the core talent) do. Being a "rogue" doesn't
        mean you’re automatically good at stealth, but the Expertise core talent
        expands your vantage which could include
        stealth.</p><h2>Stats</h2><p>Your core capabilities rated 1/poor,
        2/average, or 3/great, used for action and defense rolls. These four
        stats are an abstraction of your baseline ability. Each character starts
        with 1 in each stat, then assigns 4 more points between them. Brawn and
        Agility are considered physical stats, while Wits and Presence are
        mental.</p><ul><li><p><strong>Brawn</strong> is your power, menace, and
        toughness.</p></li><li><p><strong>Agility</strong> is your precision,
        athleticism, and reflexes.</p></li><li><p><strong>Wits</strong> is your
        smarts, trickery, and ability to read
        situations.</p></li><li><p><strong>Presence</strong> is your influence,
        willpower, and ability to read people.</p></li></ul><blockquote
        style="border-style:solid;border-radius:8px"><h4>Reader Lens: Other
        Games</h4><p>Grimwild only has 4 stats, while other games have many more
        actions, moves, or skills. The personalization that these provide are
        handled with vantage in Grimwild. A character with vantage that includes
        pickpocketing will be able to make rolls with fewer thorns, or may even
        automatically succeed, while the action might be considered impossible
        for a character without that
        vantage.</p></blockquote><h2>Bonds</h2><p>Your dynamic with each PC.
        Match an intensity (left) and a nature (right) below, or write your own.
        <em><strong>Bonds</strong></em> are your strongest view of the other PC,
        and not necessarily reciprocal (your tense doubts is their playful
        rivalry). When first established, use your collective past and details
        to interpret the bonds in a way that makes sense.</p><p>You can change a
        bond anytime, such as in response to something they've done or something
        new you've learned about them. When it changes, give a short vignette
        (better if together!). The other PC takes
        <em><strong>@UUID[.vwluhFw7CUnimj9t]{spark}</strong></em>.</p><p></p><h3>Other
        Example Natures</h3><p><em>ambivalence, annoyance, apprehension, awe,
        cynicism, devotion, envy, fascination, fear, indifference, kinship,
        loyalty, obligation, obsession, pity, resentment, reverence, scorn,
        solidarity, spite, trust.</em></p><h2>Quarrels</h2><p>Conflicts between
        PCs—arguments, competitions, or even violence. When two PCs are at odds,
        the story needs a resolution to keep moving forward. Both players may
        see their character as being right, and would never back down, but in
        practice, this grinds the game to a halt. Some players are better at
        convincing others and being assertive, while others would rather quietly
        avoid conflict. <em><strong>Quarrels</strong></em> address both of these
        problems, with the story following what one character (or player) wants,
        while the other has the last word—setting the tone for how things might
        play out moving forward.</p><p>First, make sure all players agree to the
        quarrel. Clearly state the stakes for winning and losing, erring on the
        side of dramatic (bruises, not bloodied). Each player rolls 2d and the
        highest wins (5 beats 4). No talents can be used, it’s assumed both
        characters are doing everything they can to succeed. Others can assist,
        or they can join at 2d with their own agenda. On a tie, compromise or
        keep quarreling.</p><p>The winner narrates how they won. Then, the loser
        narrates how they handle it. The results of the quarrel are final—it's
        okay for the PC that lost to be bitter, but the story moves in the
        winner's direction. All participating PCs take
        <em><strong>@UUID[.vwluhFw7CUnimj9t]{spark}</strong></em>.</p><h3>Quarrel
        Example</h3><p><em>The party just found out that the Thieves' Guild
        plans on assassinating the unjust king, but if they keep the secret,
        they'll be paid for their silence.</em></p><p><em>The paladin and rogue
        are on board, one for the justice, and the other for the money. The
        wizard thinks that even the unjust should have a trial, and should be
        warned.</em></p><p><em>The players decide a quarrel will solve the
        issue. The paladin, assisted by the rogue, will roll against the
        wizard.</em></p><p><em>The paladin and rogue roll [1, 4, 5], while the
        wizard rolls [2, 6]!</em></p><p><em>The wizard wins the quarrel—their
        argument is enough to have the party follow their lead. The paladin
        decides they’ll see the unjust king themself before making a judgment.
        The rogue bites her tongue about it, but may just take the king’s life
        herself if things get dicey— it’s good to have a backup plan. Time to
        warn the king!</em></p><p><em>Everyone who participated takes
        <strong>spark</strong>. Good thing, because it sounds like they’re going
        to run afoul of the Thieves’ Guild. I'm sure this will end
        well...</em></p>
