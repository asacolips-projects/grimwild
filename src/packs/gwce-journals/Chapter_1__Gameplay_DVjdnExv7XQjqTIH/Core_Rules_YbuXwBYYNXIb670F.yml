  - sort: 900000
    name: Potency
    type: text
    _id: 7bKZMabTgv4QYNEK
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>The ability to pull off jaw-dropping feats.
        <em><strong>Potency</strong></em> is outside what is normally possible
        for an adventurer, and requires a talent or other source that explicitly
        grants potency on a specific kind of task (potent spell, a potent feat
        of…). When you have potency on a task, your
        <em><strong>@UUID[.rAWKSZVoFjZNOUBd]{vantage}</strong></em> temporarily
        expands to allow you to attempt something incredible, such
        as:</p><ul><li><p><strong>Group action</strong>: Something a team of
        people could accomplish with an action. <span
        style="color:#6e6e6e"><em>Lifting a boulder, a volley of arrows,
        inciting mutiny.</em></span></p></li><li><p><strong>Stretching
        limits</strong>: Something just beyond normal human limitations. <span
        style="color:#6e6e6e"><em>Leap a massive gap, endure fire, tell
        ridiculous lies.</em></span></p></li><li><p><strong>Mystical</strong>:
        Feats that don't fit in with the above, but have similar narrative
        impact. <span style="color:#6e6e6e"><em>Befriend a wild tiger, use
        echoes to create a rockslide.</em></span></p></li></ul><p>Potency can
        move an action one or more steps on the Vantage Scale towards being
        <em>certain</em>, such as making an <em>impossible</em> action
        <em>doubtful/reasonable</em>, or making a <em>doubtful</em> action
        <em>reasonable/certain</em>.</p><p>Compared to a normal action, a potent
        action can be more intense or broad, create dramatic opportunities, bend
        the rules, or do anything else that feels incredible— within reason. At
        its simplest, a potent action can act like a normal action with a
        critical bonus. Either way, take care that a potent action’s effect and
        risk create an exciting, pivotal moment. Look to
        @UUID[Compendium.grimwild.gwce-journals.JournalEntry.Gok7DgwRi0Z3D5Jt.JournalEntryPage.5WIIqKTLpYkHFlvN]{potent
        spells} for magical examples.</p><h3>Potent Action
        Examples</h3><p><em><strong>A Ranger wishes to track a wild boar through
        the forest.</strong> Normally, this could be reasonable, but with a
        potent action she immediately spots a tusk mark in a nearby tree, making
        this certain (0t → automatic success).</em></p><p><em><strong>A
        Barbarian wishes to challenge an ogre to arm wrestling.</strong>
        Normally, her succeeding would be doubtful, but with a successful potent
        action she manages it more easily, slamming the ogre’s arm down with a
        crash that also draws cheers from the tavern (2t → 1t, secondary
        effect).</em></p><p><em><strong>A Monk wishes to evade some guards by
        running across a pond.</strong> Normally this would be impossible to
        attempt, but with a successful potent action he manages to run across
        the surface of the pond with mystical grace (impossible → 0t, new
        possibility).</em></p><p><em><strong>A Rogue wishes to sneak into the
        counting house.</strong> Security is tight with private mercenaries
        patrolling the grounds, making the task very difficult. With a
        successful potent action, the rogue can see weaknesses in security
        others would miss, finding a shortcut directly to the vaults. (2t → 1t,
        with greater effect).</em></p>
