  - sort: 1000000
    name: Creative Freedom
    type: text
    _id: TFE7qnkVkpzsZYW6
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Set Dressing</h2><p>Any less important details—things that only
        impact how you describe a detail (a torch vs. a glowing alchemical
        bottle) are <strong>set dressing</strong>. You can also add minor,
        common sense details freely. Make assumptions and add details to scenes
        to play off of to keep things flowing dynamically. Anything that’s
        <strong>certain</strong> in your vantage, like knowing someone or having
        equipment that makes sense, can be established
        freely.</p><h2>Tangles</h2><p>These are character-driven complications
        you introduce into a scene and have to follow-up on. In return, you take
        spark. Tangles must stem from your vantage, often from story arcs, or
        traits and desires. These always have an immediate impact, like an
        action roll, an option closing off, or forcing inaction at an important
        moment— similar in weight to an
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.V9XAOE6EuQRhd0cW.JournalEntryPage.qTI1iQgKkAMUFvhm]{impact
        move}</strong></em>. Tangles can be things
        like:</p><ul><li><p><strong>Unwise decisions</strong> your PC would
        likely make. <span style="color:#6e6e6e"><em>You toss aside your sword
        to keep things fair.</em></span></p></li><li><p><strong>Personal
        motivations</strong> over group goals. <span
        style="color:#6e6e6e"><em>You poison the general's wine, getting your
        revenge.</em></span></p></li><li><p><strong>Complications</strong> from
        beliefs or backstory. <span style="color:#6e6e6e"><em>You forgot to tell
        everyone you dated the
        baron.</em></span></p></li></ul><h2>Thread</h2><p>Pure cinematic
        momentum. Each session, you have 2 <em><strong>thread</strong></em>.
        Spend it to add story details that go beyond set dressing, creating new
        opportunities or shifting the scene in your favor. Details that are a
        stretch may also need a
        <em><strong>@UUID[.3ZhPTONYCcx0olaV#story-roll]{story
        roll}</strong></em>. Added details must fit your
        <em><strong>@UUID[.rAWKSZVoFjZNOUBd]{vantage}</strong></em>, at least as
        something doubtful, or tie to a <em><strong>story arc</strong></em>.
        Example details:</p><p><strong>Character:</strong> Gear, contacts,
        backstory. <span style="color:#6e6e6e"><em>You had magical training in
        this city → The wizard was your mentor. | You have the herbalism talent
        → you have the cure for a basic
        ailment.</em></span></p><p><strong>Scene:</strong> NPC actions, objects,
        atmospherics. <span style="color:#6e6e6e"><em>You have a wise in ‘hidden
        paths’ → There's a secret door. | Your story arc is about indulging your
        gambling vice → your target is in a card
        game.</em></span></p><p><strong>Setting:</strong> History, geography,
        factions. <span style="color:#6e6e6e"><em>You’ve traveled this area
        before → there's a town over those hills. | You’ve lived here your whole
        life → the city watch is known to be lazy.</em></span></p><p>Added
        details can't override rolls or contradict the established story. If
        your detail affects another PC, get permission. Details that are
        doubtful, or more impactful may require a story roll to see how true or
        beneficial it is, or there may be nuance added. The GM can also veto
        details to keep things coherent. There are gray zones between set
        dressing, story details, and details simply too impactful to add. Set
        boundaries with your group.</p><h2>Story Arcs</h2><p>Evocative phrases
        that give your PC and group a thematic direction. Find out where they
        lead through play—they're a starting direction, not the destination.
        This is not your ultimate goal, it’s the next step in your
        journey.</p><p>Pick a <em><strong>group arc</strong></em> together, then
        a <em><strong>character arc</strong></em>. Pick from the example below,
        detailing it so it fits your game, or write your own. Keep it
        short.</p><p>Take
        <em><strong>@UUID[.vwluhFw7CUnimj9t]{spark}</strong></em> by resolving
        an arc with a meaningful moment, however big or small it is. This could
        mean achieving your goal, adjusting it for the next step, or moving on
        from it entirely. PCs should gain spark from story arcs around every 2-3
        games. <span style="color:#6e6e6e"><em>You shrug your shoulders and let
        the knight ride off—you have more to worry about than your revenge. |
        You see a wanted poster with your face on it; it's not the kind of fame
        you wanted, but it'll do...</em></span></p><p>(@@ 3-COLUMN TABLE GOES
        HERE @@)</p><p>Group arcs unite players around a theme, while character
        arcs help you express your own story. Most importantly, they give you
        authorial power—<strong>you can use
        </strong><em><strong>thread</strong></em><strong> or
        </strong><em><strong>tangles</strong></em><strong> to add story details
        tied to your arcs to bring them into play!</strong></p><p>Story arcs
        signal to the GM that you want drama, dilemmas, and opportunities to
        arise around them. For struggles (flirt with betrayal), get group
        permission—limiting them to a few sessions and involving everyone makes
        it more fun.</p>
