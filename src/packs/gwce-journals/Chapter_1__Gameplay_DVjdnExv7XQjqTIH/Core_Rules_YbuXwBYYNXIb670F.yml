  - sort: 700000
    name: Diminishing Pools
    type: text
    _id: 2nnUgNYYbbPgAqBL
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>A group of d6s used to track progression towards a narrative event,
        like completing a task, encountering a threat, depleting a resource, or
        passing time. When the pool is triggered, roll all dice in the pool and
        remove those that land with a 1-3 result. Once the pool drops to 0d, its
        event comes to pass and the pool is discarded.</p>

        <p>Pools usually start at 2d/short, 4d/medium, or 8d/long. Make sure to
        reflect the fiction—if a pool and the fiction don't match up, adjust or
        scrap the pool.</p>

        <ul>
            <li>
                <p>If no dice are dropped from a task pool, you can either <strong>push</strong> or <strong>pivot</strong>:</p>
                <ul>
                    <li>
                        <p><strong>Push yourself</strong> (take a mark) to drop 1d anyway. This has a much greater effect on small pools. <span style="color:rgb(110, 110, 110)"><em>Through gritted teeth, you break the blade lock and leave a fresh cut on his cheek.</em></span></p>
                    </li>
                    <li>
                        <p><strong>Pivot</strong> to gain a <strong>secondary effect</strong>, the effects of a perfect on a different but related roll instead. <span style="color:rgb(110, 110, 110)"><em>He's prepared for a cross cut, so instead you switch it up and twist the saber from his grasp.</em></span></p>
                    </li>
                </ul>
            </li>
        </ul>

        <div>
            <ul>
                <li>
                    <p>Similarly, if no dice drop from any other pool, the GM can spend <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.V9XAOE6EuQRhd0cW.JournalEntryPage.1hwVUU0jguFscQg1#suspense]{suspense}</strong></em> to drop 1d anyway.</p>
                </li>
                <li>
                    <p>The greater effect critical bonus, <em><strong>@UUID[.7bKZMabTgv4QYNEK]{potency}</strong></em>, and some talents call for dropping 1d before rolling. This stacks, and has a greater mechanical effect on small pools.</p>
                </li>
            </ul>
            <h2>The Types of Pools</h2>
            <h3>Task Pools</h3>
            <p>This tracks the effort to overcome complicated tasks. In combat, this is used to track the progress towards defeating enemies, with larger pools used for higher tier monsters (pg. 109). <strong>Roll this pool</strong> when action rolls bring the task closer to completion, or it makes sense in the fiction. <span style="color:rgb(110, 110, 110)"><em>4d Barroom Brawl | 6d Tracking Quarry | 8d Escape the Guards | 6d Wind Elemental.</em></span></p>
            <h3>Pressure Pools</h3>
            <p>This tracks imminent threats getting closer. <strong>Roll this pool</strong> often as an impact move to show threats getting closer. <span style="color:rgb(110, 110, 110)"><em>6d Lookouts Spot You | 8d Reinforcements Arrive.</em></span></p>
            <h3>Timer Pools</h3>
            <p>This tracks events unfolding in the background. <strong>Roll this pool</strong> as the occasional impact move, for key moments, time passing, or after a few PCs take action. <span style="color:rgb(110, 110, 110)"><em>8d Sunrise | 6d Corruption Grows | 4d Patrol Returns | 8d Magical Wings.</em></span></p>
            <h3>Resource Pools</h3>
            <p>This tracks the quantity of something precious and important. <strong>Roll this pool</strong> after the resource sees significant usage, or as an occasional impact move, when losing it makes sense. You must be able to roll the pool to use it; once it drops to 0d, the resource has now run out and can’t be used again. Talents such as the Druid’s Wild Shape use this type of pool. <span style="color:rgb(110, 110, 110)"><em>4d Food Supplies | 8d Manpower Left | 6d Looted Treasures | 2d Bulwark.</em></span></p>
            <h3>Power Pools</h3>
            <p>This pool tracks an ability which diminishes with use. If the use of this pool isn’t <em><strong>@UUID[.i6LDtcGasJUZQnAo#risk]{risky}</strong></em>, the action is always successful, but the pool is still rolled to remove dice. If you add extra dice (such as <em><strong>@UUID[.vwluhFw7CUnimj9t]{spark}</strong></em>) to a power pool, track them separately—they don’t affect dropped dice and don’t add to the pool. Creature power pools are rolled when directly targeted, and can roll 1d of their pool to assist. <strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.USX8NsULFBxHjy8p.JournalEntryPage.yTATmOeTrKFLJdL9#bonus-dice-pools]{Bonus dice pools}</strong> are special power pools that are added in addition to the original roll. <strong>Roll this pool as an </strong><em><strong>@UUID[.i6LDtcGasJUZQnAo]{action roll}</strong></em> in place of a stat: take the highest die as the action’s result, then remove dice with a 1–3 result as normal. <span style="color:rgb(110, 110, 110)"><em>8d Blasting Wand | 6d Healing Rite | 4d Clever Disguise.</em></span></p>
            <h3>Linked Pools</h3>
            <p>These are a linked sequence of 2 or more of any kind of pools to extend them with extra “phases”. The next pool isn’t unlocked until the previous reaches 0d. Linked pools handle complexity and larger challenges much better than just adding more dice to one pool. A linked 4d+4d pool is about the same as a 51d pool—taking around 7 rolls for it to drop to 0d. Pools can be linked linearly in a sequence, or in other creative ways, and tend to be more predictable trackers, since only one can drop at a time. <span style="color:rgb(110, 110, 110)"><em>8d Magic Shielding + 2d Wizard | 4d Claws + 4d Tail + 4d Body.</em></span></p>
            <h3>Campaign Pools</h3>
            <p>Covered more extensively in the GM Toolkit Chapter (pg. 90), these are timer pools used to track multi-session and long term events such as faction goals, seasons, and adversarial actions. <strong>Roll this pool</strong> during downtime. <span style="color:rgb(110, 110, 110)"><em>8d Bilgewater Leader Assassinated | 6d Bounty Hunters Find Party | 4d Winter Becomes Spring.</em></span></p>
            <blockquote style="border-style:solid;border-radius:8px">
                <h3>Pools Follow the Fiction</h3>
                <p>Pools are meant to follow the fiction, but occasionally they can end up leading the fiction instead—especially for task pools. When you make a pool roll and drop far more or fewer dice than expected, consider describing the surprising opportunity or setback that arose in the story. But if a pool is ever leading the fiction in a way that’s not dramatic, interesting, or fun for the table, you can always adjust the pool to better align with the fiction, or even clear it completely and move on.</p>
            </blockquote>
        </div>
