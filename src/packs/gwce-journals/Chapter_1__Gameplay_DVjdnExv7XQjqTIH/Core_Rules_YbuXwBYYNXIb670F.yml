  - sort: 400000
    name: Vantage
    type: text
    _id: rAWKSZVoFjZNOUBd
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>This is the character’s frame of reference, and their place in the
        current fiction. Vantage plays a vital role in deciding what rolls can
        be made, how difficult they are, and what is impossible. This is
        something that you're already thinking about intuitively, we're just
        giving it a name to define how it works with other parts of the game,
        and to help answer questions like:</p><section class="grid
        grid-2col"><div><ul><li><p>What <strong>knowledge</strong> could they
        have?</p></li><li><p>What <strong>people</strong> could they
        know?</p></li></ul></div><div><ul><li><p>What <strong>actions</strong>
        could they attempt?</p></li><li><p>What <strong>gear</strong> could they
        be carrying?</p></li></ul></div></section><p>To answer these questions,
        we can build up a picture of the fiction from several layers of
        details:</p><p><strong>First</strong> we consider the character’s core
        identity. The path name is simply a label for organizing talents
        thematically. On its own, it doesn't expand vantage.</p><p><span
        style="color:rgb(110, 110, 110)"><em>background, core and selected
        talents, conditions, stats, arcana,
        etc...</em></span></p><p><strong>Next</strong> we add a bit of room for
        reasonable interpretation. These are things implied by what's on your
        sheet.</p><p><span style="color:rgb(110, 110, 110)"><em>experience in
        picking locks, knows a few people at the mage's college,
        etc...</em></span></p><p><strong>Finally</strong>, we layer on the
        current details of the scene affecting your character. These are the
        current opportunities, obstacles, and overall situation.</p><p><span
        style="color:rgb(110, 110, 110)"><em>it's only lit by moonlight, the
        guard hasn't slept in two days, etc...</em></span></p><p>Together, these
        create a character’s vantage: their frame of reference for what’s
        plausible for them in the current moment. Once you understand the idea
        of vantage, you usually assess it by feeling rather than
        calculation.</p><p></p><h2>The Vantage Scale</h2><p>When deciding how
        plausible something is, use the scale below to guide your judgment. Does
        this feel certain, reasonable, doubtful, or
        impossible?</p><p><strong>Certain.</strong> The core of your character;
        these ideas are directly stated on your character sheet or clearly
        implied by the fiction. A certain action is an automatic success without
        a roll. <span style="color:#6e6e6e"><em>A doctor suturing a wound in a
        calm moment. | A thief carrying
        lockpicks.</em></span></p><p><strong>Reasonable.</strong> This fits your
        character and the situation, but isn’t guaranteed. Actions usually
        require a roll—often with no <em><strong>thorns</strong></em>, sometimes
        with one <em><strong>thorn</strong></em>—but the character has a solid
        chance of success. <span style="color:#6e6e6e"><em>A scholar knowing
        obscure history. | A ranger finding a safe
        path.</em></span></p><p><strong>Doubtful.</strong> This is possible, but
        unlikely—stretching the bounds of your vantage. Actions are possible,
        but difficult, adding several <em><strong>thorns</strong></em> or
        <em><strong>higher stakes</strong></em> (pg. 103). <span
        style="color:#6e6e6e"><em>A sage lifting a heavy portcullis. | A
        courtier knowing forbidden
        lore.</em></span></p><p><strong>Impossible.</strong> This is beyond your
        current vantage, and very hard to believe. An impossible action can’t be
        attempted—try proposing something simpler. Some actions are just beyond
        your normal limits (see potency, pg. 24), while others are too absurd to
        ever be possible. <span style="color:#6e6e6e"><em>A farmer recalling
        lost arcane rituals. | A commoner convincing the king to hand over the
        royal treasure. | A child leaping over a house.</em></span></p><h2>Using
        Vantage</h2><p>Having proper vantage allows you to add relevant story
        details (like having gear, knowledge, connections) or make an action
        more certain. Lacking proper vantage makes an action more doubtful, or
        even impossible. Action and defense rolls use vantage by adding thorns,
        or determining a roll is automatically successful, or impossible.
        Character knowledge is given by the GM or established by the player,
        though a <em><strong>@UUID[.3ZhPTONYCcx0olaV#story-roll]{story
        roll}</strong></em> may be used if there's gray area. Perception is
        handled by <em><strong>vigilance</strong></em> (pg. 107).</p><p>As a
        player, it's your job to advocate for your character when you think a
        part of their vantage might be relevant.</p><p>As a GM, it's your job to
        use a character's vantage to determine where their action falls on the
        vantage scale, then to set an action’s thorns, clarifying effect and
        stakes as needed.</p><h2>Tools of the Trade</h2><p>You’re assumed to
        have the gear and skills that are a given for your
        <em><strong>vantage</strong></em>. This avoids detailed tracking and
        ensures PCs are competent where it makes sense.</p>
