  - sort: 200000
    name: Thorns
    type: text
    _id: tKwMCPQjyvrk3NNo
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>When a roll would involve one or more significant difficulty factors,
        the GM can add eight-sided dice, called <em><strong>thorns</strong></em>
        (t), to the player’s pool to represent these factors. <strong>Rolling
        1–6 on a thorn has no effect, but a 7 or 8 lowers the result one
        step</strong> (perfect → messy → grim → disaster), called a
        <em><strong>cut</strong></em>. If multiple thorns come up 7 or 8, each
        one <em><strong>cuts</strong></em> the roll, lowering it multiple steps.
        Criticals can’t be cut by thorns.</p>

        <p>Each thorn represents a challenging aspect of the task, either
        external to the character <span style="color:rgb(110, 110,
        110)"><em>(outnumbered, wrong tool for the job, intense
        winds)</em></span>, or internal <span style="color:rgb(110, 110,
        110)"><em>(no training, you used to be friends, oh no he's
        hot)</em></span> to the character. Usually a GM assigns a total number
        of thorns to a roll using their gut feel to keep the game flowing.
        Typical play aims for a range of 0–2 total thorns. There’s no cap on the
        number of thorns that can be added to a roll, but the odds of success
        start to drop significantly at 3 or more.</p>

        <h2>Disasters</h2>

        <p>A disaster means you don’t get what you want, and things take a sharp
        turn for the worst. The GM can turn whatever would have happened into
        the worst case scenario. When a PC rolls a disaster, they
        <em><strong>take @UUID[.vwluhFw7CUnimj9t]{spark}</strong></em>.</p>

        <p style="text-align:center"><span style="font-size:large">PERFECT→
        MESSY→ GRIM→ DISASTER</span></p>
