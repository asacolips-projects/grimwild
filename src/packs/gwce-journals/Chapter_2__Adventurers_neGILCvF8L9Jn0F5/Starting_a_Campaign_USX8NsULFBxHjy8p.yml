  - sort: 600000
    name: Group-Building Questions
    type: text
    _id: emtc9Ieuc6gzRiFc
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>During session zero, after you've introduced your characters, or at
        interesting moments in a campaign, ask one of the following questions to
        the person on your right and left. Keep the questions leading and juicy,
        to give something interesting for you both to latch onto. You can also
        use these questions to delve into details about their character that
        you're interested in hearing more about.</p><h3>Questions About Shared
        History</h3><ul><li><p>What <strong>secret</strong> did I tell you that
        you’ve never dared to share with anyone else?</p></li><li><p>When we
        first met, what <strong>mistake</strong> did I make that still
        embarrasses me?</p></li><li><p>What did we <strong>steal</strong>
        together, and how did it bring us closer?</p></li><li><p>When did I
        <strong>save</strong> you from something, and what did it cost
        me?</p></li><li><p>What moment made you decide you could
        <strong>trust</strong> me, even if you didn’t want
        to?</p></li></ul><h3>Questions About Feelings and
        Impressions</h3><ul><li><p>What’s something about me that
        <strong>annoys</strong> you, but you’d miss if I were
        gone?</p></li><li><p>What’s a time I <strong>surprised</strong> you by
        being braver or softer than you expected?</p></li><li><p>What’s a
        <strong>rumor about me</strong> you half believe, but you’re too afraid
        to ask if it’s true?</p></li><li><p>When have I <strong>pushed you
        away,</strong> and how did it hurt?</p></li><li><p>What do you
        <strong>envy</strong> about me, even if you’d never admit it out
        loud?</p></li></ul><h3>Questions About Tensions and
        Challenges</h3><ul><li><p>What’s a <strong>lie</strong> I told you that
        you’re still pretending to believe?</p></li><li><p>What’s a
        <strong>promise</strong> I broke that you haven’t forgiven me
        for?</p></li><li><p>When have I <strong>let you down</strong>, and how
        did you learn to work around me?</p></li><li><p>What’s something
        <strong>dangerous</strong> you think I’m hiding from the
        group?</p></li><li><p>What about me makes you feel like you’re
        <strong>walking on thin ice</strong>?</p></li></ul><h3>Questions About
        Shared Futures</h3><ul><li><p>What’s a <strong>dream</strong> I have
        that you think is foolish, but still want to help me
        achieve?</p></li><li><p>What do you <strong>hope</strong> I’ll never
        find out about your plans?</p></li><li><p>What do you think our
        <strong>journey</strong> will turn me into, and does that scare
        you?</p></li><li><p>When this is all over, where do you
        <strong>imagine</strong> us going together?</p></li><li><p>What’s
        something you think we’ll <strong>regret</strong>, but we’ll do it
        anyway?</p></li></ul><p><em>Note: Try swapping "you" and "I" in these
        questions—flip it around if it's more interesting!</em></p>
