name: Starting a Campaign
_id: USX8NsULFBxHjy8p
pages:
  - sort: 100000
    name: Starting a Campaign
    type: text
    _id: Am7BZhSVdcbP4Aqu
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Start each campaign with a session zero, a campaign brainstorming and
        character creation session where you get everyone on the same page about
        themes, setting, and the kind of game you want to play. Remember, think
        about it like a TV series!</p><ol><li><p><strong>Choose a Theme &amp;
        Setting:</strong> The GM leads the discussion on what campaign themes
        and settings sound fun. Choose a setting or build one
        together.</p></li><li><p><strong>Form the Party:</strong> The players
        form their adventuring party, following the prompts below. The party is
        made before the characters to ensure they fit
        well.</p></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.TFE7qnkVkpzsZYW6#story-arcs]{Set
        Group Arc}:</strong> The players choose a group arc, a goal or theme
        they're interested in playing out as a group. You'll figure out what it
        means in play. (pg.
        26)</p></li><li><p><strong>@UUID[.oeVShHCFM2b9IZiO]{Make
        Characters}:</strong> Follow the character creation flow and make PCs
        together. Prioritize fitting in with the theme, setting, party, and
        group arc.</p></li></ol>
    video:
      controls: true
