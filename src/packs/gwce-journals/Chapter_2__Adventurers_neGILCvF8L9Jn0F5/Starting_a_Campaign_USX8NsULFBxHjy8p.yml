  - sort: 200000
    name: Adventuring Party
    type: text
    _id: nzLK9DbNtrnDeclg
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Your group of adventurers already know each other and have adventured
        together, at least for some time. Answer the prompts below together to
        get a sense of your party's concept to ensure that you build characters
        that fit well within that type of party.</p><h3>Concepts</h3><p>Choose 2
        that you see your party as, and 1 that you definitely
        aren't:</p><section class="grid
        grid-2col"><div><ul><li><p>Conquerors</p></li><li><p>Disciples</p></li><li><p>Explorers</p></li><li><p>Heroes</p></li><li><p>Mercenaries</p></li><li><p>Merchants</p></li></ul></div><div><ul><li><p>Mystics</p></li><li><p>Outsiders</p></li><li><p>Renegades</p></li><li><p>Scholars</p></li><li><p>Scoundrels</p></li><li><p>Wardens</p></li></ul></div></section><p>To
        help whittle down choices, each player and the GM can individually write
        down one group concept they want to play as and one they won't play as,
        then reveal them.</p>
    video:
      controls: true
      volume: 0.5
