  - sort: 400000
    name: Character Creation
    type: text
    _id: oeVShHCFM2b9IZiO
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Follow the steps below to create your character. This order is often
        the simplest, but you should begin where your imagination takes you.
        Character sheets for each path are available wherever you found
        this.</p><ol><li><p><strong>@UUID[.IDib2F8Q1aVGCXEJ]{Backgrounds}:</strong>
        Choose two backgrounds, each with three wises, that detail your heritage
        or professions, covering your tools of the trade and story details.
        (next page)</p></li><li><p><strong>Traits:</strong> Choose 2 you very
        much are and 1 you definitely aren't: <em>brave, caring, confident,
        curious, gentle, honest, honorable, persistent, protective, quiet, rash,
        stubborn.</em></p></li><li><p><strong>Desires:</strong> Choose 2 you
        truly desire and 1 you definitely don't: <em>belonging, glory, harmony,
        honor, justice, knowledge, love, power, renown, thrills, wealth,
        wisdom.</em></p></li><li><p><strong>@UUID[.xnN0DSLzNbkyhxVA]{Features}:</strong>
        Write down three distinctive features, words or short phrases, that
        others soon notice about you, like strong hands, kind eyes, or a
        gravelly
        voice.</p></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm]{Path}:</strong>
        Choose a path, gain its core talent, and pick either another talent from
        your path's list or a non-core talent from another
        path.</p></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.pNW9iH0hc9EFKfPK#stats]{Stats}:</strong>
        Begin with 1 in each stat, then assign 4 more points amongst them as you
        like, to a max of 3 in any single
        stat.</p></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.pNW9iH0hc9EFKfPK#weapon-styles]{Weapon
        Styles}:</strong> Choose your weapon(s), then split two descriptors
        between them as your
        styles.</p></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.TFE7qnkVkpzsZYW6#story-arcs]{Arcs}:</strong>
        Choose one or two character arcs to explore. Don't get too detailed—
        these will get fleshed out during play and can be changed
        anytime.</p></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.pNW9iH0hc9EFKfPK#bonds]{Bonds}:</strong>
        Describe your characters in detail. As you listen, choose one bond you
        have towards each PC, matching together an intensity and a nature of the
        bond.</p></li><li><p><strong>Review:</strong> Revisit the campaign
        theme, setting, party identity, and group arcs you set. Make sure
        everything matches up well and make any
        adjustments.</p></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.3ZhPTONYCcx0olaV#montage-roll]{Montage}:</strong>
        Finish off with a montage of the last adventure you went on together.
        The GM gives a basic overview of the scenario, then you roll a group
        montage (2d each) to see how the whole adventure went. Collaborate to
        narrate your outcomes, working in bonds and other details.</p></li></ol>
