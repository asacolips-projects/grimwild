  - sort: 800000
    name: Paths & Talents
    type: text
    _id: yTATmOeTrKFLJdL9
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Below, you'll find explanations of common options and terms used
        throughout the paths. These clarifications help you better understand
        how to customize your character and make use of talents. Not every path
        is available in every game. Some only fit certain settings and themes.
        Make sure to ask your GM ahead of time what is available.</p><p>Some
        paths include additional character-building features and advice on
        roleplaying. Both are entirely optional, but if they resonate with you,
        lean into them to make those aspects important in the game.</p><h3>Core
        Talents</h3><p>Your core talent powers up as you level. Some paths gain
        bonuses every 2 levels, at 2, 4, and 6, while others gain them every 3
        levels, at 3 and 6. Remember, the max level a character can get to is 7.
        If you choose to keep playing, consider switching out talents at
        milestones in the story to keep the character fresh.</p><h3>Path
        Talents</h3><p>Every path talent is available to every other path. Those
        under each specific path are collected around their loose theme, but by
        no means fit every character in that path, nor do they only fit that
        path. You are encouraged to check out all the talents and pick which
        ones fit your character best.</p><p>To avoid redundancy, similar talents
        across paths have been avoided. Instead, you're encouraged to reflavor
        talents to fit your character's theme. For example, a wizard could take
        the fighter's Bulwark and flavor it as a magical
        shield.</p><h3>"Always"</h3><p>If you have the ability to always succeed
        or receive a benefit, it holds true unless the GM uses the Counter
        impact move, a strong NPC trait is in play, or other extenuating
        circumstances arise. This should be used sparingly to emphasize the
        impact of an exceptional adversary. As a general rule, GMs should do it
        no more than 5% of the time.</p><h3>Bonus Dice Pools</h3><p>These
        special pools are given by Talents, and are added before rolling, unless
        otherwise specified. If added after, they can potentially raise the
        result. Because they are treated as a pool, keep them separate, so other
        dice don’t get added or affect dice
        dropping.</p><h3>Choices</h3><p>Italicized words separated by em dashes
        represent lists of choices, like: <em>one— two— three.</em> These
        represent a limited number of options you must choose from. If instead a
        talent suggests a type of choice, saying "you can do things <strong>such
        as</strong> A and B", then you can extrapolate that out into other
        similar actions.</p><h3>"Given Time"</h3><p>This phrase, included in
        several talents means you need time to do what the talent lets you, but
        how long that is leaves room for interpretation. Go with what makes
        sense, but at the very least it's a narrative beat, a PC action, or some
        time unhindered by disruptive forces. Use story rolls or group consensus
        to decide what counts.</p><h3>Interrupt</h3><p>Make an
        <em><strong>@UUID[.i6LDtcGasJUZQnAo]{action roll} </strong></em>to try
        to stop an
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.V9XAOE6EuQRhd0cW.JournalEntryPage.qTI1iQgKkAMUFvhm]{impact
        move}</strong></em>. This requires a specific talent. If not already
        involved, you now share the risk. On a messy, the GM keeps (or takes)
        their suspense instead of finishing the impact move. On a grim, the GM
        makes the impact move as normal.</p><h3>On a Perfect/Grim</h3><p>Any
        talent that allows you to do something on a perfect also triggers on a
        critical. Those that trigger on a Grim also happen on a
        Disaster.</p><h3>Potency</h3><p>Having
        <em><strong>@UUID[.7bKZMabTgv4QYNEK]{potency}</strong></em>, or pulling
        off <em><strong>potent feats</strong></em> expands your
        <em><strong>@UUID[.rAWKSZVoFjZNOUBd]{vantage}</strong></em> to allow you
        to do something incredible.</p><h3>Push Yourself</h3><p>Expend extra
        effort to activate certain talents that require it. After using the
        talent, and resolving any related rolls, then
        <em><strong>@UUID[.v1Y89kCcCc4AYWaW#marks]{mark}</strong></em> a stat
        (your choice). Choose your moments wisely.</p><h3>"Thematic Path
        Talent"</h3><p>Some core talents allow you to select a temporary or
        changeable path talent to go along with with, such as those granted by
        the <strong>warlock’s pact</strong>, or to the <strong>summoner’s
        vassal</strong>. The trappings for these talents should fit with the
        character and their source. Because of the fleeting nature of these
        talents, PCs (and vassals) can’t use “One time only…” features. Work
        with your GM to see what talents fit.</p>
