  - sort: 300000
    name: Adventurer Paths
    type: text
    _id: ymcJSNLpd5tppzUn
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Paths are collections of talents grouped by common adventuring
        themes. Each has a core talent and core growth—your core talent gets
        stronger as you gain levels. Remember, paths cannot be used to establish
        story details—backgrounds and talents can. Each path is covered in
        detail later in this
        chapter.</p><ul><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm.JournalEntryPage.H0JCDbN6kAyXGxic]{BARD}
        •</strong> <em>Stirring the soul with song or
        deed.</em></p><ul><li><p>Spend inspiration to bolster your allies, and
        influence foes to turn the
        tide.</p></li></ul></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm.JournalEntryPage.EcK2fQRpY99iVSVh]{BERSERKER}
        • </strong><em>Blood, mettle, and the sounds of
        battle.</em></p><ul><li><p>Fly into a <strong>frenzy</strong> to wade
        through foes and lay waste to your
        enemies.</p></li></ul></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm.JournalEntryPage.CwaTNKnbmUxRUSXo]{CLERIC}
        • </strong><em>Faith is stronger than any blade.</em></p><ul><li><p>Use
        your <strong>rites</strong> pools to call upon your god, wielding their
        divine
        magic.</p></li></ul></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm.JournalEntryPage.hx2sET46piKhssI5]{DRUID}
        •</strong> <em>The fury of nature—untamed and
        relentless.</em></p><ul><li><p>Use your <strong>wild shape</strong> pool
        to take bestial forms and learn their
        abilities.</p></li></ul></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm.JournalEntryPage.SCLx2TCkGXDAA7Ja]{FIGHTER}
        •</strong> <em>Resolve honed with every strike.</em></p><ul><li><p>Spend
        <strong>mastery</strong> to fight with unparalleled expertise in your
        chosen
        style.</p></li></ul></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm.JournalEntryPage.ByEYMJ1kzBRfpn5y]{MONK}
        • </strong><em>Perfection is a journey, not a
        destination.</em></p><ul><li><p>Spend <strong>flow</strong> to act with
        mystical grace and stop foes in their
        tracks.</p></li></ul></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm.JournalEntryPage.QR7bLq1C65ipTirU]{PALADIN}
        • </strong><em>An Oath taken, a burden willingly
        carried.</em></p><ul><li><p>Spend <strong>smite</strong> to overcome
        challenges with the power of your
        conviction.</p></li></ul></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm.JournalEntryPage.aThjRNE6lWryUmWv]{RANGER}
        • </strong><em>No escape, no mercy, only the
        chase.</em></p><ul><li><p>Tag a foe as your <strong>quarry</strong> to
        learn about, track, and slay your chosen
        enemy.</p></li></ul></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm.JournalEntryPage.vU1b5kJGIdutFGIZ]{ROGUE}
        • </strong><em>A whisper in the dark, then a quiet
        end.</em></p><ul><li><p>Use your <strong>competence</strong> pool to
        grasp victory from the jaws of
        defeat.</p></li></ul></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm.JournalEntryPage.IAQLEhPcuKUHIvNv]{SORCERER}
        • </strong><em>Magic flows like blood, powerful and
        wild.</em></p><ul><li><p>Use your magic in near infinite ways, but be
        careful of <strong>magical
        twists</strong>.</p></li></ul></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm.JournalEntryPage.nsrd3SWBUdq6RHWP]{WARLOCK}
        • </strong><em>Power always demands a hefty
        price.</em></p><ul><li><p>Bargain with your patron for <strong>Eldritch
        Talents</strong>, but beware their fickle
        nature.</p></li></ul></li><li><p><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm.JournalEntryPage.Chpa2kIFZthAo2T5]{WIZARD}
        • </strong><em>Arcane knowledge, wielded with
        precision.</em></p><ul><li><p>Use the <strong>spell theorems</strong>
        you've learned to call precise magic to your
        hands.</p></li></ul></li></ul><h3>Extra Options</h3><p>Also included are
        the
        <strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm.JournalEntryPage.3Gn22HIAtsedLnmL]{Artificer}</strong>,
        <strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm.JournalEntryPage.xyL3pmEEMNvS9TGR]{Psion}</strong>,
        <strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm.JournalEntryPage.hFdtz4n6rNQwyUAG]{Summoner}</strong>,
        <strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm.JournalEntryPage.XBHO0tGCTQRfA7XS]{Swashbuckler}</strong>,
        and
        <strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.A3ABNLJphHplV8Nm.JournalEntryPage.v5k2XzfSsWqWe9Xn]{Witch}</strong>.
        These alternatives were not a part of the original free version of
        <em>Grimwild</em>. Legacy options—those from the original version of the
        game—are also included on page 178, alongside path talents cut from
        previous versions of the <em>Community Edition</em>.</p>
