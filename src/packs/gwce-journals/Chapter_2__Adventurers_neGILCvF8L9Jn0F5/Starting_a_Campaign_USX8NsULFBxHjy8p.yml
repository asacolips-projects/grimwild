  - sort: 500000
    name: Backgrounds
    type: text
    _id: IDib2F8Q1aVGCXEJ
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Backgrounds are the pillars of your backstory, revealing key aspects
        of who you are. They determine what counts as set dressing—tools of the
        trade and the story details you can add. Start with a simple word or
        phrase, leaving room for growth as your backstory is revealed during
        play. They're just dots to connect later.</p><p>Backgrounds include your
        heritage, social class, or profession. Each background comes with three
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.pNW9iH0hc9EFKfPK#wises]{wises}</strong></em>—evocative
        phrases that highlight areas of knowledge, experience, or awareness from
        that background. They're especially useful for declaring story details,
        providing prompts and ideas to bring into play. Backgrounds serve as a
        clear sign of the important aspects of who you are.</p><p>You have two
        backgrounds. You can choose from the list, use the
        @UUID[.#heritage-crucible]{Heritage crucible}, or use either of those as
        guidelines to create your own. Backgrounds and their wises should fit
        the campaign world and be approved by the GM. A heritage background
        isn't required if you prefer it as just set dressing. If you need more
        ideas for wises, check out the @UUID[.#expanded-wises]{expanded wises
        crucible}!</p><p><span style="color:#6e6e6e"><em>You might have grown up
        poor on the streets, but if you have the Ragamuffin background, you
        learned a lot from that experience, and it's a core part of who you
        are.</em></span></p><p><span style="color:#6e6e6e"><em>You might be a
        dwarf, but having the Dwarf of the Iron Hills background lets you set
        the scope of what it means to be a person from that
        heritage.</em></span></p><p><span style="color:#6e6e6e"><em>A fighter
        with the Warrior and Noble backgrounds feels substantially different
        than one with the Scoundrel and Eccentric
        backgrounds.</em></span></p><p>Each common background has a name, and
        other "Also known as" names. Personalize this to fit the setting—you're
        not just a Charlatan, or even a Spy, you're a <strong>Scarlet Agent of
        the Crown</strong>.</p><p>Common backgrounds also come with three wises.
        Mix and replace these to fit the character. It makes sense for your
        Scarlet Agent to have <em>social graces</em> and <em>timely
        misdirects</em>, but maybe <em>luxuries</em> makes more sense than
        <em>spotting marks</em>.</p><p></p><h2>Common Backgrounds</h2><section
        class="grid grid-2col"><div><ul><li><p><strong>Charlatan</strong> (AKA
        Spy, Swindler)</p><ul><li><p><em>social
        graces</em></p></li><li><p><em>spoting
        marks</em></p></li><li><p><em>timely
        misdirects</em></p></li></ul></li><li><p><strong>Clergy</strong> (AKA
        Cultist,
        Priest)</p><ul><li><p><em>allegories</em></p></li><li><p><em>signs of
        sin</em></p></li><li><p><em>faiths of the
        world</em></p></li></ul></li><li><p><strong>Commoner</strong> (AKA
        Farmer, Villager)</p><ul><li><p><em>local
        customs</em></p></li><li><p><em>practical
        wisdom</em></p></li><li><p><em>superstitions</em></p></li></ul></li><li><p><strong>Crafter</strong>
        (AKA Artisan, Smith)</p><ul><li><p><em>crafting
        quality</em></p></li><li><p><em>trade
        contracts</em></p></li><li><p><em>wear and
        tear</em></p></li></ul></li><li><p><strong>Drifter</strong> (AKA
        Explorer, Vagabond)</p><ul><li><p><em>chance
        meetings</em></p></li><li><p><em>faraway
        tales</em></p></li><li><p><em>lay of the
        land</em></p></li></ul></li><li><p><strong>Eccentric</strong> (AKA
        Hermit, Recluse)</p><ul><li><p><em>hard
        truths</em></p></li><li><p><em>random
        facts</em></p></li><li><p><em>strange
        snacks</em></p></li></ul></li><li><p><strong>Entertainer</strong> (AKA
        Storyteller, Minstrel)</p><ul><li><p><em>legends &amp;
        tales</em></p></li><li><p><em>crowd
        behaviors</em></p></li><li><p><em>stage
        presence</em></p></li></ul></li><li><p><strong>Healer</strong> (AKA
        Herbalist, Physicker)</p><ul><li><p><em>comfort
        foods</em></p></li><li><p><em>signs of
        ailment</em></p></li><li><p><em>herbal
        properties</em></p></li></ul></li><li><p><strong>Hunter</strong> (AKA
        Pathfinder,
        Trapper)</p><ul><li><p><em>survival</em></p></li><li><p><em>tracks</em></p></li><li><p><em>wildlife
        behavior</em></p></li></ul></li></ul></div><div><ul><li><p><strong>Investigator</strong>
        (AKA Guard, Gumshoe)</p><ul><li><p><em>seedy
        areas</em></p></li><li><p><em>connecting the
        dots</em></p></li><li><p><em>body
        language</em></p></li></ul></li><li><p><strong>Mariner</strong> (AKA
        Pirate, Sailor)</p><ul><li><p><em>nautical
        lore</em></p></li><li><p><em>seafaring</em></p></li><li><p><em>weather
        patterns</em></p></li></ul></li><li><p><strong>Mystic</strong> (AKA
        Occultist, Seer)</p><ul><li><p><em>ancient
        prophecies</em></p></li><li><p><em>leylines</em></p></li><li><p><em>symbology</em></p></li></ul></li><li><p><strong>Noble</strong>
        (AKA Aristocrat,
        Diplomat)</p><ul><li><p><em>diplomacy</em></p></li><li><p><em>influential
        contacts</em></p></li><li><p><em>luxuries</em></p></li></ul></li><li><p><strong>Ragamuffin</strong>
        (AKA Cutpurse, Urchin)</p><ul><li><p><em>hidden
        paths</em></p></li><li><p><em>rumors</em></p></li><li><p><em>street
        smarts</em></p></li></ul></li><li><p><strong>Sage</strong> (AKA
        Lorekeeper, Scholar)</p><ul><li><p><em>ancient
        histories</em></p></li><li><p><em>peoples of the
        world</em></p></li><li><p><em>philosophy</em></p></li></ul></li><li><p><strong>Scoundrel</strong>
        (AKA Brigand, Thief)</p><ul><li><p><em>escape
        routes</em></p></li><li><p><em>signs of
        weakness</em></p></li><li><p><em>shady
        connections</em></p></li></ul></li><li><p><strong>Trader</strong> (AKA
        Merchant, Peddler)</p><ul><li><p><em>cultural
        tastes</em></p></li><li><p><em>people's
        desires</em></p></li><li><p><em>rare
        goods</em></p></li></ul></li><li><p><strong>Warrior</strong> (AKA
        Sellsword, Soldier)</p><ul><li><p><em>battle
        plans</em></p></li><li><p><em>improvised
        weapons</em></p></li><li><p><em>war
        stories</em></p><p></p></li></ul></li></ul></div></section><p>Backgrounds
        can evolve as the story unfolds. Start with a simple name and leave room
        for growth as your backstory is revealed. Don't corner your character
        growth before starting. You might start as a Mariner, refine it to
        Pirate, then expand on it to Blackthorn Reaver or First Mate under
        Captain Stormclaw as it comes up in the story. Or you can just keep it
        simple!</p><h3>Expanded
        Wises</h3><table><thead><tr><th><p>Civil</p></th><th><p>Social</p></th><th><p>Historical</p></th><th><p>Natural</p></th><th><p>Mystical</p></th><th><p>Practical</p></th></tr></thead><tbody><tr><td><p>laws
        of the land</p></td><td><p>gambling</p></td><td><p>notable
        figures</p></td><td><p>cartography</p></td><td><p>arcane
        theory</p></td><td><p>cooking</p></td></tr><tr><td><p>bureaucracy</p></td><td><p>banter</p></td><td><p>lost
        relics</p></td><td><p>natural danger</p></td><td><p>pacts &amp;
        binding</p></td><td><p>smuggling</p></td></tr><tr><td><p>the
        press</p></td><td><p>leadership</p></td><td><p>ceremonial
        rites</p></td><td><p>pests &amp;
        plague</p></td><td><p>cosmology</p></td><td><p>clockwork</p></td></tr><tr><td><p>business</p></td><td><p>showmanship</p></td><td><p>festivities</p></td><td><p>overland
        travel</p></td><td><p>local
        spirits</p></td><td><p>jury-rigging</p></td></tr><tr><td><p>taboo</p></td><td><p>blending
        in</p></td><td><p>architecture</p></td><td><p>unnatural
        beasts</p></td><td><p>divine order</p></td><td><p>makeshift
        gear</p></td></tr><tr><td><p>politics</p></td><td><p>networking</p></td><td><p>theater
        &amp; arts</p></td><td><p>seeds &amp;
        harvest</p></td><td><p>esoterica</p></td><td><p>humors</p></td></tr></tbody></table><p></p><h2>Heritage</h2><p>Heritage
        reflects your culture, ancestry, and homeland. Use the Heritage Crucible
        below for inspiration: roll three words, pick two, and combine them. You
        can interpret these words literally or figuratively, or use them as they
        are.</p><p>Once you set your heritage, give it three wises. Use those
        from common backgrounds (previous page), the expanded wises crucible
        (above), or make up your own. These wises reflect traits commonly shared
        by most people from your heritage. This continues throughout the game as
        you figure out more about your people through play. <strong>In short,
        you know what the Orcs of the Verdant Boglands are like because you are
        one!</strong></p><h3>Heritage
        Crucible</h3><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.SJvxPOsnrmQD1QLy]{Heritage
        -
        Folk}</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.VZ40LykXQ1o0Uf7F]{Heritage
        -
        Mood}</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.GFj5Gr2Mi8Oxu9ob]{Heritage
        - Land}</p>
