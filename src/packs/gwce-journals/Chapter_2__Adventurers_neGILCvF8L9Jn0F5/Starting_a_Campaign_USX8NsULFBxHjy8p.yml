      content: >-
        <p>Choosing 2-3 distinctive features helps cement your character not
        only in your mind, but also in the shared imagination space at the
        table. You can come back to your features again and again during scenes
        to add them in to paint the scene. Be open to change over time as
        well.</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.sp7gd0SeOnIrHaKw]{Character
        -
        Personality}</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.vUmJI4LDsTmbQRIx]{Character
        -
        Clothing}</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.KrGLVTOXVjUlJnSk]{Character
        -
        Voice}</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.L9XSMRFVaZx4D27r]{Character
        -
        Body}</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.7p9XYEy2VaJ0mzQa]{Character
        - Eyes}</p>
