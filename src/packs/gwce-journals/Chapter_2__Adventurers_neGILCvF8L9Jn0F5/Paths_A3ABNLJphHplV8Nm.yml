      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><em><strong>AKA the assassin, cutpurse, infiltrator</strong></em></p>

        <p><em>You live and operate in the margins, striking unseen and
        disappearing before anyone knows you were there.</em></p>

        <p><strong>Core Talent:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.dYITChWynQsk7Fl1]{Expertise}</p>

        <p><strong>Path Talents:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.QrFzKjvCXiIa419l]{Mastermind}
        @UUID[Compendium.grimwild.gwce-talents.Item.rcvzvK5iRrOQh4Hg]{Distraction}
        @UUID[Compendium.grimwild.gwce-talents.Item.cTwECbEA971GWkZe]{Eldritch
        Affinity}
        @UUID[Compendium.grimwild.gwce-talents.Item.2uxcSShENkGU3g6l]{Lurker}
        @UUID[Compendium.grimwild.gwce-talents.Item.8RjZk03Y9jJldohE]{Opportunist}
        @UUID[Compendium.grimwild.gwce-talents.Item.mzEBnYPMihuApSYI]{Poisoner}
        @UUID[Compendium.grimwild.gwce-talents.Item.XyBQNPB14mcV0LHg]{Weasel}</p>

        <h3>Thieves Guild (Optional)</h3>

        <p>Many rogues learned their trade from a thieves' guild, underground
        network or criminal ring. These are all one form of a guild or another,
        whether formal or not.</p>

        <section class="grid grid-3col">
            <div>
                <ul>
                    <li>
                        <p>like family</p>
                    </li>
                    <li>
                        <p>elite training</p>
                    </li>
                    <li>
                        <p>cultish</p>
                    </li>
                    <li>
                        <p>turf-obsessed</p>
                    </li>
                </ul>
            </div>
            <div>
                <ul>
                    <li>
                        <p>heroes</p>
                    </li>
                    <li>
                        <p>mercenaries</p>
                    </li>
                    <li>
                        <p>mystics</p>
                    </li>
                    <li>
                        <p>outsiders</p>
                    </li>
                </ul>
            </div>
            <div>
                <ul>
                    <li>
                        <p>influential</p>
                    </li>
                    <li>
                        <p>just business</p>
                    </li>
                    <li>
                        <p>in the open</p>
                    </li>
                    <li>
                        <p>follows code</p>
                    </li>
                </ul>
            </div>
        </section>

        <h3>Criminal History (Optional)</h3>

        <p>Given their skill set, a rogue either learned their trade by way of
        crime or possess the skills to make an excellent criminal, for which
        there's no lack of opportunities. As you start your adventuring career,
        it's likely you have some lingering criminal history, a past that can
        come back to haunt you in quite fun, dramatic ways. Create one or more
        past crimes by setting the <strong>crime</strong> (severity &amp;
        nature), your <strong>reputation</strong> from it, and your own
        <strong>reaction</strong> about the crime.</p>

