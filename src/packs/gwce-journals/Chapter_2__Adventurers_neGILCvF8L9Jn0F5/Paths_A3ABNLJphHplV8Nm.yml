  - sort: 400000
    name: Fighter
    type: text
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><em><strong>AKA the blademaster, duelist,
        sargeant</strong></em></p><p><em>You become one with your weapon, and
        through it, you find your real purpose in this
        life.</em></p><p><strong>Core Talent:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.Z0LTcQtNUVNcoVIm]{Weapon
        Mastery}</p><p><strong>Path Talents:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.k05clNwHNfu182P4]{Arcane
        Training}
        @UUID[Compendium.grimwild.gwce-talents.Item.HyxdTMa3rkCyf4nM]{Bulwark}
        @UUID[Compendium.grimwild.gwce-talents.Item.KOT6ZQ5BGKSDcXAG]{Control}
        @UUID[Compendium.grimwild.gwce-talents.Item.e8XR5ciCgFEKJJYJ]{Got
        Your Back}
        @UUID[Compendium.grimwild.gwce-talents.Item.T9Nt4i51NWRAgi2h]{Measured
        Tones}
        @UUID[Compendium.grimwild.gwce-talents.Item.2WWeYwl3Fvfytj5P]{Swift
        Recovery}
        @UUID[Compendium.grimwild.gwce-talents.Item.ohNk7c299CHCYyfZ]{Tactician}</p><h3>Weapon
        Origin (Optional)</h3><p>For many fighters, their weapon is an important
        part of their past. Give your weapon some character and it will become a
        character itself in the story. Roll d66 twice on the table below to give
        your weapon, or each of your weapons, its own small story. You can also
        choose, or make up your own.</p><section class="grid
        grid-3col"><div><ul><li><p>etched with words of loss</p></li><li><p>gift
        from a childhood mentor</p></li><li><p>given to you by your
        father</p></li><li><p>taken from a dead body</p></li><li><p>marred with
        blade nicks</p></li><li><p>made from a rare
        material</p></li></ul></div><div><ul><li><p>stolen from a family
        member</p></li><li><p>covered in burn marks</p></li><li><p>carved with
        friend's initials</p></li><li><p>with a faded family
        crest</p></li><li><p>taken as spoils of war</p></li><li><p>scratched
        from fierce battle</p></li></ul></div><div><ul><li><p>marked by a secret
        society</p></li><li><p>with a hidden
        compartment</p></li><li><p>inscribed with a quote</p></li><li><p>give as
        a peace offering</p></li><li><p>belonged to a
        gambler</p></li><li><p>patched many
        times</p></li></ul></div></section><h3>Combat Maneuvers
        (Advice)</h3><p>Action rolls let you flavor combat however you
        like—don’t just swing a sword or jab a spear. Lean into the dramatic
        flowing nature of combat. Use mastery for
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.bs6rHob3redyMuPl#setup]{setups}</strong></em>
        and
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.i6LDtcGasJUZQnAo#criticals]{secondary
        effects}</strong></em> to remove thorns or shift the fight. Don’t tunnel
        vision on the kill, either—use your actions to change the battle to end
        it faster! Of course, anyone can try these, but as a fighter, you should
        master them.</p><ul><li><p><strong>Blind:</strong> Cloud their vision to
        leave them vulnerable.</p></li><li><p><strong>Disarm:</strong> Take
        their weapon to stop their
        advance.</p></li><li><p><strong>Knockdown:</strong> Put them on the
        ground to gain the upper hand.</p></li><li><p><strong>Pin down:</strong>
        Trap them in a position to keep them from acting or
        escaping.</p></li><li><p><strong>Pull:</strong> Drag them into danger or
        out of position.</p></li><li><p><strong>Push:</strong> Shove them away
        to protect allies or disrupt their own
        lines.</p></li><li><p><strong>Sunder:</strong> Break their gear to limit
        their options or get around their
        defenses.</p></li><li><p><strong>Unnerve:</strong> Leave them shaken and
        questioning their choices.</p></li></ul>
