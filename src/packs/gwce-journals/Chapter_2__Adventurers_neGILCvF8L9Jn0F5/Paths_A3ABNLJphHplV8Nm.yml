  - sort: 400000
    name: Witch
    type: text
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><em><strong>AKA the sibyl, oracle, shaman</strong></em></p><p><em>You
        are blessed with the knowledge of old magic, wielding the ability to
        speak the language of the universe.</em></p><p><strong>Core
        Talent:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.ycuMJNdbgri9b9XV]{Hidden
        Magic}</p><p><strong>Path Talents:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.EAvEzqBuwZwroyZz]{Bailiwick}
        @UUID[Compendium.grimwild.gwce-talents.Item.p4nH22ifVWTkzmzr]{Evil
        Eye}
        @UUID[Compendium.grimwild.gwce-talents.Item.Q3arxoJ2ScEqEyb8]{Familiar}
        @UUID[Compendium.grimwild.gwce-talents.Item.qZIcwbT6Jd4IBgS6]{Herbalism}
        @UUID[Compendium.grimwild.gwce-talents.Item.e70GiK2WwHRyWg6z]{Homely
        Hovel}
        @UUID[Compendium.grimwild.gwce-talents.Item.u5p9sMd7x2PaJoIs]{Soothsayer}
        @UUID[Compendium.grimwild.gwce-talents.Item.ZOjFacfhwal8rIpe]{Wonder
        Magnet}</p><h3>Afflictions (Optional)</h3><p>Witches are odd and
        mysterious spellcasters, some with strange maladies. This affliction is
        something you've grown accustomed to, and while it can inflict thorns
        and introduce
        <em><strong>@UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.TFE7qnkVkpzsZYW6#tangles]{tangles}</strong></em>,
        it shouldn't be debilitating. What is your strange afflictions and how
        did you get it? Choose 1 or make up your own.</p><section class="grid
        grid-2col"><div><ul><li><p>plagued by your own
        shadow</p></li><li><p>empty eye sockets</p></li><li><p>skeletal body
        wasting away</p></li></ul></div><div><ul><li><p>special diet, such as
        only raw meat</p></li><li><p>haunted by ancestral
        ghosts</p></li><li><p>putrid smell that follows
        everywhere</p></li></ul></div></section><h3>The Language</h3><p>The
        language of the universe is more than words as we know them. Feelings,
        thoughts, and reagents also form the syllables. Use the crucible below
        or come up with your own Words of Power to fit your
        witch.</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.XFyrzeUiVLnx5HXl]{Words
        of Power
        1}</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.9ca1CSFhu1lnI90l]{Words
        of Power 2}</p><h3>Herbalism Crucible
        (Talent)</h3><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.LMqVbQeOR1DX4DOV]{Herbalism
        1}</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.NxZo4hUXhM805JXa]{Herbalism
        2}</p><h3>Homely Hovel (Talent)</h3><section class="grid
        grid-2col"><div><p>@Embed[Compendium.grimwild.gwce-crucibles.RollTable.1P7yTl7gvHd4FuxU]{Homely
        Hovel
        1}</p></div><div><p>@Embed[Compendium.grimwild.gwce-crucibles.RollTable.4NH5kbPPG8S1XdSB]{Homely
        Hovel 2}</p></div></section>
