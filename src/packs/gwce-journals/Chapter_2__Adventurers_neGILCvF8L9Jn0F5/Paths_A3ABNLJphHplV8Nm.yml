        Senses}
        @UUID[Compendium.grimwild.gwce-talents.Item.Ypgkormq3NcAP2Bj]{Relentless}
        @UUID[Compendium.grimwild.gwce-talents.Item.0JCUaIDEs2Uczfsc]{Scout
        Ahead}
        @UUID[Compendium.grimwild.gwce-talents.Item.WGe6Gc0edCDfDUMh]{Seasoned
        Hunter}
        @UUID[Compendium.grimwild.gwce-talents.Item.VymBB234e1ENytX9]{Sharpshooter}
        @UUID[Compendium.grimwild.gwce-talents.Item.LQzxjCORyw80FPhb]{Trophies}</p><h3>Favorite
        Traps (Optional)</h3><section class="grid grid-2col"><div><p>Combine and
        interpret an effect, trigger, and the word "trap" (poisonous bait trap)
        to make three traps you commonly use while hunting or scouting. These
        aren't limitations, just options ready to use when you need to lay a
        trap.</p></div><div><table><thead><tr><th><p><strong>Effect</strong></p></th><th><p><strong>Trigger</strong></p></th></tr></thead><tbody><tr><td><p>stunning</p></td><td><p>tripwire</p></td></tr><tr><td><p>falling</p></td><td><p>pressure
        plate</p></td></tr><tr><td><p>noisy</p></td><td><p>snare
        loop</p></td></tr><tr><td><p>poisonous</p></td><td><p>bait</p></td></tr><tr><td><p>entangling</p></td><td><p>hidden</p></td></tr><tr><td><p>injuring</p></td><td><p>proximity</p></td></tr></tbody></table></div></section><h3>Tell-Tale
        Signs of Weakness (Advice)</h3><p>When you tag a powerful quarry, use
        your resources to find a weakness, figure out how you can exploit it.
        These are some vulnerabilities you may
        discover:</p><ul><li><p><strong>Fire Sensitivity:</strong> Flinches near
        flames, avoids heat, dry or cracked skin.</p></li><li><p><strong>Bright
        Light Weakness:</strong> Cloudy eyes, avoids light, panics near
        flashes.</p></li><li><p><strong>Vulnerable Anatomy:</strong> Exposed
        weak points, protects soft areas.</p></li><li><p><strong>Poison
        Susceptibility:</strong> Sluggish breathing, avoids carrion, soft or
        delicate skin.</p></li><li><p><strong>Tunnel Vision:</strong> Fixates on
        a target, oblivious to surroundings, struggles to
        adapt.</p></li><li><p><strong>Poor Mobility:</strong> Heavy tracks, slow
        movement, struggles on uneven terrain.</p></li><li><p><strong>Sound
        Sensitivity:</strong> Wince at noises, large twitching ears, avoids loud
        terrain.</p></li><li><p><strong>Slow-minded:</strong> Delayed reactions,
        struggles to recognize threats, easily
        tricked.</p></li><li><p><strong>Predictable Instincts:</strong> Easily
        baited or lured, overcommits.</p></li></ul>
