  - sort: 400000
    name: Paladin
    type: text
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><em><strong>AKA the crusader, champion, justiciar</strong></em></p>

        <p><em>You have sworn an oath and your unwavering dedication gives you
        powerful conviction, which you can wield to shape the world.</em></p>

        <p><strong>Core Talent:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.z6wB7nzSVQSwekJt]{Oathsworn}</p>

        <p><strong>Path Talents:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.dDgkXX8g7hHB7sjS]{Aegis}
        @UUID[Compendium.grimwild.gwce-talents.Item.lBvXtI0SkNrWe5x4]{Authority}
        @UUID[Compendium.grimwild.gwce-talents.Item.IcgJpnW7rJyk6ZrO]{Challenge}
        @UUID[Compendium.grimwild.gwce-talents.Item.DfwNdvUbWevmDZHN]{Dauntless}
        @UUID[Compendium.grimwild.gwce-talents.Item.vrqgtMc5cPttKALb]{Divine
        Blessing}
        @UUID[Compendium.grimwild.gwce-talents.Item.V5CEe1pUbWY0gtpo]{Guardian}
        @UUID[Compendium.grimwild.gwce-talents.Item.hqBMteTL2sSWTQK0]{Rebuke}</p>

        <h3>Swear Your Oath</h3>

        <p>At character creation, or over the first few sessions, detail the
        <strong>Three Tenets</strong> that form the core of your oath. Write
        your own specific tenets, or use the table to create ones that you can
        explore through play. To write your own:</p>

        <ul>
            <li>
                <p><strong>Choose a character detail or two</strong>, such as a trait, bond, or background.</p>
            </li>
            <li>
                <p><strong>Link it to a short, actionable phrase.</strong> It should naturally arise from the fiction occasionally and present you with dilemmas. Work with the GM to ensure this as you write it.</p>
            </li>
        </ul>

        <p><strong>Rank the tenets</strong> in order of importance. If they ever
        conflict, following a higher one avoids violating a lower one. You must
        <strong>uphold your tenets, or risk violation</strong>. They are
        absolutes, but they can evolve as it makes sense or best serves the
        fiction (and game at the table). When you violate a tenet, slash its
        box. For a second or severe violation, fill in the box—it is in heavy
        violation.</p>

        <p><strong>You break a tenet</strong> when you violate it again while in
        heavy violation (filled box). You can no longer atone for that tenet.
        Breaking two tenets makes you an Oathbreaker (below).
        <strong>Atonement</strong> for tenets in violation require great deeds.
        The deed must outweigh the severity of the violation itself—ask the
        other players if unsure. Once completed, clear the box.</p>

        <h3>Oathbreaker</h3>

        <p>You lose the Oathsworn talent, but may choose a new non-core talent
        or the Warlock's Pact core talent in its place. Redemption requires an
        appropriate ritual or mythic deed. Success restores your core talent
        while allowing you to keep the talent gained from breaking your oath.
        <strong>Redemption is possible only once.</strong></p>

        <h3>Tenet Builder</h3>

        <p>Roll, then choose an option; rewrite for clarity.</p>

