  - sort: 300000
    name: Berserker
    type: text
    _id: EcK2fQRpY99iVSVh
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><em><strong>AKA the juggernaut, reaver,
        warbringer</strong></em></p><p><em>You don't just fight—you crush
        anything and everything in your path until nothing stands before
        you.</em></p><p><strong>Core Talent:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.pszYVqld3kjDK1Ss]{Frenzy}</p><p><strong>Path
        Talents:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.uFxLO7FQYOZimL8p]{Fearsome}
        @UUID[Compendium.grimwild.gwce-talents.Item.ItW2enbPG8FqlBGF]{Flesh
        Wounds}
        @UUID[Compendium.grimwild.gwce-talents.Item.r3IxHh2oH5lLjZ4u]{Into
        the Fray}
        @UUID[Compendium.grimwild.gwce-talents.Item.d6pVv5KNlfuLyXyx]{Joyful
        Warrior}
        @UUID[Compendium.grimwild.gwce-talents.Item.vEXySY8fJJXEYgHO]{Mighty}
        @UUID[Compendium.grimwild.gwce-talents.Item.YUpxc7gTPNLxWf9Y]{Overkill}
        @UUID[Compendium.grimwild.gwce-talents.Item.zRFGcTYw8eUUqnVG]{Warcry}</p><h3>Frenzy
        Source (Optional)</h3><p>Where does your wild power and ability to
        withstand pain come from? Choose 2 and smash them together to form the
        source, and 1 that you have a disdain for.</p><section class="grid
        grid-2col"><div><ul><li><p><em>Ritualistic
        preparation</em></p></li><li><p><em>Trained tolerance to
        pain</em></p></li><li><p><em>Long consumption of strange
        substances</em></p></li><li><p><em>Drawing power from ancestral
        spirits</em></p></li><li><p><em>Drawing primal power from the
        wild</em></p></li><li><p><em>Channeling memories you'll never
        forget</em></p></li></ul></div><div><ul><li><p><em>Visions of horrific
        or heroic scenes</em></p></li><li><p><em>Deep meditative
        focus</em></p></li><li><p><em>Blood pact with a kindred
        force</em></p></li><li><p><em>Your abilities are a strange
        mystery</em></p></li><li><p><em>Binding your spirit to a physical
        totem</em></p></li><li><p><em>A suppressed entity overtakes
        you</em></p></li></ul></div></section><h3>Scars (Optional)</h3><p>Your
        ability to ignore pain has led you to take far more damage than most
        warriors. What scars do you bear that show your reckless nature? Choose
        3 that you show off.</p><section class="grid
        grid-3col"><div><ul><li><p>Crookedly broken nose</p></li><li><p>Web of
        deep cut scars</p></li><li><p>Permanently split
        knuckles</p></li><li><p>Empty eye socket</p></li><li><p>Smashed
        teeth</p></li><li><p>Cauliflower
        ears</p></li></ul></div><div><ul><li><p>Wild, ripped
        hair</p></li><li><p>Muscles knotted like iron</p></li><li><p>Several
        missing fingers</p></li><li><p>Jagged burn lines</p></li><li><p>Gouged
        claw marks</p></li><li><p>Runic scarring from
        magic</p></li></ul></div><div><ul><li><p>Torn earlobe or ear
        tips</p></li><li><p>Deep, cauterized wound</p></li><li><p>Cracked
        jawline</p></li><li><p>Crushed foot</p></li><li><p>Busted in
        skull</p></li><li><p>Not even a scratch on
        you</p></li></ul></div></section>
