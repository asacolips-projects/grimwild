  - sort: 400000
    name: Warlock
    type: text
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><em><strong>AKA the magus, occultist,
        pactmaker</strong></em></p><p><em>You have made a pact with a greater
        being—power in exchange for service, a pact that may prove to be a
        double-edged sword.</em></p><p><strong>Core Talent:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.jKDyHI3WnywJfUbC]{Pact}</p><p><strong>Path
        Talents:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.q8TSRpH8hSF1Ysaz]{Affliction}
        @UUID[Compendium.grimwild.gwce-talents.Item.RGJvam4MsS6dw3g6]{Blood
        Rituals}
        @UUID[Compendium.grimwild.gwce-talents.Item.JUtk9dfbboSXP8X1]{Knowing
        Gaze}
        @UUID[Compendium.grimwild.gwce-talents.Item.p6TDJjWqDn55svJ9]{Magus}
        @UUID[Compendium.grimwild.gwce-talents.Item.UWU14yRUO3OR9mSp]{Otherworldly
        Form}
        @UUID[Compendium.grimwild.gwce-talents.Item.Elb1EbHBFgw5QtHg]{Visions}
        @UUID[Compendium.grimwild.gwce-talents.Item.MCqr0mlpL8BNE8bA]{Wayfarer}</p><h3>Eldritch
        Magic</h3><p>You channel your patron's power; your magic and gifted
        <strong>Eldritch Talents</strong> (and their options) must align with
        their nature. The trappings on both act as set dressing. Remember, your
        3d story roll may be lowered if you fail your
        expectations...</p><h3>Patron Creation</h3><p>Roll or choose 2 natures
        and 2 desires below, then assign a distinct color or visual signature to
        your patron's influence that act as their trappings. Decide how they
        communicate (telepathy, signs, projection), and how many followers
        (many, few, one) they have. Give this powerful, otherworldly being a
        name, describe what you know of them, and establish the bond between
        you.</p><p>Patron Crucible - Roll 2 on each table, smash them together,
        and
        interpret.</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.haDvaSgyOj1k5Sxx]{Patron
        Nature}</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.wVdhje3Zv4N481UV]{Patron
        Desire}</p><h3>"Clear Up the Issue"</h3><p>The patience pool dropping to
        0d should be bad—don’t be afraid to hit the Warlock hard with
        interesting consequences from their patron. Consider bestowing
        conditions, changing their appearance, or even straining the warlock’s
        bonds with others. If the PC is on their good side, maybe the patron
        gives them more responsibility, or a thoughtful but misguided gift. Many
        patrons are antagonistic, but that doesn’t describe all of them. Just
        ensure the trouble that comes from the patron matches their nature.</p>
