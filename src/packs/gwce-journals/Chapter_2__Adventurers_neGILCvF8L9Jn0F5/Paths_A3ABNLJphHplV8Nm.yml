    text:
      format: 1
      content: >-
        <p><em><strong>AKA the shapeshifter, grovekeeper,
        wildling</strong></em></p>

        <p><em>You embrace and embody the untamed power of the natural world,
        transforming into beasts and channeling the spirit of the wild.</em></p>

        <p><strong>Core Talent:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.jU8A1SzjYJbuM9K4]{Wild
        Shape}</p>

        <p><strong>Path Talents:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.N2makdlW2zmGbMyB]{Augury}
        @UUID[Compendium.grimwild.gwce-talents.Item.Tir0nloS68H8M7wI]{Awaken}
        @UUID[Compendium.grimwild.gwce-talents.Item.cdf2AcTgQenZPIE7]{Kindred
        Spirits}
        @UUID[Compendium.grimwild.gwce-talents.Item.LxRcD556CHYdhVGU]{Primal
        Growth}
        @UUID[Compendium.grimwild.gwce-talents.Item.GKlmqAT2ey3WtA4N]{Primordial
        Bonds}
        @UUID[Compendium.grimwild.gwce-talents.Item.rwXMt9aoBLseSwEf]{True
        Shape}
        @UUID[Compendium.grimwild.gwce-talents.Item.iRLs3DR7cSMG0zLt]{Windcaller}</p>

        <h3>Druidic Tells (Optional)</h3>

        <p>Druids often exhibit tells—sometimes several—that reflect their deep
        connection with nature, such as animalistic traits or plant-like
        appearances. Even in a fantasy world, someone so attuned to nature is
        bound to attract attention, offering potential new vantage, outside
        assistance, or even opportunities for tangles. Below are some ideas for
        features:</p>

        <section class="grid grid-3col">
            <div>
                <ul>
                    <li>
                        <p>thorns</p>
                    </li>
                    <li>
                        <p>moss</p>
                    </li>
                    <li>
                        <p>vines</p>
                    </li>
                    <li>
                        <p>tusked</p>
                    </li>
                    <li>
                        <p>shimmering</p>
                    </li>
                    <li>
                        <p>scaly</p>
                    </li>
                    <li>
                        <p>blossoming</p>
                    </li>
                    <li>
                        <p>bark</p>
                    </li>
                    <li>
                        <p>glowing</p>
                    </li>
                    <li>
                        <p>velvet</p>
                    </li>
                    <li>
                        <p>antlered</p>
                    </li>
                    <li>
                        <p>longtoothed</p>
                    </li>
                </ul>
            </div>
            <div>
                <ul>
                    <li>
                        <p>feathered</p>
                    </li>
                    <li>
                        <p>earthen</p>
                    </li>
                    <li>
                        <p>translucent</p>
