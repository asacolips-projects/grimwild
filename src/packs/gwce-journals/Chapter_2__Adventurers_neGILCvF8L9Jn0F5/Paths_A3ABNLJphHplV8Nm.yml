      content: >-
        <p><em><strong>AKA the orator, warlord, chronicler</strong></em></p>

        <p><em>You spin tales and songs that stir emotions, inspire bravery, and
        turn simple deeds into legends.</em></p>

        <p><strong>Core Talent:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.PVAjOF4hYgnPdynr]{Inspiration}</p>

        <p><strong>Path Talents:</strong>
