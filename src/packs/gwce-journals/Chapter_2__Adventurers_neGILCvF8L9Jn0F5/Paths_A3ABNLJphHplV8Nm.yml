  - sort: 400000
    name: Swashbuckler
    type: text
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><em><strong>AKA the fencer, duelist,
        buccaneer</strong></em></p><p><em>You fight with swagger, skill, and a
        smile, turning every desperate clash into a daring performance with luck
        ever by your side.</em></p><p><strong>Core Talent:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.uPQrfhqRE34zc6Nx]{Panache}</p><p><strong>Path
        Talents:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.5CtoO6BPNuprfhXe]{Audacity}
        @UUID[Compendium.grimwild.gwce-talents.Item.Pt6fw8kmgDex18Sl]{Fancy
        Footwork}
        @UUID[Compendium.grimwild.gwce-talents.Item.EmH6mbsUqW4jTt5m]{Improvise}
        @UUID[Compendium.grimwild.gwce-talents.Item.nUhSa5uGMYwFBDbn]{Lucky}
        @UUID[Compendium.grimwild.gwce-talents.Item.qTCXUKqObQF3HNm1]{Natural
        Moxie}
        @UUID[Compendium.grimwild.gwce-talents.Item.FgPZtq8dXJ19JBtt]{Provoke}
        @UUID[Compendium.grimwild.gwce-talents.Item.YgCyDiHMURqcd88R]{The
        Legend Of...}</p><h3>Past Entanglements (Optional)</h3><p>A Swashbuckler
        is known by their past. Whose life is intertwined with the story of your
        deeds? Choose 2 people important in your tales by picking a descriptor
        and a focus and smashing them together, then one more vital to your
        story that you don't know yet.</p><section class="grid
        grid-2col"><div><table><thead><tr><th colspan="2"
        style="text-align:center"><p>@UUID[Compendium.grimwild.gwce-crucibles.RollTable.qRyyv1TN8s9ZnL1U]{Descriptor}</p></th></tr></thead><tbody><tr><td><p><em>spurned</em></p></td><td><p><em>lifelong</em></p></td></tr><tr><td><p><em>obsessed</em></p></td><td><p><em>bitter</em></p></td></tr><tr><td><p><em>vengeful</em></p></td><td><p><em>adoring</em></p></td></tr><tr><td><p><em>treacherous</em></p></td><td><p><em>innocent</em></p></td></tr><tr><td><p><em>jealous</em></p></td><td><p><em>ambitious</em></p></td></tr><tr><td><p><em>mysterious</em></p></td><td><p><em>secret</em></p></td></tr></tbody></table></div><div><table><thead><tr><th
        colspan="2"
        style="text-align:center"><p>@UUID[Compendium.grimwild.gwce-crucibles.RollTable.O1jFcWlid1zK7RWw]{Focus}</p></th></tr></thead><tbody><tr><td><p><em>patron</em></p></td><td><p><em>partner</em></p></td></tr><tr><td><p><em>investigator</em></p></td><td><p><em>rival</em></p></td></tr><tr><td><p><em>paramour</em></p></td><td><p><em>fan</em></p></td></tr><tr><td><p><em>mentor</em></p></td><td><p><em>friend</em></p></td></tr><tr><td><p><em>faction</em></p></td><td><p><em>muse</em></p></td></tr><tr><td><p><em>relative</em></p></td><td><p><em>protégé</em></p></td></tr></tbody></table></div></section><h3>Creed
        (Optional)</h3><p>Many thrilling duelists have a code, a rule they never
        break, a line they will never cross, or a proverb they live their life
        by. How devoted to it are you? Choose up to 2 below, or create your
        own.</p><section class="grid grid-2col"><div><ul><li><p><em>all's fair
        in love and war</em></p></li><li><p><em>wield the sword of
        justice</em></p></li><li><p><em>accept every
        challenge</em></p></li><li><p><em>coin is meant to be
        spent</em></p></li><li><p><em>infamous is still
        famous</em></p></li><li><p><em>gentleman even in dire
        times</em></p></li></ul></div><div><ul><li><p><em>honor is only for the
        dead</em></p></li><li><p><em>a good story beats any
        reward</em></p></li><li><p><em>never kill the
        helpless</em></p></li><li><p><em>death before
        dishonor</em></p></li><li><p><em>the best plan is no plan at
        all</em></p></li><li><p><em>only a fair fight measures
        skill</em></p></li></ul></div></section><h3>The Legend Of…
        (Talent)</h3><p>Many recognize you as a hero, others as a cad and
        ne'er-do-well. Track tales of your exploits with campaign pools.
        <em><strong>Take spark</strong></em> when you play into it by: leaving a
        calling card—saying your catchphrase in a dramatic moment—indulging a
        fan. Use the crucible below to discover what people have taken to
        calling you. Pick one from the left, and one from the right, and smash
        together.
        @UUID[Compendium.grimwild.gwce-crucibles.RollTable.VLBKjCb9UNgnnKdu]{Or
        roll for it.}</p><section class="grid
        grid-2col"><div><table><thead><tr><th><p><strong>Playful</strong></p></th><th><p><strong>Witty</strong></p></th><th><p><strong>Mysterious</strong></p></th></tr></thead><tbody><tr><td><p>smiling</p></td><td><p>gallant</p></td><td><p>steel</p></td></tr><tr><td><p>red</p></td><td><p>artful</p></td><td><p>crimson</p></td></tr><tr><td><p>infallible</p></td><td><p>sly</p></td><td><p>gray</p></td></tr><tr><td><p>dashing</p></td><td><p>silver</p></td><td><p>silent</p></td></tr><tr><td><p>fantastic</p></td><td><p>azure</p></td><td><p>midnight</p></td></tr><tr><td><p>wondrous</p></td><td><p>gilded</p></td><td><p>masked</p></td></tr></tbody></table></div><div><table><thead><tr><th><p><strong>Abstract</strong></p></th><th><p><strong>Animal</strong></p></th><th><p><strong>Trade</strong></p></th></tr></thead><tbody><tr><td><p>phantom</p></td><td><p>robin</p></td><td><p>baron</p></td></tr><tr><td><p>marvel</p></td><td><p>hawk</p></td><td><p>wanderer</p></td></tr><tr><td><p>one</p></td><td><p>butterfly</p></td><td><p>knight</p></td></tr><tr><td><p>justice</p></td><td><p>fox</p></td><td><p>rake</p></td></tr><tr><td><p>enigma</p></td><td><p>phoenix</p></td><td><p>thief</p></td></tr><tr><td><p>mirage</p></td><td><p>viper</p></td><td><p>avenger</p></td></tr></tbody></table><p></p></div></section>
