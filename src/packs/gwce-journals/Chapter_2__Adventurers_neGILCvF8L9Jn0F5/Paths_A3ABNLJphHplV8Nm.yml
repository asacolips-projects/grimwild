  - sort: 400000
    name: Sorcerer
    type: text
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><em><strong>AKA the channeler, elementalist,
        stormcaller</strong></em></p><p><em>Your body is a vessel through which
        you channel your discipline into grace, precision, and the never-ending
        journey towards perfection.</em></p><p><strong>Core Talent:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.deKJoRmsSYYzDZov]{Sorcery}</p><p><strong>Path
        Talents:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.ydN38Yf16h2Dk6J6]{Eldritch
        Growth}
        @UUID[Compendium.grimwild.gwce-talents.Item.CtUzkY0Fha1u5y6L]{Maelstrom}
        @UUID[Compendium.grimwild.gwce-talents.Item.jLvUnh0MVbJqsVHT]{Magic
        Sense}
        @UUID[Compendium.grimwild.gwce-talents.Item.4gpqV19Ureaw58XH]{Metamagic}
        @UUID[Compendium.grimwild.gwce-talents.Item.vHXVDzzIFhteYiwW]{Spelleater}
        @UUID[Compendium.grimwild.gwce-talents.Item.YOle8jtGCKeJXVPk]{Wisps}
        @UUID[Compendium.grimwild.gwce-talents.Item.ZT56ussIBulbf851]{Wrath}</p><h3>Wild
        Surge (Optional)</h3><p>As your chosen magical twist, or when the GM
        <em><strong>Complicates Things</strong></em> with your magic, you may
        trigger a wild surge—raw magic spirals out of your control. Make a story
        roll (usually 2d) to see what happens. Effects should complicate the
        scene, but usually don't reach the level of a full impact move. They
        might stem from your touchstones, raw magical essence, or something
        random. Use the crucible below or ask around your group for
        ideas.</p><p><strong>Wild Surge Crucible</strong> - Roll 1 on each
        table, smash them together, and
        interpret</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.HbllbjkfqIMbw6Q3]{Wild
        Surge
        1}</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.Vln9i9pNYecfYoBG]{Wild
        Surge 2}</p><h3>Other Magical Twists</h3><p>These can be anything,
        acting similarly to a lesser impact move when triggered. Tie it to your
        character's story, if possible. Use a timer to build up to a bigger
        consequence, such as being hunted down, or succumbing to a curse or
        deadly fate.</p>
