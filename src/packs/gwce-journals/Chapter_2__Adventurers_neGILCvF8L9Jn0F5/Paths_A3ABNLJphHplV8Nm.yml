  - sort: 400000
    name: Wizard
    type: text
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><em><strong>AKA the diviner, evoker,
        abjurer</strong></em></p><p><em>You wield arcane power through precise
        knowledge, casting spells from an ever-expanding repertoire, your
        studies endless.</em></p><p><strong>Core Talent:
        </strong>@UUID[Compendium.grimwild.gwce-talents.Item.nJs6GfiABSqweW9M]{Spellcraft}</p><p><strong>Path
        Talents:
        </strong>@UUID[Compendium.grimwild.gwce-talents.Item.yOfQWHy3L75BDBoO]{Alchemist}
        @UUID[Compendium.grimwild.gwce-talents.Item.7gwtb2qhZG4zAdvW]{Archivist}
        @UUID[Compendium.grimwild.gwce-talents.Item.a8vcDNq62VhOah8R]{Colleagues}
        @UUID[Compendium.grimwild.gwce-talents.Item.qp4J2gxLHEUIvLdl]{Component
        Pouch}
        @UUID[Compendium.grimwild.gwce-talents.Item.lpgK9WrEsK0mEVbI]{Countermagic}
        @UUID[Compendium.grimwild.gwce-talents.Item.nD7l3bdr58O67fHZ]{Mastered
        Theorem}
        @UUID[Compendium.grimwild.gwce-talents.Item.hoPp5GF9ImIgTVSD]{Specialty
        School}</p><h3>Schools of
        Magic</h3><ul><li><p><strong>Abjuration</strong>: Protects, blocks,
        dispels, or banishes.</p></li><li><p><strong>Conjuration</strong>:
        Summons creatures, objects, and
        portals.</p></li><li><p><strong>Divination</strong>: Reveals
        information, predicts the future, and reads
        minds.</p></li><li><p><strong>Enchantment</strong>: Charms, influences,
        and curses sentient
        creatures.</p></li><li><p><strong>Evocation</strong>: Creates and
        controls elemental and magical
        forces.</p></li><li><p><strong>Illusion</strong>: Generates false images
        and sensory deceptions.</p></li><li><p><strong>Necromancy</strong>:
        Manipulates life, death, and the
        undead.</p></li><li><p><strong>Transmutation</strong>: Transforms matter
        and alters physical properties.</p></li></ul><h3>Creating Spell
        Theorems</h3><p>Use the spell crucible to randomly determine a
        <strong>style</strong>, <strong>essence</strong>, and
        <strong>form</strong>, by rolling 2d on each section. Assign 1d to the
        column and 1d to the row (or reverse the two) to find two touchstone
        words, then choose your favorite. Pick two out of these three
        (<strong>style+essence</strong>, <strong>style+form</strong>,
        <strong>essence+form</strong>) for the spell name, or
        <strong>theorem</strong>.</p><p><strong>Example Roll:</strong> <em>wild
        + fire + sentinel</em>. This gives us a some interesting
        options:</p><p><em>wild fire (evocation)</em> → This could blast the
        area with uncontrollable fire.</p><p><em>fire sentinel
        (transmutation)</em> → This could turn your form to fire.</p><p><em>wild
        sentinel (conjuration)</em> → This could summon a bear to fight along
        side you.</p><h3>Spell Crucible</h3><p>Roll 1 of each, choose 2, then
        add a
        school</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.mOADEYLlXeMBT3y7]{Spell
        Crucible -
        Style}</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.CzpyvhNPaQYzi9kA]{Spell
        Crucible -
        Essence}</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.OeG8xSHvJZae6DmD]{Spell
        Crucible - Form}</p><p></p>
