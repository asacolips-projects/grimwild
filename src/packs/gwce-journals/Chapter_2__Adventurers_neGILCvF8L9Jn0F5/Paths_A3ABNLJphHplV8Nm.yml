  - sort: 400000
    name: Psion
    type: text
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><em><strong>AKA the mentalist, seer,
        telepath</strong></em></p><p><em>You unlock the limitless power of the
        mind, bending thought, will, and reality through focus and
        discipline.</em></p><p><strong>Core Talent:
        </strong>@UUID[Compendium.grimwild.gwce-talents.Item.yuzIjJLLRSTzscGj]{Awakened
        Mind}</p><p><strong>Path Talents:
        </strong>@UUID[Compendium.grimwild.gwce-talents.Item.ROcAcekaPQH1c7tv]{Echo}
        @UUID[Compendium.grimwild.gwce-talents.Item.Rn2TX6zWBB1ZIXIS]{Foresight}
        @UUID[Compendium.grimwild.gwce-talents.Item.4da7uLgoUPPtrDsy]{Mind
        Blast}
        @UUID[Compendium.grimwild.gwce-talents.Item.spgHKyBkuBLUBgrw]{Psychic
        Warrior}
        @UUID[Compendium.grimwild.gwce-talents.Item.aX0XZwjeM1WoJ2RT]{Reader}
        @UUID[Compendium.grimwild.gwce-talents.Item.MZGjMzYMZZ8Z3wlU]{Shift
        Form}
        @UUID[Compendium.grimwild.gwce-talents.Item.oHyCyqw3VkJGaq9E]{Tumultuous
        Mind}</p><h3>Instability</h3><section class="grid grid-3col"><div
        class="grid-span-2"><p>Each potent spell pulls at the threads in your
        mind, making your magic harder to control. You add thorns to all psionic
        spellcasting based on your instability, tracked by looking at the thorns
        on the lowest line you have marked. Consider what this progressive
        unraveling of your psyche looks like.</p></div><div><img
        src="modules/grimwild/assets/img/psion-instability.svg"></div></section><h3>Bastions</h3><p>Within
        your mind lie bastions of psionic power. As you grow stronger, you break
        down their walls, unlocking your true potential. These powers take shape
        as visions, psychic phenomena, and even physical manifestations in the
        form of <strong>ectoplasm</strong>—<em>pure essence of
        creation</em>.</p><ul><li><p><strong>BIODYNAMICS </strong>• Altering and
        enhancing your own body.</p><ul><li><p><strong>Power:</strong> <em>Heal
        your broken arm,. Hold your breath for hours. Run faster than a
        horse.</em></p></li></ul></li><li><p><strong>CLAIRSENTIENCE</strong> •
        Gaining knowledge from the collective
        unconscious.</p><ul><li><p><strong>Power:</strong> <em>Sense a hidden
        truth. See into someone's dreams. Find the way
        home.</em></p></li></ul></li><li><p><strong>METACREATION</strong> •
        Creating objects from ectoplasm, pure mental
        energy.</p><ul><li><p><strong>Power:</strong> <em>Forge a glowing sword.
        Build a bridge of thought. Shape armor from pure
        will.</em></p></li></ul></li><li><p><strong>PSYCHOKINESIS</strong> •
        Manipulating energy and force.</p><ul><li><p><strong>Power:</strong>
        <em>Shatter a boulder. Push an enemy back. Lift a heavy object with your
        mind.</em></p></li></ul></li><li><p><strong>TELEPATHY</strong> •
        Mind-to-mind communication, manipulation, and
        control.</p><ul><li><p><strong>Power:</strong> <em>Read someone's
        thoughts. Calm an angry mob. Implant a fleeting
        suggestion.</em></p></li></ul></li><li><p><strong>TRANSPOSITION</strong>
        • Movement and manipulation of
        space.</p><ul><li><p><strong>Power:</strong> <em>Teleport across a room.
        Switch places with an ally. Freeze someone in
        place.</em></p></li></ul></li></ul>
