  - sort: 100000
    name: Artificer
    type: text
    _id: 3Gn22HIAtsedLnmL
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><em><strong>AKA the enchanter, tinkerer,
        inventor</strong></em></p><p><em>You shape the world with your
        creations, blending ingenuity, craftsmanship, and magic to forge and
        enchant wonders.</em></p><p><strong>Core Talent:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.nSk6qwqAJI6faSuK]{Infusion}</p><p><strong>Path
        Talents:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.El1lO8dY68n1saGD]{Animate
        Objects}
        @UUID[Compendium.grimwild.gwce-talents.Item.J6nKSwuTl4CiPNZs]{Artificial
        Parts}
        @UUID[Compendium.grimwild.gwce-talents.Item.doJNSEVI2732Yk82]{Grenades}
        @UUID[Compendium.grimwild.gwce-talents.Item.ZtFXtPoXey76Oi93]{Magnum
        Opus}
        @UUID[Compendium.grimwild.gwce-talents.Item.Ch2EZO6UoTY7eos9]{Mischief
        Maker}
        @UUID[Compendium.grimwild.gwce-talents.Item.kflJQHmJnQeq3Ppv]{Trap
        Making}
        @UUID[Compendium.grimwild.gwce-talents.Item.IJthEn7faGGn2Pe8]{Wandslinger}</p><h3>Everything
        Arcana (Optional)</h3><p>You can reflavor any of your path talents to
        actually be the effects of magical gizmos you’ve created. Toss in some
        magitech buzzwords that almost make sense, and use them to sound like
        you know what you’re talking about—perfect for baffling the less
        inventive. You can teach others to use them, though doing so always
        carries <em><strong>risk</strong></em>. If any of these gizmos is ever
        lost, you can recreate them with some effort during any
        downtime.</p><h3>Magitechnobabble</h3><p><em>(smash together, and ramble
        on)</em></p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.qmajHiC1ZCuETGn3]</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.8knCqotKXeVrR8z8]</p><h3>Constructs
        and Homunculi</h3><p>Looking for a magical companion you found or
        created? Use the
        @UUID[Compendium.grimwild.gwce-talents.Item.yVMzP2yTj7Jyvdfk]{Animal
        Companion} talent from the ranger path, and pick from the tricks and
        flaws below.</p><p><strong>TRICKS:</strong>
        <em>distract—fight—guard—rescue—rideable—scout—search—talk—trace—signal</em></p><p><strong>FLAWS:</strong>
        <em>clumsy—defiant—dimwitted—noisy—overprotective—powered—scary—unreliable</em></p>
