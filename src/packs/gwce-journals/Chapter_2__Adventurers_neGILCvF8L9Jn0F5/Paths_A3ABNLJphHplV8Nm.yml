  - sort: 400000
    name: Summoner
    type: text
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><em><strong>AKA the caller, binder,
        planeswalker</strong></em></p><p><em>You can create creatures from the
        essence of other planes to protect yourself and bring ruin to your
        enemies.</em></p><p><strong>Core Talent:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.E80P3ozUwQWRC5ap]{Vassal}</p><p><strong>Path
        Talents:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.zUu3Y4Sp5I6riC1X]{Binding
        Word}
        @UUID[Compendium.grimwild.gwce-talents.Item.pYpgHdngQNQe32ly]{Fierce
        Protector}
        @UUID[Compendium.grimwild.gwce-talents.Item.kK4LN7Svp3tNPRih]{Ley
        magic}
        @UUID[Compendium.grimwild.gwce-talents.Item.s92DmqVh9SwLCwZy]{Monster
        Menagerie}
        @UUID[Compendium.grimwild.gwce-talents.Item.5Xe9pFQ9dvZYBvfn]{Pocket
        Plane}
        @UUID[Compendium.grimwild.gwce-talents.Item.eit50hKGYL98qHV1]{Portal
        Network}
        @UUID[Compendium.grimwild.gwce-talents.Item.sCv0nEBChFrYl2KT]{Shared
        Soul}</p><h3>Aspects (Examples)</h3><p>Below are some examples of planar
        creatures and their aspects. Existing talents are listed with a page
        number reference. Others are made for that beast. If the idea of your
        summoned eidolon has more aspects than those available, ask your GM
        about "donating" the PC's own, adding them to the vassal
        instead.</p><section class="grid
        grid-2col"><div><ul><li><p><strong>Dragon:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.ydN38Yf16h2Dk6J6]{Eldritch
        Growth}</p></li><li><p><strong>Ghost:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.UWU14yRUO3OR9mSp]{Otherworldly
        Form}</p></li><li><p><strong>Demon:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.JUtk9dfbboSXP8X1]{Knowing
        Gaze}</p></li><li><p><strong>Pixie:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.k05clNwHNfu182P4]{Arcane
        Training}</p></li><li><p><strong>Air Elemental:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.iRLs3DR7cSMG0zLt]{Windcaller}</p></li><li><p><strong>Oozeling:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.MZGjMzYMZZ8Z3wlU]{Shift
        Form }</p></li></ul></div><div><ul><li><p><strong>Unicorn:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.ZxbjdllKwGXPAcuV]{Healing
        Hands}</p></li><li><p><strong>Shadow:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.2uxcSShENkGU3g6l]{Lurker}</p></li><li><p><strong>Zombie
        Swarm:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.HyxdTMa3rkCyf4nM]{Bulwark}</p></li><li><p><strong>Warrior
        Spirit:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.V5CEe1pUbWY0gtpo]{Guardian}</p></li><li><p><strong>Treant:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.LxRcD556CHYdhVGU]{Primal
        Growth}</p></li><li><p><strong>Tentacles:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.uFxLO7FQYOZimL8p]{Fearsome}</p></li></ul></div></section><h3>Build-a-Vassal
        (Optional)</h3><p>Your summons are from a different plane—a different
        reality, and their form shifts and shapes to conform to the material
        plane. Use the crucible below to discover the basic form of your
        vassal.</p><section class="grid grid-3col"><div><table><thead><tr><th
        colspan="2"
        style="text-align:center"><p>@UUID[Compendium.grimwild.gwce-crucibles.RollTable.dw51NQ4yN1V6B4jw]{It's
        a
        ____}</p></th></tr></thead><tbody><tr><td><p>squat</p></td><td><p>tall</p></td></tr><tr><td><p>gangly</p></td><td><p>angular</p></td></tr><tr><td><p>robust</p></td><td><p>bulky</p></td></tr><tr><td><p>lithe</p></td><td><p>rounded</p></td></tr><tr><td><p>sleek</p></td><td><p>hunched</p></td></tr><tr><td><p>imposing</p></td><td><p>gaunt</p></td></tr></tbody></table></div><div><table><thead><tr><th
        colspan="2"
        style="text-align:center"><p>@UUID[Compendium.grimwild.gwce-crucibles.RollTable.rlRXOjtEZpSzLO6K]{____-like
        creature that I
        send}</p></th></tr></thead><tbody><tr><td><p>frog</p></td><td><p>chicken</p></td></tr><tr><td><p>bull</p></td><td><p>snake</p></td></tr><tr><td><p>turtle</p></td><td><p>insect</p></td></tr><tr><td><p>squid</p></td><td><p>jellyfish</p></td></tr><tr><td><p>cat</p></td><td><p>ape</p></td></tr><tr><td><p>spider</p></td><td><p>blob</p></td></tr></tbody></table></div><div><table><thead><tr><th
        colspan="2"
        style="text-align:center"><p>@UUID[Compendium.grimwild.gwce-crucibles.RollTable.NqPfMOaLZqxU4bp9]{____ing
        toward my
        enemies}</p></th></tr></thead><tbody><tr><td><p>prowl</p></td><td><p>glide</p></td></tr><tr><td><p>slither</p></td><td><p>dash</p></td></tr><tr><td><p>leap</p></td><td><p>skitter</p></td></tr><tr><td><p>crawl</p></td><td><p>lumber</p></td></tr><tr><td><p>bound</p></td><td><p>charge</p></td></tr><tr><td><p>gallop</p></td><td><p>float</p></td></tr></tbody></table></div></section><h3>"Fallout"</h3><p>There
        are often consequences to the magic anchoring your vassal to this plane
        breaking. Consider your summon, and what form that could take
        beforehand. Demons may require <em>immediate payment for their
        service</em>, vassals from elemental planes could <em>bring forth raging
        fire or a tidal wave</em>, while bestial creatures could <em>go
        berserk</em>. On a perfect, you avoid the trouble.</p>
