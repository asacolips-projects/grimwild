  - sort: 400000
    name: Cleric
    type: text
    _id: CwaTNKnbmUxRUSXo
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><em><strong>AKA the priest, zealot,
        chosen</strong></em></p><p><em>You serve as a conduit for the divine,
        chanelling holy power to safeguard the faithful and do your god's
        bidding.</em></p><p><strong>Core Talent:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.a5FCPZXbBkrFhAkr]{Channel
        Divinity}</p><p><strong>Path Talents:</strong>
        @UUID[Compendium.grimwild.gwce-talents.Item.yP8d4X3bKtDkD2tb]{Blessed}
        @UUID[Compendium.grimwild.gwce-talents.Item.4UxK0Tj35EGoNcas]{Devout}
        @UUID[Compendium.grimwild.gwce-talents.Item.ktPNzt7dsU45x9aI]{Healer}
        @UUID[Compendium.grimwild.gwce-talents.Item.aWMnTZkSPEH5bYDm]{Iron
        Will}
        @UUID[Compendium.grimwild.gwce-talents.Item.jSRWycSsJLzqx9SB]{Rings
        False}
        @UUID[Compendium.grimwild.gwce-talents.Item.cs4IyC33EXABs6ZC]{Sermons}
        @UUID[Compendium.grimwild.gwce-talents.Item.kitTuAlJqf7MIfVc]{Shepherd}</p><h3>Create
        Your God</h3><p>Create your god by naming them and giving them a
        thematic title—their epithet <em>(e.g. Zerenda, Goddess of Storms)</em>.
        Write down 3 tenets, the guidance from your god that you are expected to
        follow while spreading their word, then choose 1 of the following to
        create their domain of influence, or make your own.</p><section
        class="grid
        grid-3col"><div><ul><li><p>Storms</p></li><li><p>Mercy</p></li><li><p>Revelry</p></li><li><p>Justice</p></li><li><p>Trickery</p></li><li><p>Sea</p></li></ul></div><div><ul><li><p>Life</p></li><li><p>Radiance</p></li><li><p>Moon</p></li><li><p>Death</p></li><li><p>Travel</p></li><li><p>War</p></li></ul></div><div><ul><li><p>Magic</p></li><li><p>Hunt</p></li><li><p>Knowledge</p></li><li><p>Nature</p></li><li><p>Luck</p></li><li><p>Crafting</p></li></ul></div></section><h3>Learn
        Your Rites</h3><p>Decide your place in your god's flock. What is your
        mission, and what rites have you learned to help you achieve your goal?
        Choose 1 major rite, and 2 minor rites from the following, or make your
        own.</p><ul><li><p><strong>BLESSING</strong></p><ul><li><p><strong>Magic:</strong>
        <em>Bless a warhammer. Walk on water. Fill the forlorn duke's heart with
        hope.</em></p></li></ul></li><li><p><strong>DIVINATION</strong></p><ul><li><p><strong>Magic:</strong>
        <em>Find a safe path. Reveal where the thief is hiding. Know tomorrow's
        weather.</em></p></li></ul></li><li><p><strong>DOMINION</strong></p><ul><li><p><strong>Magic:</strong>
        <em>Convince someone to help. Make someone forget. Calm an angry
        mob.</em></p></li></ul></li><li><p><strong>HEALING</strong></p><ul><li><p><strong>Magic:</strong>
        <em>Heal a broken bone. Relieve someone of stress. Stop the
        bleeding.</em></p></li></ul></li><li><p><strong>WARDING</strong></p><ul><li><p><strong>Magic:</strong>
        <em>Shield an ally from harm. Block a doorway. Create
        sentries.</em></p></li></ul></li><li><p><strong>WRATH</strong></p><ul><li><p><strong>Magic:</strong>
        <em>Shatter a foe's weapon. Blind a traitor. Curse a heretic with
        misfortune.</em></p></li></ul></li></ul><blockquote
        style="border-style:solid;border-radius:8px"><h3>Cleric
        Spellcasting</h3><p>Your spellcasting ability comes in the form of power
        pools, meaning you roll the pool as an action in place of a stat. Read
        the highest as the result, then drop each die that lands on 1-3. If you
        add extra dice to the roll (such as from
        <em><strong>spark</strong></em>), keep them separate from the pool—they
        don’t affect dice dropping, and aren't added to the power
        pool.</p></blockquote>
