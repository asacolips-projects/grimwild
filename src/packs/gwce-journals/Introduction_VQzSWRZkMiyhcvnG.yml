  - sort: 300000
    name: Play With Moxie
    type: text
    _id: UeAlKSKG6Y3dTVbn
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><em>Grimwild</em> is built with the Moxie ruleset and designed for
        cinematic gameplay. The heart of that is narrative collaboration. It's
        all about creating a shared imagination space, managing the spotlight,
        and diving into narration. The rules will get you halfway there—they're
        all pointing towards keeping the pace flowing quickly and the action
        dramatic. The other half is in your hands, the players at the table, and
        the attitude you all approach the game with.</p><h2>Play
        Cinematically</h2><p><strong>Trust in the collaborative
        process.</strong> Everyone at the table adds details into the story. You
        have to work together and play off of each other, or the game and the
        story you’re telling will fall flat.</p><p><strong>Use the camera, your
        shared imagination.</strong> Each player has two perspectives, from your
        character and as the audience watching this TV show. Use the camera and
        vivid description to paint a cool scene in everyone's
        mind.</p><p><strong>Tell us what it looks like, before and after your
        rolls.</strong> Give details about what you do, don’t just leave it at
        broad statements. Zoom in and out. Use the camera to show things outside
        of your own character as well—pan around, cut to other scenes, and
        describe NPCs (Non-Player Characters). Invoke cinematic vibes and create
        great scenes.</p><h2>Play In Good Faith</h2><p><strong>Don’t be a
        weasel.</strong> Do what your character would do, then let the GM map it
        back to the rules. Don’t overdo it trying to work your way into better
        rolls. The fun is letting the story flow naturally. When you ask the
        rules what happens next, follow where it points with
        enthusiasm.</p><p><strong>Separate player and character
        knowledge.</strong> It’s more fun when everyone knows what’s going on in
        the game. Don’t keep secrets from each other, keep them from characters.
        As a player, be aware of what your character knows and doesn’t know and
        play towards both.</p><p><strong>Know the rules.</strong> Everyone can
        get a copy of the game PDF (it's free!). The rules say a lot about the
        types of stories to be told with the game, and the less time you spend
        talking about the rules, the more time you have for
        roleplaying.</p><p><strong>Trust the GM to work with you.</strong>
        They’re playing the game as much as anyone else, and want to make a good
        story. The GM isn’t out to punish players for taking entertaining but
        sub-optimal choices. Take chances and know they will have your
        back.</p><h2>Play to Tell a Story</h2><p><strong>Think of the game as a
        series of improv prompts, posed by yourselves and the rules.</strong>
        When you respond to them, consider the following:</p><ul><li><p>What
        would my character do?</p></li><li><p>What would make for a cool
        scene?</p></li><li><p>What would move the story
        forward?</p></li><li><p>What would get others
        involved?</p></li></ul><p><strong>Don’t talk yourself out of
        fun.</strong> The first idea that jumps into your head is often the one
        you should go with. Don’t overthink or rationalize yourself out of it.
        Like any great TV show character, go where the fun lies. Great stories
        involve excitement, danger, and hard choices.</p><p><strong>Open doors
        and step through them.</strong> The best scenes involve characters
        playing off of each other, so make chances for others to get involved.
        When someone invites you into a scene, step through that door—even if it
        means a bit of mental gymnastics to justify your character’s actions.
        And as long as you step through the door at times, remember that it can
        be just as interesting to close the door instead.</p><p><strong>Work the
        spotlight.</strong> There’s no turn order of any kind, but there is
        screen time. Strive to make sure everyone gets their fair share,
        including yourself.</p><ul><li><p>Grab the spotlight when there’s a lull
        or you have a great idea.</p></li><li><p>Share the spotlight by opening
        doors or following up on another PC’s actions.</p></li><li><p>Pass the
        spotlight when you’ve been holding it too long.</p></li><li><p>Point the
        spotlight to see another PC’s response or what they’ve been up
        to.</p></li><li><p>Never steal the spotlight. Everyone works hard to set
        up their moment.</p></li></ul><p><strong>Don't play to win, play to tell
        stories.</strong> Work towards the same goal—to tell a great story where
        everyone's character has a chance to grow. Failure isn't losing, it's
        just another opportunity to have a great scene. Of course, your
        character wants to succeed! However, your goal as a player is keeping
        the story interesting. Play into the bad luck just as you do the good to
        help ensure you craft compelling stories.</p><h2>Play Characters That
        Grow</h2><p><strong>Leave lots of blank space.</strong> Your PC starts
        with a past and connections to the world, but it's best as latticework.
        Learn who they are through play. Leave space for the other PCs and story
        to fit in.</p><p><strong>Don’t be afraid to change.</strong> PCs often
        go through hell. Any dramatic story has adversity. Let what happens
        change who they are. Announce what your PC's thinking, especially big
        shifts. If nobody else at the table knows, it’s not really happening in
        that shared imagination.</p><p><strong>Don’t be afraid to stay the
        same.</strong> Some aspects of your character might be immutable. That’s
        also part of what makes a great character. There can be those things
        they will stick to, even to the bitter end. Just make sure it’s worth
        it, and fun. Don’t die on small hills—die on entertaining
        ones.</p><p><strong>Make time for smaller moments.</strong> Quiet time,
        a conversation about nothing, introspection, reflection—these make for
        great scenes to flesh out your characters and the world. Don't just rush
        from action scene to action scene.</p><p><strong>Most importantly, do
        stuff!</strong> Find reasons to get into the spotlight, push story arcs
        forward, and make fun scenes. When there's no opportunity, add some
        details to the story to create one.</p>
