  - sort: 200000
    name: Getting Started
    type: text
    _id: mesSzpjqA8eCQqKo
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Grimwild's a tabletop roleplaying game, which this book assumes
        you're familiar with. The basics aren't covered here, but there are
        plenty of resources online, and you can join our Discord community to
        ask questions: <a href="https://discord.gg/bsfFh2dd6r" title="Grimwild
        Discord">https://discord.gg/bsfFh2dd6r</a></p><p><strong>Thematically</strong>,
        Grimwild draws heavily on the heroic fantasy of <em>Dungeons &amp;
        Dragons</em>, from the first editions (and the Old-School community
        which continues those traditions), to the modern, from 3rd edition
        onward. Inspiration was also taken from <em>Dungeon World</em> and its
        many descendants, like <em>Unlimited Dungeons</em>, <em>Chasing
        Adventure</em>, <em>Homebrew World</em>, and
        <em>Stonetop</em>.</p><p><strong>Mechanically</strong>, the Moxie system
        that <em>Grimwild</em> is built on draws from a variety of
        character-driven games, with the biggest influences being <em>Burning
        Wheel</em>, <em>Cortex Prime</em>, <em>Blades in the Dark</em>, and
        <em>Fate</em>.</p><h2>To Play, You
        Need:</h2><ul><li><p><strong>Players:</strong> You need one person as
        the game master (GM) and some players, ideally three or four. Guidelines
        for solo and duet play are in Ch. 9:
        Extras.</p></li><li><p><strong>Time:</strong> Sessions work best at 3
        hours. For longer sessions, consider using downtime (pg. 30) to break
        them up and reset per-session
        rules.</p></li><li><p><strong>Rules:</strong> All players should know
        the core rules. It makes play go more smoothly.
        </p></li><li><p><strong>Dice:</strong> Each player needs 4-6 d6s,
        notated as d (e.g., 2d, 4d), and 2-4 d8s, called thorns and notated as t
        (e.g., 1t, 3t). The GM needs 8
        d6s.</p></li><li><p><strong>Sheets:</strong> To track player characters
        (PCs), and story notes. GM sheets for quick
        reference.</p></li><li><p><strong>Safety:</strong> To help everyone feel
        comfortable with the themes within your campaigns, use the TTRPG Safety
        Toolkit: <a href="https://bit.ly/ttrpgsafetytoolkit" title="Safety
        Toolkit">bit.ly/ttrpgsafetytoolkit</a>.</p></li></ul><h2>Conventions in
        This Book</h2><ul><li><p><strong>Format:</strong> Emphasis is shown in
        <em>italics</em> or <strong>bold</strong>. System terms are
        <em><strong>bold italics</strong></em> (and are generally hyperlinked)
        when first shown, or when important. Examples are often after the rule,
        in a <span style="color:#6e6e6e"><em>lighter colored
        italics</em></span>.</p></li><li><p><strong>Pools:</strong> In Grimwild,
        "pool" always refers to
        @UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.2nnUgNYYbbPgAqBL]{diminishing
        pools}.</p></li><li><p>Crucibles: These are tables that provide a few
        words to use for inspiration. Interpret them literally or figuratively.
        Re-roll or pick if needed. For d66 tables, roll 2d6: one die for the
        column, the other for the row—or switch them. Look at the results and
        choose which one grabs you. Two-column tables use 1-3 and 4-6, and
        three-column tables use 1-2, 3-4, and 5-6 results to refer to each
        column respectively.</p></li></ul>
