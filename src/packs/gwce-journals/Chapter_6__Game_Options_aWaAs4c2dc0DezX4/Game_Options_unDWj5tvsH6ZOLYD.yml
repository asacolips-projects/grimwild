  - sort: 500000
    name: Optional Rules - Gear
    type: text
    _id: B7f2yRAHKyPk7hb5
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Armor</h2><p>Use this rule to give better definition between those
        who wear armor and those who don’t. Protective gear comes in two basic
        types: Light and Heavy. Each session, they bestow an Armor resource
        pool. After taking a physical consequence, you can choose to roll the
        pool to lessen the consequence (as a Messy on a defense
        roll).</p><p><strong>Light armor gives a 1d Armor pool</strong>, and
        also bestows the <em>Lightly Armored</em> condition, hindering
        movement—usually affecting spellcasting.</p><p><strong>Heavy armor gives
        a 2d Armor pool</strong>, bestowing the <em>Heavily Armored</em>
        condition, restricting movement and your ability to be quiet—usually
        affecting spellcasting, speed, and stealth. Plus, any attempt to swim is
        likely impossible.</p><h3>Bulwark (Fighter Path Talent
        Rework)</h3><p>Increase your Armor pool by +2d, regardless of the type
        you’re wearing (if any). When you roll your armor pool, you avoid the
        consequence instead of reducing it.</p><h2>Supplies</h2><p>Use this rule
        if you want the threat of running out of essential supplies, such as
        torches and rations to matter.</p><p><strong>Each PC has a 4d Supplies
        resource pool for common items and rations.</strong> Roll the pool with
        heavy use, and as time passes outside of civilization.</p><p>For finer
        detail, separate Rations (or other important goods) from Supplies and
        track each with a smaller pool.</p><h2>Encumbrance</h2><p>Use this rule
        to establish carrying limits and keep what PCs have on hand more
        grounded. This option is often paired with the Supplies
        rule.</p><p><strong>Each PC has space for 2 + their Brawn stat in gear
        they can carry.</strong> Main armor and weapons aren’t counted towards
        this number. Additional weapons, kits, rations, and treasures take up
        space, however, based on size. Most gear takes up 1 slot, while small
        items fill one half. Large or bulky items fill two or more. Characters
        can declare gear (related to their vantage) throughout their adventures,
        filling slots as needed.</p><section class="grid grid-4col"><div><p
        style="text-align:center"><em>Small items</em></p><div
        style="display:flex;justify-content:center"><img
        src="modules/grimwild/assets/img/encumbrance/enc-smallitems.svg"
        width="48" height="48"></div></div><div><p
        style="text-align:center"><em>Most gear</em></p><div
        style="display:flex;justify-content:center"><img
        src="modules/grimwild/assets/img/encumbrance/enc-mostgear.svg"
        width="48" height="48"></div></div><div><p
        style="text-align:center"><em>Large or Bulky</em></p><div
        style="display:flex;justify-content:center"><img
        src="modules/grimwild/assets/img/encumbrance/enc-large.svg" width="96"
        height="48"></div></div><div><p style="text-align:center"><em>Large
        &amp; Bulky</em></p><div
        style="display:flex;justify-content:center"><img
        src="modules/grimwild/assets/img/encumbrance/enc-XL.svg" width="144"
        height="48"></div></div></section><h2>Wealth</h2><p>Adventurers (and
        some players) love shiny coins to spend. Grimwild normally abstracts
        away all treasures except the most valuable—if you want a bit more fine
        control, use this rule.</p><p><strong>Each PC has a 4d Coins power pool
        to represent the gold they carry on their travels.</strong> Characters
        are expected to be able to pay for their own drinks, rooms, and other
        trivial purchases, but other expenditures are uncertain. PCs roll the
        pool for larger purchases <span style="color:rgb(110, 110,
        110)"><em>(buying a round of drinks, bribing a guard, getting a horse,
        buying party wear)</em></span>, or drop 1d then roll for huge expenses
        <span style="color:rgb(110, 110, 110)"><em>(securing passage across the
        sea, hiring an assassin, buying a trained warhorse)</em></span>. Impact
        moves may mean there’s a hidden flaw or hitch in the buying process,
        though the deal may still happen. When carousing by selling off
        @UUID[Compendium.grimwild.gwce-journals.JournalEntry.YbuXwBYYNXIb670F.JournalEntryPage.13jc6Kr9sBXfdgDC]{treasure}
        or as the GM sees fit, add +2d to the pool (max 8d). Treasure hoards may
        add more, or be treated as a linked Wealth pool.</p><h2>Weapon
        Styles</h2><p>Your weapon has 2 descriptors—its weapon styles, clear
        ways to differentiate it from others of its kind. A dagger may have
        hidden and quick, while a battleaxe has huge and sweeping. These are a
        reminder of how the weapon might affect the fiction—make sure to
        describe making use of these, as your vantage impacts difficulty. Your
        styles don’t define your weapon, they only show what aspects are most
        important to you in the narrative. Shields, bare knuckles, and even
        capes can be considered weapons. These descriptors can be split between
        multiple pieces of equipment if that fits the PC’s fighting style. Use
        any of the following, or come up with your own:</p><p><em>The ogre's
        strong, especially putting his weight behind that maul, so I dash around
        him with my quick short sword, and aim for his calf
        (+2t→+1t).</em></p><p>They search everyone entering the estate for
        weapons, but my concealable dagger should be easy to hide
        (Impossible→1t).</p><h3>Example Weapon Styles</h3><section class="grid
        grid-3col"><div><ul><li><p>precise</p></li><li><p>quiet</p></li><li><p>vicious</p></li><li><p>disarming</p></li><li><p>dazing</p></li><li><p>ornate</p></li></ul></div><div><ul><li><p>quick</p></li><li><p>sweeping</p></li><li><p>entangling</p></li><li><p>heavy</p></li><li><p>nimble</p></li><li><p>brutal</p></li></ul></div><div><ul><li><p>bashing</p></li><li><p>piercing</p></li><li><p>sapping</p></li><li><p>balanced</p></li><li><p>concealable</p></li><li><p>long</p></li></ul></div></section>
