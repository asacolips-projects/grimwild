  - sort: 800000
    name: Flavors of Fantasy
    type: text
    _id: WftiE8byFzyQLfn0
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Each of the following pages gives guidance, rules tweaks, and setting
        dials to shift the base assumptions of Grimwild over to other popular
        sub-genres of fantasy. Pick and choose what you want to use for your own
        setting, altering it as
        needed.</p><p><strong>@UUID[.dGXml37ws8BRBb5I]{Heroic Fantasy}
        •</strong> Inspirational and
        adventurous.</p><p><strong>@UUID[.4lSz8KRxdrpDA459]{Grimdark} •</strong>
        Bleak, brutal, and
        unforgiving.</p><p><strong>@UUID[.ubetvMvblaZYXEdC]{Low Fantasy}
        •</strong> Grounded and often more cynical or
        realistic.</p><p><strong>@UUID[.za0SK5kwQgGy7Jdc]{Sword &amp; Sorcery} •
        </strong>Adventurous, action-packed, and often
        pulpy.</p><p><strong>@UUID[.iNX7SSl8Q3ZeklLm]{Noblebright} •</strong>
        Both hopeful and dangerous.</p><p><strong>@UUID[.FtO08qHOxqftJgD2]{High
        Fantasy} •</strong> Epic and grand, often with a sense of
        wonder.</p><p><strong>@UUID[.Ym801JI4j9LtcT4f]{Cozy Fantasy} •</strong>
        Wholesome, heartwarming, and low-stakes.</p>
