  - sort: 1000000
    name: Flavor - Heroic Fantasy
    type: text
    _id: dGXml37ws8BRBb5I
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Inspirational and adventurous</strong>, with a focus on
        self-discovery and the hero’s journey. Characters grow through
        challenge, forge bonds through hardship, and leave the world better than
        they found it, often through sacrifice. These stories are about becoming
        more than you were and choosing to act when it matters
        most.</p><p><strong>Use this flavor</strong> when you want classic
        heroic journeys where courage, loyalty, and resolve are
        tested.</p><section class="grid grid-3col"><div><p
        style="text-align:center"><span
        style="font-size:large">Scale</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/heroicfantasy-scale.svg"><p
        style="text-align:center"><em>Scope increases throughout the
        story</em></p></div><div><p style="text-align:center"><span
        style="font-size:large">Lethality</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/heroicfantasy-lethality.svg"><p
        style="text-align:center"><em>Some sacrifices are made, but the heroes
        will win the day</em></p></div><div><p style="text-align:center"><span
        style="font-size:large">Magic</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/heroicfantasy-magic.svg"><p
        style="text-align:center"><em>Magic is commonplace, and usable by
        most</em></p></div></section><h3>Playing Heroic Fantasy
        Games</h3><ul><li><p><strong>Let characters be competent, capable, and
        proactive.</strong> Those who live in these worlds start small, but grow
        to actively shape their world.</p></li><li><p><strong>Failure
        complicates the path but doesn’t end the journey.</strong> The
        characters are forced to pivot, adapt, and overcome, often discovering
        their own resilience and the power of their relationships, earning their
        victory after struggle.</p></li><li><p><strong>Make sure to reward
        courage, but not recklessness.</strong> It takes strength to stand up to
        overwhelming odds for the sake of others, and wits to plan and follow
        through to win the day.</p></li></ul><p><em>The default Grimwild rules
        are geared for a darker Heroic Fantasy. GMs should be mindful of keeping
        consequences varied, but otherwise there are no rules
        changes.</em></p><h3>Media
        Touchstones</h3><p><strong>Literature:</strong> Mistborn, Water Outlaws,
        Icewind Dale Trilogy</p><p><strong>Visual:</strong> The Legend of Vox
        Machina, The Secrets of NIMH, Adventure
        Time</p><p><strong>Interactive:</strong> Dragon Age, Baldur's Gate, The
        Legend of Zelda</p>
