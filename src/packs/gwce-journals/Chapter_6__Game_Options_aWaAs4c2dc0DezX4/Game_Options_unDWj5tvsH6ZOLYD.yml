  - sort: 1600000
    name: Legacy Talents
    type: text
    _id: rvIvWg3fwFTQXGqN
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>The following talents are from Grimwild v1.4, or earlier versions of
        the Community Edition. These were dropped for various reasons, from
        balance to theme. Ask your GM before taking any of the
        following.</p><p>@UUID[Compendium.grimwild.talents.Item.JsmQDELRkKavY179]{Weapon
        Mastery (Legacy Fighter Core
        Talent)}</p><p><em><strong>Rationale:</strong> This talent gets
        overpowered at higher levels, with a near 50% chance to critical and a
        minuscule 1.5% chance to fail at level 6. This trivializes fights and
        can be
        boring.</em></p><p>@UUID[Compendium.grimwild.talents.Item.Me7VMy86RNScK7bI]{Awakened
        Mind (Legacy Psion Core Talent)}</p><p><em><strong>Rationale:</strong>
        While somewhat overpowered, allowing the same number of spells with more
        flexibility than wizards, the power point system doesn't give flavor to
        its
        magic.</em></p><p>@UUID[Compendium.grimwild.talents.Item.U4YkySSJw0RvhzsN]{Bardsong
        (Legacy Bard Core Talent)}</p><p><em><strong>Rationale:</strong>
        Multiple kinds of tracked abilities, and building bardsongs on the fly
        can slow the game down. This talent is also quite powerful at low
        levels.</em></p><p></p><h2>Legacy Path
        Talents</h2><p>@UUID[Compendium.grimwild.gwce-talents.Item.Qmiw5OJ26kp02crL]{Cunning
        Actions (CE
        Rogue)}</p><p>@UUID[Compendium.grimwild.talents.Item.l7fghNbTrlBFmVQh]{Trap
        Sense
        (Rogue)}</p><p>@UUID[Compendium.grimwild.talents.Item.VljVPyIk0taV9T5l]{Anchorshot
        (Artificer)}</p><p>@UUID[Compendium.grimwild.talents.Item.UWKhdFNz88tvBtYA]{Double-Barreled
        Blunderbuss
        (Artificer)}</p><p>@UUID[Compendium.grimwild.talents.Item.dmBjW6js56AdZ8kf]{Mechanical
        Mount
