  - sort: 1300000
    name: Flavor - Noblebright
    type: text
    _id: iNX7SSl8Q3ZeklLm
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Both hopeful and dangerous.</strong> Good almost always
        triumphs over evil. The world can be made better, and heroes are defined
        as much by mercy as by strength. This world is optimistic without being
        soft. Noblebright is about choosing light despite the dark forces in the
        world.</p><p><strong>Use this flavor</strong> when you want hopeful
        stories where courage changes the course of events.</p><section
        class="grid grid-3col"><div><p style="text-align:center"><span
        style="font-size:large">Scale</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/noblebright-scale.svg"><p
        style="text-align:center"><em>Threats are far reaching, but so are
        you</em></p></div><div><p style="text-align:center"><span
        style="font-size:large">Lethality</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/noblebright-lethality.svg"><p
        style="text-align:center"><em>Both physical and moral victories
        matter</em></p></div><div><p style="text-align:center"><span
        style="font-size:large">Magic</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/noblebright-magic.svg"><p
        style="text-align:center"><em>Magic varies by area and faction, and is
        unaligned</em></p></div></section><div><h3>Playing Noblebright
        Games</h3><ul><li><p><strong>Hope is powerful.</strong> These games
        showcase the power of the human spirit, actively promoting altruism and
        agency. Those with good intentions and determined minds can reshape
        their broken world. Doing the right thing is always worth the cost.
        </p></li><li><p><strong>Redemption over punishment.</strong> Even the
        most deeply flawed and adversarial should be given the chance to forge a
        better path. Because of this, violence is usually the last resort.
        </p></li><li><p><strong>The internal lives of the characters are
        important.</strong> The emotional victories of overcoming personal
        trauma, forgiving an enemy, and healing strained bonds matter just as
        much as the physical ones. Give them the screen time they
        deserve.</p></li></ul><h3>Rules Tweaks</h3><ul><li><p>PCs begin at
        <strong>2nd level</strong> with 1 minor arcana, and the story of your
        past adventure.</p></li><li><p>Make a 3d story roll when
        <strong>dropped</strong>.</p></li><li><p>Should a PC die, the player has
        <strong>full control</strong> of the end of their
        story.</p></li><li><p><em><strong>Stakes</strong></em> for physical
        combat are often lower, while those for social conflicts are
        higher.</p></li><li><p><em><strong>Rattled</strong></em> clears after
        any intense scene. The heroes are brave in the face of
        danger.</p></li><li><p>Social fallout from <em><strong>vex</strong></em>
        responses heightened. Interpersonal relationships are
        important.</p></li></ul><h3>Media
        Touchstones</h3><p><strong>Literature:</strong> The Princess Bride, The
        Stormlight Archive, The Chronicles of
        Narnia</p><p><strong>Visual:</strong> The Last Airbender, She-Ra, The
        10th Kingdom</p><p><strong>Interactive:</strong> Kingdom Hearts, Dragon
        Quest, World of Warcraft</p></div><div></div>
