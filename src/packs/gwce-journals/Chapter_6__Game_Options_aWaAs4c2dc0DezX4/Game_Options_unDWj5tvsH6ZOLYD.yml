  - sort: 1100000
    name: Flavor - Grimdark
    type: text
    _id: 4lSz8KRxdrpDA459
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Bleak, brutal, and unforgiving.</strong> A world of moral
        ambiguity, harsh realities, and the constant threat of ruin. Any
        victories are costly, and hope is hard-won. In this world, doing the
        right thing hurts, but doing nothing hurts more. The point of some of
        these stories isn't the battle, but the nature of
        defeat.</p><p><strong>Use this flavor</strong> when you want stories of
        moral ambiguity and characters pushed to their limits by an uncaring
        world.</p><section class="grid grid-3col"><div><p
        style="text-align:center"><span
        style="font-size:large">Scale</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/grimdark-scale.svg"><p
        style="text-align:center"><em>Wide range of conflict, usually on a
        personal scale</em></p></div><div><p style="text-align:center"><span
        style="font-size:large">Lethality</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/grimdark-lethality.svg"><p
        style="text-align:center"><em>Danger around every corner, and death is
        lasting</em></p></div><div><p style="text-align:center"><span
        style="font-size:large">Magic</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/grimdark-magic.svg"><p
        style="text-align:center"><em>Magic is a dark, usually antagonistic
        force</em></p></div></section><div><h3>Playing Grimdark
        Games</h3><ul><li><p><strong>Scarcity and pressure push the
        characters.</strong> Fantasy heroes often have the comfort of ideology.
        They'll often fight for justice and honor, while basic needs are
        hand-waved away. Grimdark fantasy strips those luxuries away with many
        characters focused on pure survival.</p></li><li><p><strong>Violence is
        ugly and costly.</strong> Battle is about staying alive and seeing
        tomorrow—it's clumsy, exhausting, and carries a heavy toll, even after
        the fighting is finished. Those that survive still deal the trauma, and
        crippling injuries. Those that don't often die suddenly, and without
        warning. Death isn't always meaningful.</p></li><li><p><strong>Hope is
        fragile.</strong> These stories aren't meaninglessly dark; there's often
        a spark of hope that keeps characters going. Their contrast against the
        world around them gives the oppressive environment
        meaning.</p></li></ul><h3>Rules Tweaks</h3><ul><li><p>The effect of
        <em><strong>potency</strong></em> is scaled down.</p></li><li><p>Casting
        <strong>magic</strong> comes with higher risk (thorns) or
        <em><strong>stakes</strong></em>.</p></li><li><p><strong>Magic
        healing</strong> is rare or non-existent.</p></li><li><p>When
        <em><strong>dropped</strong></em>, make a 1d story
        roll.</p></li><li><p><em><strong>Marks</strong></em> only clear on
        rest.</p></li><li><p><em><strong>Vex</strong></em> responses are
        random.</p></li><li><p>PC <strong>bonds</strong> are rolled
        randomly.</p></li><li><p><strong>@UUID[.B7f2yRAHKyPk7hb5#supplies]{Supplies}</strong>
        (optional rule)</p></li></ul><h3>Media
        Touchstones</h3><p><strong>Literature:</strong> Second Apocalypse, The
        Black Company, First Law</p><p><strong>Visual:</strong> Berserk, Black
        Death, The Head Hunter</p><p><strong>Interactive:</strong> Dark Souls
        series, Diablo, Darkest Dungeon</p></div>
