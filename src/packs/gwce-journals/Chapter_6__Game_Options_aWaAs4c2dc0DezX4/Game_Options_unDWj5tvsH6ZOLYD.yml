      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Wholesome, heartwarming, and low-stakes.</strong> Stories are
        focused on friendship, personal growth, and the simple joys in a magical
        world. Conflict exists, but rarely with high stakes. Cozy fantasy is
        about finding comfort, connection, and meaning in small
        moments.</p><p><strong>Use this flavor</strong> when you want warm,
        character-driven stories about belonging and growth.</p><section
        class="grid grid-3col"><div><p style="text-align:center"><span
        style="font-size:large">Scale</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/cozy-scale.svg"><p
        style="text-align:center"><em>Stories are personal, and
        low-stakes</em></p></div><div><p style="text-align:center"><span
        style="font-size:large">Lethality</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/cozy-lethality.svg"><p
        style="text-align:center"><em>True danger is rare, and with heart, you
        overcome</em></p></div><div><p style="text-align:center"><span
        style="font-size:large">Magic</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/cozy-magic.svg"><p
        style="text-align:center"><em>The world is full of whimsy, arcane or
        not</em></p></div></section><div><h3>Playing Cozy Fantasy
        Games</h3><ul><li><p>Center the warmth of relationships. The narrative
        is slow, showing the comfort of shared meals and a growing sense of
        belonging. </p></li><li><p><strong>Tension comes from misunderstandings,
        or are mindless.</strong> Friction is relatable, and conflicts are low
        stakes, often resolved through communication, vulnerability, and
        empathy. Truly antagonistic forces come in the form of natural
        disasters, the wilderness, and nebu- lous supernatural forces.
        </p></li><li><p><strong>Celebrate small victories.</strong> The world
        isn't in danger, so these stories show the delight of new friendships,
        finding just the right ingredient for a meal, and taking care of those
        around you.</p></li></ul><h3>Rules Tweaks</h3><ul><li><p><strong>Low
        stakes</strong> is the default. Normal stakes and higher must be
        declared.</p></li><li><p>PCs and allies <strong>only die in meaningful
        ways</strong>, almost always outside of
        conflict.</p></li><li><p><strong>Slow progression</strong>, but changing
        a bond or completing a story arc in the session earns +1
        XP.</p></li><li><p>Characters can’t progress past <strong>level
        3</strong>. Once PCs reach major milestones, they’re allowed to switch
        out one talent with another.</p></li></ul><h3>Media
        Touchstones</h3><p><strong>Literature:</strong> Legends and Lattes, The
        Spellshop, The Ogress and the Orphans</p><p><strong>Visual:</strong>
        Kiki's Delivery Service, Spirited Away, Delicious in
        Dungeon</p><p><strong>Interactive:</strong> Stardew Valley, beacon
        Pines, Wytchwood</p></div><div></div>
