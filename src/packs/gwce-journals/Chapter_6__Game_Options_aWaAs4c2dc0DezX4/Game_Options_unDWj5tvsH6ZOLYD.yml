  - sort: 700000
    name: Optional Rules - GM Tools
    type: text
    _id: 9x1uz89EFCD3CUvx
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Active Vigilance</h2><p>Use this rule to allow for randomized
        vigilance—when you want the dice to tell you what you do and don’t
        see.</p><p><strong>When the GM decides to use vigilance, they spotlight
        one of the PCs, and have them make a story roll affected by their
        vantage.</strong> On a perfect, the player gets a reveal. On a messy,
        they get a hint. On a grim, the GM uses strike. Certain groups may
        prefer to have the reason for the story roll a secret, though Grimwild
        thrives when everybody is in the know. Discuss with your group
        beforehand to find out what they prefer.</p><h2>Tick Pools</h2><p>These
        are a predictable version of any kind of diminishing pool, usually
        2d-4d. <strong>When triggered, they drop exactly 1d, and are never
        rolled.</strong> These are less dramatic and less dynamic, but are
        useful when GMs want pool progress to be non-random. Because of the
        smaller size, rules or talents that drop 1d are more impactful. If used,
        these are recommended to go alongside standard pools, not acting as a
        full replacement.</p><h2>Writers' Room</h2><p>Use this rule if you want
        to expand the types of details your players can add.</p><p>Story details
        added with both tangles and thread don’t need to be connected to PC
        vantage. The PCs can freely offer their own impact moves to gain spark
        (as a tangle,) or another benefit and can expand the world with their
        own details. Only details that benefit the party cost
        thread.</p><h2>Homebrew Talent Guidance</h2><p><strong>Keep text concise
        and clear.</strong> The goal should be to make the rules easy to
        understand and remember. Try to use terminology and wording from
        existing talents—this streamlines understanding and provides a mental
        jumping-off point for experienced players.</p><p><strong>Avoid extra
        rolls and tracking.</strong> Lots of small levers, toggles, and
        different kinds of uses all slow the game down. Even worse, adding extra
        rolls with use, such as for defense or story rolls, adds multiple layers
        of complexity—forcing players to grab dice, make rolls, and interpret
        them. This may not sound like much, but it can add up. Try to keep
        specific tracking down to 1 per talent.</p><p><strong>Power levels are
        important, but not too important.</strong> Aim for power levels around
        what already exists, but don’t get too hung up on it. PCs are always
        limited by their <em><strong>spotlight</strong></em>, so it’s difficult
        for even somewhat overpowered characters to overshadow others. In
        general, core talents are twice as powerful as path talents, increasing
        to 3x the power at level 3, and 4x the power at level 6.</p>
