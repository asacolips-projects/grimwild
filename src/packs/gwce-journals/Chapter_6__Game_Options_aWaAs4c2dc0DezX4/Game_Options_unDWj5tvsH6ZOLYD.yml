  - sort: 600000
    name: Optional Rules - Advancement
    type: text
    _id: s7f3SlGbfs5hrBN4
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Focused Growth</h2><p>Use this rule if you want to narrow the focus
        of your game. Tying experience to the story can help incentivize more
        passive players to engage with the themes. Make use of slow progression
        rules, slashing xp boxes before filling them (effectively doubling the
        amount needed to level), but at the end of each session, give a chance
        for an additional xp based on what happened in the game. This can often
        be connected to the adventuring party concept.</p><p><span
        style="color:rgb(110, 110, 110)"><em>Themes about <strong>social
        relationships</strong> → bonus xp to those who changed their
        <strong>bond</strong>.</em></span></p><p><span style="color:rgb(110,
        110, 110)"><em>Theme about <strong>personal flaws</strong> → bonus xp to
        those who introduced <strong>tangles</strong>.</em></span></p><p><span
        style="color:rgb(110, 110, 110)"><em>Party concept:
        <strong>Disciples</strong> → bonus xp to those who
        <strong>convert</strong> others.</em></span></p><p><span
        style="color:rgb(110, 110, 110)"><em>Campaign focus: <strong>Treasure
        Hunting</strong> → bonus xp when
        <strong>carousing</strong>.</em></span></p><h2>Milestone
        Levels</h2><p>Use this rule to eschew keeping track of experience
        altogether. Players don’t add xp after each session. Instead, the party
        members level up after meaningful completion of a major group story arc.
        The group should talk about what counts as meaningful, but ultimately
        the choice is up to the GM.</p><h2>Level 0</h2><p>Starting heroes are
        already fairly powerful at level 1, use this rule if you want to have
        low-powered, beginner PCs. These are often useful for introductory
        games.</p><p><strong>PCs have no core talent, and only 3 extra stat
        points.</strong> Characters level up after gaining 1 experience (usually
        1 session), gaining their core talent and last stat point. Half core
        talents <em>(Arcane Training, Natural Moxie, etc.)</em> can be replaced
        with the core, letting the player choose a different path talent for the
        character.</p><p></p>
