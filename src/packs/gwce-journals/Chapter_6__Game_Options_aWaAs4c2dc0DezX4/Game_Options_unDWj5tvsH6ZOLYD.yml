  - sort: 1200000
    name: Flavor - Low Fantasy
    type: text
    _id: ubetvMvblaZYXEdC
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Grounded and often more cynical or realistic.</strong> This
        has small-scale conflicts with limited or no magic. These stories are
        about people scraping by in a world that largely doesn’t
        care.</p><p><strong>Use this flavor</strong> when you want tense,
        small-scale stories where preparation, vigilance, and relationships
        matter more than raw power.</p><section class="grid grid-3col"><div><p
        style="text-align:center"><span
        style="font-size:large">Scale</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/lowfantasy-scale.svg"><p
        style="text-align:center"><em>Smaller scope with personal
        struggles</em></p></div><div><p style="text-align:center"><span
        style="font-size:large">Lethality</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/lowfantasy-lethality.svg"><p
        style="text-align:center"><em>Dangers are real, and death can be quick
        if unprepared</em></p></div><div><p style="text-align:center"><span
        style="font-size:large">Magic</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/lowfantasy-magic.svg"><p
        style="text-align:center"><em>Magic is rare, powerful, and
        dangerous</em></p></div></section><h3>Playing Low Fantasy
        Games</h3><ul><li><p><strong>Give it a more historical vibe.</strong>
        These stories are grounded in the familiar, where the world runs on the
        recognizable rules of human nature and politics.
        </p></li><li><p><strong>Magic is a rare and disruptive force, if it
        exists at all.</strong> Supernatural forces aren't well understood and
        are only wielded by those willing to break the natural order.
        </p></li><li><p><strong>Leverage is more valuable than force.</strong>
        Characters aren't powerful on their own, and will need to curry favors,
        discover secrets, and use their wits to survive. When it does come down
        to physical clashes, winning often has a cost. A single blade will only
        get you so far.</p></li></ul><h3>Rules Tweaks</h3><ul><li><p>The effect
        of <em><strong>potency</strong></em> is scaled
        down.</p></li><li><p>Limited to 1 <strong>magic user</strong>, if any.
        Magic use comes with higher risk or
        <em><strong>stakes</strong></em>.</p></li><li><p>When
        <strong>dropped</strong>, make a 1d story
        roll.</p></li><li><p><strong>Vigilance</strong> is more important, and
        is focused on hint more than strike or reveal.</p></li><li><p>Social
        fallout from <em><strong>vex</strong></em> is
        increased.</p></li><li><p><strong>@UUID[.B7f2yRAHKyPk7hb5#encumbrance]{Encumbrance}</strong>
        (optional
        rule)</p></li><li><p><strong>@UUID[.B7f2yRAHKyPk7hb5#wealth]{Wealth}</strong>
        (optional rule)</p></li><li><p><strong>Slow XP</strong> progression, max
        level of 3.</p></li><li><p><em><strong>Consequences</strong></em> stick
        around longer.</p></li><li><p><strong>Factions</strong> play a major
        role.</p></li></ul><h3>Media
        Touchstones</h3><p><strong>Literature:</strong> A Song of Ice and Fire,
        The Lies of Lock Lamora, Sailing to
        Sarantium</p><p><strong>Visual:</strong> Spice and Wolf, The 13th
        Warrior, The Last Kingdom</p><p><strong>Interactive:</strong> The
        Witcher, Mount &amp; Blade, Kingdom Come: Deliverance</p>
