  - sort: 400000
    name: Optional Rules - Gameplay
    type: text
    _id: lyXL4rv9s6r3cF7T
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Token Initiative</h2><p>Use this rule to strike a balance between
        the normally free-flowing scenes of Moxie and a structured turn system.
        In this approach, there’s no set turn order. Instead, players are given
        tokens to represent the "camera time" they have to act within a
        scene.</p><p><strong>At the start of an intense moment</strong>, give
        each player 2 tokens. Players must spend a token before a story beat
        (usually an action roll). Play continues until all tokens are spent,
        after which all players regain their tokens, ensuring everyone gets the
        same screen time.</p><h2>Rest Resets</h2><p>Use this rule if you want
        talent and ability resets to be more narrative
        focused.</p><p><strong>Talents no longer reset each session, instead
        resetting during rests and other narrative breaks.</strong> Some rests
        may not be relaxed enough for a full reset, though precautions <span
        style="color:rgb(110, 110, 110)"><em>(hidden campsite, watch rotation,
        entertainment)</em></span> can help. While resting, the world around the
        PCs still moves forward—the GM should highlight any timers and threats
        beforehand. Consider playing out a vignette to close out or open up the
        next day. When the group decides on a reset:</p><section class="grid
        grid-3col"><div><ul><li><p>PCs take spark</p></li><li><p>All thread is
        reset</p></li></ul></div><div><ul><li><p>All talents are
        reset</p></li><li><p>GM takes 2
        suspense</p></li></ul></div><div><ul><li><p>PCs heal 1
        harm</p></li><li><p>Some Conditions
        fade</p></li></ul></div></section><h2>Stat Progression</h2><p>Use this
        rule if you want a way for character stats to be
        increased.</p><p><strong>When a PC levels up, they can forgo a talent to
        increase a stat by 1, to a max of 3.</strong> Each character can only do
        this once. Stat increases can be very impactful—avoid this option for
        smaller scale games.</p><h2>Vigor Pool</h2><p>This rule is intended for
        games without healing magic.</p><p><strong>Each PC has a 3d Vigor
        resource pool.</strong> When the PCs have a moment to catch their
        breath, they can roll the pool to clear 1 harm. This pool refreshes
        after an extended period of rest. Lower or increase the pool to change
        the lethality.</p>
