  - sort: 1250000
    name: Flavor - Sword & Sorcery
    type: text
    _id: za0SK5kwQgGy7Jdc
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Adventurous, action-packed, and often pulpy.</strong> Heroes
        rely on wit, steel, and audacity in a world full of dangerous monsters
        and lost riches. The only way to live forever is to be a
        legend.</p><p><strong>Use this flavor</strong> when you want high-action
        adventures driven by risk, greed, nerve, and luck.</p><section
        class="grid grid-3col"><div><p style="text-align:center"><span
        style="font-size:large">Scale</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/swordsorcery-scale.svg"><p
        style="text-align:center"><em>Use your might and wits to overcome
        personal stakes</em></p></div><div><p style="text-align:center"><span
        style="font-size:large">Lethality</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/swordsorcery-lethality.svg"><p
        style="text-align:center"><em>Danger abounds, but you are strong enough
        to meet it</em></p></div><div><p style="text-align:center"><span
        style="font-size:large">Magic</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/swordsorcery-magic.svg"><p
        style="text-align:center"><em>Magic corrupts the fools who seek it
        out</em></p></div></section><div><h3>Playing Sword &amp; Sorcery
        Games</h3><ul><li><p><strong>Keep scenes moving and decisive.</strong>
        These games thrive on high-octane momentum, where bold action wins out
        over planning and maneuvering. Make use of montages, and jump into
        scenes in media res (in the middle of the action) using story
        rolls.</p></li><li><p><strong>Heroes have some moral ambiguity.</strong>
        Characters are more often outlaws, sellswords, and thieves than classic
        heroes. They're driven by self-interest—fighting for gold, freedom, or
        day-to-day survival. The narrative focuses on the immediate, visceral
        struggle of flawed people fighting like hell against corrupt sorcerers,
        ancient horrors, and tyranny.</p></li></ul><h3>Rules
        Tweaks</h3><ul><li><p>No <strong>magic</strong>, or rare and dangerous
        magic (@UUID[.jMmlxr0QujJmwyB6#magic]{Setting
        dials})</p></li><li><p>Make a 1d story roll when
        <strong>dropped</strong>.</p></li><li><p>Clear
        <em><strong>marks</strong></em> and <em><strong>harm</strong></em> after
        each scene.</p></li><li><p><strong>Vex</strong> happens more often, but
        social fallout from vex responses is lessened.</p></li><li><p>Each PC
        has a <strong>4d Renown</strong> campaign timer, spreading their legend.
        Those in the greater world will come to know their
        names.</p></li><li><p><strong>Mooks</strong> require no roll to take
        out.</p></li><li><p>Slow progression, but <strong>carousing</strong>
        earns +1
        XP.</p></li><li><p><strong>@UUID[.lyXL4rv9s6r3cF7T#vigor-pool]{Vigor
        Pool}</strong> (Optional Rule).</p></li></ul><h3>Media
        Touchstones</h3><p><strong>Literature:</strong> Conan the Barbarian, The
        Grimnir Trilogy, Fafhrd and the Gray
        Mouser</p><p><strong>Visual:</strong> Fire and Ice, Heavy Metal, Jason
        and the Argonauts</p><p><strong>Interactive:</strong> Thief: The Dark
        Age, Dragon's Dogma, Risen series</p></div><div></div>
