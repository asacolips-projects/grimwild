  - sort: 1400000
    name: Flavor - High Fantasy
    type: text
    _id: FtO08qHOxqftJgD2
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Epic and grand, often with a sense of wonder.</strong> Cosmic
        conflicts, destinies, and large-scale battles. Magic is powerful, heroes
        are exceptional, and conflicts are vast. These stories are about heroes
        standing at the center of myths, not just surviving, but becoming a part
        of them.</p><p><strong>Use this flavor</strong> when you want grand
        stories of destiny, wonder, and world-shaping events.</p><section
        class="grid grid-3col"><div><p style="text-align:center"><span
        style="font-size:large">Scale</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/highfantasy-scale.svg"><p
        style="text-align:center"><em>The choices made will shape the future of
        the world</em></p></div><div><p style="text-align:center"><span
        style="font-size:large">Lethality</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/highfantasy-lethality.svg"><p
        style="text-align:center"><em>You're incredible, but up against ultimate
        power</em></p></div><div><p style="text-align:center"><span
        style="font-size:large">Magic</span></p><img
        src="modules/grimwild/assets/img/flavor-scales/highfantasy-magic.svg"><p
        style="text-align:center"><em>Magic, gods, and mysticism are
        everywhere</em></p></div></section><div><h3>Playing High Fantasy
        Games</h3><ul><li><p><strong>Think in terms of regions, factions, and
        eras.</strong> These stories are cosmic in scale, covering a sprawling
        landscape, and yet tied to the characters, ensuring their personal
        choices matter and their victories reshape the setting.
        </p></li><li><p><strong>Lean into the lore and history of the
        world.</strong> Every ruined civilization, ancient prophecy, and
        bloodline carries meaning, playing into the unfolding destiny of the
        Chosen characters and their realm.</p></li></ul><h3>Rules
        Tweaks</h3><ul><li><p>PCs begin at <strong>3rd level</strong> with 2
        minor arcana or 1 major arcana, as well as a story about where they came
        from.</p></li><li><p><strong>Mooks</strong> require no roll to take out,
        while <strong>toughs</strong> can be taken a few at a
        time.</p></li><li><p><strong>Bosses</strong> are linked challenges,
        usually with a trick to overcoming them.</p></li><li><p>More rolls are
        automatic
        <strong>successes</strong>.</p></li><li><p><strong>@UUID[.lyXL4rv9s6r3cF7T#token-initiative]{Token
        Initiative}</strong> (Optional Rule). This helps keep narrative balance
        when more rolls are automatically successful.</p></li></ul><h3>Media
        Touchstones</h3><p><strong>Literature:</strong> The Wheel of Time,
        Malazan Book of the Fallen, A Court of Thorns and
        Roses</p><p><strong>Visual:</strong> The Dark Crystal, Kill 6 Billion
        Demons, The Never Ending Story</p><p><strong>Interactive:</strong> Final
        Fantasy, The Elder Scrolls series, Kingdoms of Amalur</p></div>
