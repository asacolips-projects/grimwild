name: Game Options
_id: unDWj5tvsH6ZOLYD
pages:
  - sort: 100000
    name: Setting Dials
    type: text
    _id: jMmlxr0QujJmwyB6
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Magic</h2><p>Fantasy settings sometimes feature magic in a limited
        way, as a rarity or an exclusively evil force. In others, the wonders
        are widespread and available to all, sourced from the whimsical world
        itself or as an industrialized and quantified resource. Base
        <em>Grimwild</em> takes the middle road, with magic available, but not
        ubiquitous.</p><h3>Rare Magic</h3><ul><li><p>Limit the party to one
        magic user, if any.</p></li><li><p>Potent spells can't open new
        opportunities; they act only as normal spells with broader impact—often
        with more risk.</p></li><li><p>Establish before your game if magical
        healing exists.</p></li></ul><h3>No Magic</h3><ul><li><p>All magical
        paths are removed, as is arcana. Reflavor talents as skill and
        technology as needed.</p></li><li><p>Consider also dialing down
        @UUID[.#lethality]{lethality} or using the
        @UUID[.lyXL4rv9s6r3cF7T#vigor-pool]{Vigor Pool} optional rule to make up
        for the lack of magical healing unless you're looking for a gritty
        tone.</p></li></ul><h3>Common Magic</h3><ul><li><p>Make arcana more
        plentiful in the world, and reflavor more talents to be magical in
        nature.</p></li><li><p>PCs should start with 1 minor arcana, and the
        story of where it came from.</p></li></ul><h3>Dangerous Magic</h3><p>All
        spells can trigger a magical twist (as sorcerer) when two or more 1s are
        rolled. When triggered, pick one of the
        following:</p><ul><li><p><em>Wild Surge: make a 1d story roll to see the
        collateral damage</em></p></li><li><p><em>Dark Omen: GM takes +1
        suspense</em></p></li><li><p><em>6d Corruption pool: 0d → change trait,
        desire, bond, or appearance
        negatively.</em></p></li></ul><h2>Scale</h2><p>There is a vast
        difference in the scale of character impact between small village common
        folk and mythic heroes. Use these options to change the scope of the
        game.</p><h3>Smaller Scale</h3><ul><li><p>More rolls have
        <em><strong>risk</strong></em>, and are judged as
        impossible.</p></li><li><p>Mooks should be rare, with even common
        enemies posing a threat.</p></li><li><p>The max level for PCs is 3,
        though the GM should allow talents to be switched out after in-game
        milestones.</p></li></ul><h3>Larger Scale</h3><ul><li><p>Fewer rolls
        have <em><strong>risk</strong></em> and are judged as
        impossible.</p></li><li><p>Mooks should be waded through freely, as pure
        set dressing, while toughs can be taken a few at a time. Bosses should
        be epic in their own right, not just being linked challenges more often,
        but having an interesting ‘catch’ or ‘secret’ to overcoming them that
        provides the real test.</p></li><li><p>PCs start at level
        3.</p></li></ul><h2>Lethality</h2><p>In some stories, a single knife
        wound can end an adventurer’s career, taking months to heal if it
        doesn’t kill them outright. In others, pulp action heroes can jump off
        cliffs and grab blades with their bare hands, then laugh about it later
        in a tavern. Base Grimwild strikes a balance, with characters more
        durable than the commoners around them, but a few bad calls can still
        leave them on the ground.</p><h3>More Lethal</h3><ul><li><p>Use high and
        dire stakes more often. When weapons appear, the players should know
        that death could happen at any moment.</p></li><li><p>Healing often
        takes longer, and resurrection is impossible. When a PC is desperate,
        give them an urgent condition which will lead to dropped (4d bleeding
        out, 6d blacking out).</p></li><li><p>When a PC is dropped, they make a
        1d story roll, making death (or permanent injury) a coin
        flip.</p></li></ul><h3>Less Lethal</h3><ul><li><p>Use low stakes more
        often, even in combat if the heroes aren’t against strong
        foes.</p></li><li><p>PCs will rarely have permanent conditions, and
        resurrection is possible.</p></li><li><p>When a PC is dropped, they make
        a 3d story roll, giving much better odds to stay in the
        fight.</p></li></ul>
