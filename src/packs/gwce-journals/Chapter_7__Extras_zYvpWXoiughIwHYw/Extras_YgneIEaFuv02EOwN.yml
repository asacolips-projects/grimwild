  - sort: 400000
    name: Story Kits
    type: text
    _id: 9jmivgyXhF2GoSP1
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>These dynamic scenarios are modular, do-it-yourself scenarios
        designed to spark your creativity and get your imagination racing.
        They’re not fully fleshed-out adventures—they’re flexible frameworks
        loaded with evocative ideas, dramatic moments, and narrative twists that
        you shape into your own story. Each kit is packed with tension-filled
        prompts, intriguing setups, and compelling challenges, but it won’t hold
        your hand. Instead, it gives you the tools to craft a unique experience
        that fits your table. Pair them with the light GM tools earlier in this
        chapter to flesh them out even more before running them.</p><p>Story
        kits are great for one-shots or 2-3 session arcs. Some of them can even
        be expanded to kick off or take up a full campaign. Each of the story
        kits has the following parts:</p><ol><li><p><strong>Hooks:</strong>
        These are ways you can introduce the story kit to your
        players.</p></li><li><p><strong>Intro Text:</strong> This tells you the
        general idea of the story kit.</p></li><li><p>Pressure Pools: These
        pools keep the events unfolding in dramatic fashion, rolled to build
        tension and keep things moving. Roll them as it feels right to keep the
        scenario moving along or when prompted by the fiction. At 0d, the pool
        prompts one of the impact moves below. Pressure pools can use these
        icons:</p></li><li><p><strong>Useful Pieces:</strong> These are are
        props, NPCs, and more that form the backbone of the story kit. Each has
        a general description, and 3 narrative
        points.</p></li><li><p><strong>Set It Up:</strong> This lets you make
        some choices that drastically change how things play out. Each has 6 or
        12 toggles, and information on what each
        means.</p></li><li><p><strong>Example Challenges:</strong> These
        highlight likely situations but aren't prescriptive— use them as
        inspiration for what might unfold.</p></li><li><p><strong>GM
        Notes:</strong> This section usually blank, so the GM can record their
        own notes. Some story kits may also have special rules, guidance, or
        setting context here.</p></li><li><p><strong>Mix It Up:</strong> These
        options suggest twists to radically shift the scenario, perfect for
        replays.</p></li></ol>
