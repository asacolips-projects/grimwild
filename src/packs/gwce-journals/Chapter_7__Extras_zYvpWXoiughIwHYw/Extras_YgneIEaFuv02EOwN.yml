  - sort: 600000
    name: List of Arcana
    type: text
    _id: wT23ffGRSZtXiwfh
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Arcana are items imbued with magical power, covered on pg. 40. Below
        are some example arcana to use with your campaigns or look at as a basis
        for crafting your own. If a roll is ever needed and not supplied, use a
        relevant stat or make a story roll. Each arcana block
        has:</p><p>Palette: Colors associated with the item or its
        power.</p><p><strong>Details:</strong> A description of the arcana’s
        main ability. These items aren’t limited to only their descriptions, but
        when outside of them, each of their touchstones must be applied. Power
        pools refresh every session unless otherwise
        stated.</p><p><strong>Sensories:</strong> The swirl shows a list of
        descriptors for how the item looks, feels, or sounds. The hand gives
        actions to help bring the item into the
        scene.</p><p><strong>Activation:</strong> The unique method to channel
        magic from the item.</p><h2>Minor Arcana</h2><p>Minor arcana are capable
        of adding set dressing effects, producing a magical effect once per
        session, and similar limited abilities. Despite their limits, they
        remain rare— few mages bother to create them unless driven by personal
        passion or experiment. Their value lies not in their power, but in their
        utility.</p><p>Everflame Glove</p><p>Chatterfang Pendant</p><p>Magebane
        Shield</p><p>Poisonheart Choker</p><p>Starlight Flask</p><p>Cozy
        Ring</p><p>@@@col</p><p>Axe of the Silent Grave</p><p>Loyal
        Spear</p><p>Mask of the CHangeling</p><p>Springheel Jumpers</p><p>Lupine
        Cloak</p><p>Whisperknife</p><h2>Major Arcana</h2><p>Major arcana wield
        the power to bestow potent effects, or otherwise shape reality in grand
        ways with their magic. Mechanically, they often expand vantage in
        powerful ways, offer a 4d power pool, or offer a single potent effect
        each session. They are significant artifacts, rare and revered, often
        serving as the cornerstone of a mage’s work or a key element in a grand
        design. </p><p>Their presence in the world carries weight and they can
        only be gained by taking them from powerful foes, completing grand and
        dangerous rituals, or uncovering them in perilous locations.</p><p>1000
        Eye Circlet</p><p>Basilisk Eye Charm</p><p>Coin of the
        Roads</p><p>Crystalshard
        Sprig</p><p>Emberfang</p><p>Hovelsack</p><p>Robe of
        Pockets</p><p>Seeker's Compass</p><p>Siphon Whip</p><p>Spiderfriend
        Wand</p><p>Shimmershot Bow</p><p>Verdant
        Shield</p><p>Wavewalkers</p><p>Knockers</p><h2>Mythic
        Arcana</h2><p>These are the pinnacle of magical craftsmanship, some
        created at the beginning of time, or by the hands of the gods
        themselves. Mythic arcana are capable of unleashing grand, often
        ritual-level effects with devastating power. These artifacts transcend
        ordinary magic, often embodying ancient forces or taking part of
        world-shaping events. They are singular, legendary items—rarely created
        and even more rarely found. </p><p>These artifacts count as having
        <em>all functions</em>, when used outside of their description, and
        <em>all anchors</em> to ritual magic using their
        touchstones.</p><p>Bracelet of Blasting</p><p>Bugsnax</p><p>Crown of
        Stars</p><p>Discordant Flute</p><p>Fortune Ring</p><p>Gauntlets of the
        Storm</p><p>Gnarlstaff</p><p>Kaleidoscope Rod</p><p>Lich
        Skull</p><p>Ship in a Bottle</p><p>Spiritbinding Box</p><p>Staff of
        Mischief</p><p>Angelblade</p><p>Mirror Gaol</p>
