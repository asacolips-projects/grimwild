  - sort: 700000
    name: Potions and Other Expendables
    type: text
    _id: vL8g8eI3HrOLPw5d
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>To generate a random potion, roll 2d, taking the three words in the
        column and row, then choose two as the touchstones, discarding the
        third. Decide on a fitting function below as the last touchstone, then
        roll 4d for the potion qualities. As a minor, single-use arcana, it
        produces a single potent effect when
        used.</p><h3>Touchstones</h3><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.gSIcWrqRy0x5hL0O]{Potion
        Touchstones}</p><h3>Functions</h3><p><strong>Attack:</strong> deals
        diirect harm</p><p><strong>Enhance:</strong> temporarily boost or
        bestow</p><p><strong>Hinder:</strong> impede others or
        areas</p><p><strong>Influence:</strong> alter thoughts or
        perceptions</p><p><strong>Protect:</strong> defend from outside
        forces</p><p><strong>Restore:</strong> heal, cleanse, and
        mend</p><p><strong>Reveal:</strong> sense and reveal the
        hidden</p><p><strong>Summon:</strong> call objects, creatures, or
        forces</p><p><strong>Transform:</strong> change the subject's
        form</p><p><strong>Traverse:</strong> move quickly, or in a new
        way</p><h3>Potion Qualities</h3><p>Use the tables below, or
        @UUID[Compendium.grimwild.gwce-crucibles.RollTable.OkSXujarzbCeBAd9]{roll
        a potion here}.</p><table><thead><tr><th colspan="2"><p>It's a
        @UUID[Compendium.grimwild.gwce-crucibles.RollTable.uhRYX3wbg0LdJbMk]{____}
        @UUID[Compendium.grimwild.gwce-crucibles.RollTable.HDKWydLDHhTH0pYm]{____}</p></th><th
