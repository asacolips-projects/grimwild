  - sort: 300000
    name: Hex Flowers
    type: text
    _id: ORKVk6QRIYmGIorZ
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>These are an alternative to random tables. Instead of each result
        having a static chance, the result is dependent on starting position,
        changing as the game moves forward. Hex flowers are especially useful
        for exploration and solo-play, helping to give only semi-random answers
        to the questions you pose.</p><section class="grid
        grid-2col"><div><p><span style="color:rgb(110, 110, 110)"><em>What is
        today's weather like?</em></span></p><p><span style="color:rgb(110, 110,
        110)"><em>What will the terrain be in a day's
        travel?</em></span></p><p><span style="color:rgb(110, 110,
        110)"><em>Will the winds be in our favor today?</em></span></p><h3>How
        to Use Hex Flowers</h3><p>You may recognize these as a tool in other
        tabletop games. <em>Grimwild</em> strives to be smooth and
        quick-to-play—with that in mind, these hex flowers are smaller and more
        simple than others.</p><p>There are 7 hexagons, each representing an
        answer. The party begins at the bottom hex, and moves to an adjacent hex
        based on a 1d roll. If the resulting movement would take you off of the
        flower, you instead wrap around and appear in the same row or column on
        the side opposite. The bottom and top most hex have walls (as seen
        below) preventing you from moving off the hex in that direction, keeping
        you in place instead. This keeps the bottom hexes most common, and those
        at the top more rare. After landing on a hex (or staying on the same one
        because of a wall,) look to the key to see the result.</p></div><div
        style="justify-content:right"><img
        src="modules/grimwild/assets/img/hexflowers/hexflower-key.svg"
        width="192" height="192"><img
        src="modules/grimwild/assets/img/hexflowers/hexflower-4.svg"
        width="192" height="192"><p></p></div></section><section class="grid
        grid-3col"><div><img
        src="modules/grimwild/assets/img/hexflowers/hexflower-1.svg"
        width="192" height="192"></div><div><img
        src="modules/grimwild/assets/img/hexflowers/hexflower-2.svg"
        width="192" height="192"></div><div><img
        src="modules/grimwild/assets/img/hexflowers/hexflower-3.svg"
        width="192" height="192"></div></section><h3>Example Hex Flower
        Keys</h3><section class="grid grid-2col"><div><p
        style="text-align:center"><strong>Spring
        Weather</strong></p><ol><li><p>Bright and sunny</p></li><li><p>Sparse
        clouds</p></li><li><p>Cloudy</p></li><li><p>Cloudy and
        windy</p></li><li><p>Light rain</p></li><li><p>Heavy
        rain</p></li><li><p>Thunderstorms</p></li></ol></div><div><p
        style="text-align:center"><strong>Kalthazar
        Foothills</strong></p><ol><li><p>Rolling
        grasslands</p></li><li><p>Rolling grasslands</p></li><li><p>Light
        forest</p></li><li><p>Green hills</p></li><li><p>Cave
        entrance</p></li><li><p>Rocky outcropping</p></li><li><p>Goblin hideout
        (first time)</p></li></ol></div></section>
