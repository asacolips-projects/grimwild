  - sort: 500000
    name: Solo Rules
    type: text
    _id: JpxEuOKnJW1YJ95G
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>The base rules for Grimwild are already very well-suited for solo
        play. Check out the
        @UUID[Compendium.grimwild.gwce-journals.JournalEntry.unDWj5tvsH6ZOLYD.JournalEntryPage.jMmlxr0QujJmwyB6]{setting
        dials} and adjust the game as you see fit. Use the following guidance
        and rules changes to get started in playing your own
        game.</p><h2>Guidance</h2><p><strong>Make use of montage rolls.</strong>
        Set the perfect scope for the story you want to play out. Use these
        rolls connect scenes together in the story, and focus on playing out the
        aspects you enjoy.</p><p><strong>Use story rolls to see what happens
        next.</strong> When you’re unsure of how things will play out, or want
        to disclaim decision-making, look to story rolls to give you an
        idea.</p><p><strong>Use the crucibles for ideas.</strong> Your mind will
        gravitate towards what sounds like the most fun while you’re rolling on
        them. The GM Crucible is reprinted below for ease, but use any in the
        book to jump start your creativity.</p><p><strong>Focus on Quests, your
        string of story arcs.</strong> These give you a clear way to create
        purpose for your character (quests, pg. 194). Set a goal, then work
        towards hitting it. When you accomplish or fail a quest, skip forward in
        time and find another that’s pressing.</p><p><strong>Create 2 or 3
        factions</strong> to represent the outside world. Each should have
        faction pools, traits, and relevant NPCs. This helps keep the world from
        feeling static.</p><p><strong>Grab a few different colors of
        dice.</strong> This will help you track things like pools, and suspense,
        while making it easier to parse rolls.</p><h3>GM
        Crucible</h3><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.HrMWKbsgUTT4hVnW]{GM
        Crucible
        1}</p><p>@Crucible[Compendium.grimwild.gwce-crucibles.RollTable.8DIEqJed0Aee3VJc]{GM
        Crucible 2}</p><h2>Gampelay</h2><p>Core rules look largely the same,
        however there are guardrails added to replace the GM. The following
        rules are adding on top of base <em>Grimwild</em>.</p><p><strong>When a
        scene gets stale:</strong> <em>spend suspense—foreshadow a threat to
        come—montage to a low stakes scene—build up to a high stakes
        scene</em>.</p><p><strong>When you make an impact move</strong>, choose
        the most fitting consequence, or use the crucibles for ideas or
        randomized trouble (roll d8, pick between two). Remember that harm is
        reserved for particularly hard hits.</p><p><strong>On a messy</strong>,
        ask the following questions. If you answer ‘yes’ to any, make an impact
        move. If ‘no’, take
        <em><strong>suspense</strong></em>.</p><ul><li><p>Are you in a scene
        with a challenge?</p></li><li><p>Are you in the last task pool of a
        quest?</p></li><li><p>Do you have 3 or more
        suspense?</p></li></ul><p><strong>On a disaster, or with dire
        stakes</strong>, you take the normal consequences, plus: <em>roll a
        @UUID[.#quests]{peril pool }—harm</em>.</p><p
        style="text-align:center"><span
        style="font-size:large">Stakes</span></p><table><thead><tr><th><p>Low</p></th><th><p>Normal</p></th><th><p>High</p></th><th><p>Dire</p></th></tr></thead><tbody><tr><td><p>set
        dressing</p></td><td><p>set
        dressing</p></td><td><p>vex</p></td><td><p>lose
        something</p></td></tr><tr><td><p>lose
        something</p></td><td><p>collateral damage</p></td><td><p>collateral
        damage</p></td><td><p>condition (short)</p></td></tr><tr><td><p>one
        mark</p></td><td><p>vex</p></td><td><p>strain bond</p></td><td><p>two
        marks</p></td></tr><tr><td><p>strain bond</p></td><td><p>lose
        something</p></td><td><p>harm</p></td><td><p>condition
        (long</p></td></tr><tr><td><p>collateral damage</p></td><td><p>one
        mark</p></td><td><p>pressure
        pool</p></td><td><p>harm</p></td></tr><tr><td><p>condition
        (short)</p></td><td><p>lock
        down</p></td><td><p>twist</p></td><td><p>lock
        down</p></td></tr><tr><td><p>two marks</p></td><td><p>raise
        stakes</p></td><td><p>counter</p></td><td><p>condition
        (urgent)</p></td></tr><tr><td><p>pressure
        pool</p></td><td><p>harm</p></td><td><p>two harm</p></td><td><p>harm
        &amp;
        condition</p></td></tr></tbody></table><h3>Consequences</h3><p><strong>Set
        Dressing:</strong> The trouble is only narrative.</p><p><strong>Strain
        Bond:</strong> Relationship with a faction or ally is
        strained.</p><p><strong>Collateral Damage:</strong> The environment is
        destroyed or bystanders are hurt.</p><p><strong>Lose Something:</strong>
        Gear or resources are ruined or lost.</p><p><strong>Lock Down:</strong>
        You lose an opportunity or are forced to make a bad
        choice.</p><p><strong>Raise Stakes:</strong> The scene gets more tense,
        moving stakes up a level.</p><p><strong>Twist:</strong> There's an
        unexpected change for the worse, such as a
        betrayal.</p><p><strong>Pressure Pool:</strong> Create or roll a
        pool.</p><h2>Quests</h2><p>These are large-scale adventure goals that
        are broken up into smaller story arcs represented by task pools. These
        pools are linked, and used to track their progress. The number and size
        of the pools vary based on the quest difficulty (A daunting quest is
        4d+4d+6d). When you make meaningful progress towards an arc, roll that
        pool. When a task pool reaches 0d, the fiction changes as you get closer
        to completing the quest. Most task pools are locked behind the first,
        though some quests may have goals that can be completed in any order.
        Completing each story arc awards 1 XP, +1 bonus XP for completing the
        quest.</p><p>Each quest also has <em><strong>Peril</strong></em>, linked
        pressure pools to represent your antagonists’ plans. There should be 1
        fewer pool for peril than for the quest. The pool is triggered when the
        threat is ignored, significant time passes, or you suffer a meaningful
        failure at a critical moment while on the quest (often a disaster).
        Similar to challenges, quests may also have a fail state—a single break
        point that ends the quest. If the peril pools empty to 0d, or if the
        fail state occurs, the quest ends with the antagonists getting their
        way.</p><img
        src="modules/grimwild/assets/img/quests/quest-track-adaptive.svg"><section
        class="grid grid-2col"><div><img
        src="modules/grimwild/assets/img/quests/quest1-cureplague.svg"><p></p><img
        src="modules/grimwild/assets/img/quests/quest2-festival.svg"></div><div><p></p><img
        src="modules/grimwild/assets/img/quests/quest3-savethekingdom.svg"></div></section><h2>Solo
        Party Mode</h2><p>In this mode, your primary character, the PC, remains
        the main focus of the story, while the other party members are
        simplified <strong>side characters</strong>. This approach lets you
        create the social dynamics of an adventuring party without overwhelming
        complexity. The main PC is created as normal, while the secondary party
        members (usually 2-3) are streamlined. They have the following
        changes:</p><section class="grid
        grid-2col"><div><h3>Talents</h3><p>These side characters have no path,
        and no core talent. Instead, they start with one path talent. If you
        have a specific path fantasy in mind, consider using a half-core talent
        such as
        @UUID[Compendium.grimwild.gwce-talents.Item.k05clNwHNfu182P4]{Arcane
        Training}, or a more limited version of a path core talent. These
        character don't add XP or advance.</p><h3>Personality, Goals, and
        Drive</h3><p>There are no story arcs; the side PC only has 1 positive
        trait and desire, instead of 2. These coupled with their negative trait
        and desire are usually the only things that drive
        them.</p><h3>Connections</h3><p>Side characters only form
        <em><strong>bonds</strong></em> with the main PC, not each other.
        Additionally, individual wises aren't tracked— note their backgrounds
        only.</p><h3>Mechanics</h3><p>There are no <em><strong>weapon
        styles</strong></em>, no meta-currencies
        (<em><strong>spark</strong></em> and <em><strong>thread</strong></em>),
        and no <em><strong>marks</strong></em>.</p><p>When the side character
        would take a mark (such as from <em><strong>push yourself</strong></em>
        or an impact move), they instead take
        <em><strong>harm</strong></em>.</p></div><div><img
        src="modules/grimwild/assets/img/solo-sheet.webp"></div></section>
